# Relay local-sidecar (W2 milestone).
#
# Houses the local-only FastAPI + aiosqlite sidecar process that the Relay
# SDK and CLI attach to. Single instance per host, serialized via the
# four-state lockfile classifier (spec H.5). This pyproject.toml carries the
# minimal dependency surface needed for the W2.1 sub-feature (lockfile,
# atomic file writes, /health nonce challenge, FastAPI bootstrap); later W2
# sub-features (asyncio runtime, aiosqlite WAL, state engine, event log,
# quiesce, recovery) will land their own deps here.
#
# Per CLAUDE.md keystone invariants:
#   #3 manifest is source of truth, #8 atomic persistence via four primitives.
# Per W2.1 boundaries.md section 11.1 (ops-worker-backend scope) this package
# is owned by ops-worker-backend.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epochly-relay-sidecar"
version = "0.1.8"
description = "Relay local sidecar (W2.1 lockfile + spawn skeleton)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Epochly, Inc.", email = "engineering@epochly.com" },
]
dependencies = [
  # FastAPI + uvicorn power the local HTTP surface (the /health nonce
  # challenge in W2.1 and the full ingest surface in W2.2+). Pinned with a
  # conservative upper bound to keep the v0.1 dependency footprint reproducible.
  "fastapi>=0.115,<0.117",
  # uvicorn WITHOUT [standard] extras: the [standard] bundle pulls in uvloop
  # which installs a libuv-based asyncio loop + signal handlers that segfault
  # the ctypes statfs call in filesystem.py::_probe_macos after pytest-asyncio
  # tests run. v0.1 sidecar does not need uvloop/watchfiles/websockets perf;
  # plain uvicorn is sufficient.
  "uvicorn>=0.32,<0.34",
  # W2.2: outbound HTTP client. The sidecar instantiates exactly one shared
  # httpx.AsyncClient at lifespan startup (VAL-W2-013). httpx is already in
  # the transitive set via FastAPI's TestClient; we pin it directly so the
  # runtime contract is explicit.
  "httpx>=0.27,<0.29",
  # W2.2: asyncio-friendly SQLite driver. The lifespan startup hook runs
  # `PRAGMA journal_mode=WAL` BEFORE binding the HTTP listener (VAL-W2-014).
  # Full schema lands in W2.3+; W2.2 only enables WAL on an empty DB.
  "aiosqlite>=0.20,<0.22",
  # Cross-platform exclusive file locking. portalocker is the standard
  # portable wrapper around fcntl.flock (POSIX) and msvcrt.locking (Windows).
  # CLAUDE.md mandates Windows native as a P0 platform; this dependency is
  # the abstraction that lets local_atomic_file_write hold a shared lock on
  # all three OSes.
  "portalocker>=2.10,<3",
  # Schemas package: the W1 EventLogEntry Pydantic model is reused by the
  # local JSONL event log writer (spec H.5 "local-only event log").
  "epochly-relay-schemas",
  # SDK package: the server-side ReDoS budget enforcement at
  # POST /v1/redaction-policies reuses ``relay.redaction_budget.
  # evaluate_matcher_budget`` rather than duplicating the 50 ms
  # wall-clock budget logic (VAL-V3M5-004, spec AI line 5665).
  "epochly-relay",
  # W2.5: zstandard compression for the rolling event-log archive
  # (VAL-W2-040). Pinned with a conservative upper bound to keep the wire
  # format stable across patch releases.
  "zstandard>=0.22,<0.24",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  # W2.2: async test support for lifespan + asyncio gather tests.
  "pytest-asyncio>=0.24,<0.26",
  "httpx>=0.27,<0.29",  # FastAPI TestClient transport + async client tests
]

[tool.hatch.build.targets.wheel]
packages = ["relay_sidecar"]

[tool.hatch.build.targets.sdist]
include = [
  "relay_sidecar",
  "README.md",
]

[tool.uv.sources]
epochly-relay-schemas = { workspace = true }
epochly-relay = { workspace = true }
