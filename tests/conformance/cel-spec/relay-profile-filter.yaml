# W17.3 Relay CEL profile filter (VAL-W17-011).
#
# Partitions every vector in celspec_vectors.json into one of two
# disjoint sets:
#   - included: vectors inside Relay's CEL profile. cel-python AND
#     cel-js MUST both pass. Per-vector parity is enforced by
#     tests/conformance/cel-spec/test_w17_3_celspec_corpus.py.
#   - excluded: vectors outside Relay's CEL profile. Each MUST carry
#     a `reason` from the closed enum below AND a `citation` pointing
#     to the spec/eng-plan clause that justifies the exclusion. An
#     unjustified exclusion fails the suite.
#
# Closed enum for `reason` (kept in sync with the validator at
# test_w17_3_celspec_corpus.py::test_profile_filter_excluded_entries_carry_reason_and_citation):
#   - profile-rejects-dyn
#   - profile-rejects-timestamp
#   - profile-rejects-duration
#   - profile-rejects-protobuf-message
#   - profile-rejects-regex-backreference
#   - profile-rejects-bytes-literal
#   - profile-rejects-double-precision-edge
#   - profile-rejects-uint-arithmetic
#   - upstream-vector-uses-untyped-bindings
#   - profile-rejects-macro-with-side-effect-shadow
#
# Schema:
#   included:
#     - vector_id: <namespaced id matching celspec_vectors.json>
#       note: <free-text justification why this vector is in profile>
#   excluded:
#     - vector_id: <namespaced id>
#       reason: <enum value>
#       citation: <spec/eng-plan section reference>

included:
  - vector_id: arith/add/int_one_plus_two
    note: integer addition is core CEL surface; in profile
  - vector_id: arith/sub/int_five_minus_three
    note: integer subtraction is core CEL surface
  - vector_id: arith/mul/int_four_times_five
    note: integer multiplication is core CEL surface
  - vector_id: arith/div/int_ten_by_two
