    note: integer modulo is core CEL surface
  - vector_id: arith/neg/int_neg_five
    note: unary negation is core CEL surface
  - vector_id: arith/zero_add
    note: zero-edge arithmetic is core CEL surface
  - vector_id: arith/zero_self_eval
    note: zero literal evaluation is core CEL surface
  - vector_id: arith/large_add
    note: 1M + 1M is well below JS Number MAX_SAFE_INTEGER (2^53)
  - vector_id: arith/precedence_mul_first
    note: operator precedence is core CEL surface
  - vector_id: arith/paren_override
    note: explicit grouping is core CEL surface
  - vector_id: cmp/eq_int_true
    note: integer equality is core CEL surface
  - vector_id: cmp/eq_int_false
    note: integer inequality via == is core CEL surface
  - vector_id: cmp/ne_int_true
    note: integer != is core CEL surface
  - vector_id: cmp/lt_int
    note: integer < is core CEL surface
  - vector_id: cmp/le_int_equal
