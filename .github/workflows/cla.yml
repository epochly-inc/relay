name: "CLA Assistant"

# Per spec lines 264-298: external contribution gate (CLA Assistant Lite).
# Paired with the DCO Bot installed separately from the GitHub Marketplace
# (no workflow file needed for DCO). Both checks are required by branch
# protection on main.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://relay.epochly.com/legal/cla'
          branch: 'main'
          allowlist: 'dependabot[bot],github-actions[bot],renovate[bot]'
          remote-organization-name: epochly-inc
          remote-repository-name: relay-cla-signatures
          signed-commit-message: 'CLA signature for $contributorName ($pullRequestNo)'
          custom-notsigned-prcomment: |
            Thanks for the PR! Before we can merge, you'll need to sign the
            [Relay Contributor License Agreement](https://relay.epochly.com/legal/cla)
            (mirrored in this repo at [CLA.md](../../CLA.md)).

            Reply in this PR with the exact phrase below to sign:

            `I have read the CLA Document and I hereby sign the CLA`

            Your signature is recorded once and applies to all future PRs
            from your GitHub account.

            Note: every commit must also include a `Signed-off-by:` DCO
            trailer (`git commit -s`). See [CONTRIBUTING.md](../../CONTRIBUTING.md).
