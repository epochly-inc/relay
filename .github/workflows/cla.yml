name: "CLA Assistant"

# External contribution gate (CLA Assistant Lite).
# Paired with the DCO check workflow at .github/workflows/dco.yml.
# Both checks are required by branch protection on main.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per spec keystone #11. This action runs on
      # pull_request_target with write permissions to contents,
      # pull-requests, and statuses -- a force-moved v2.6.1 tag would
      # let an attacker execute arbitrary code against the repository.
      # SHA ca4a40a == v2.6.1 (resolved 2026-05-16 via
      # https://api.github.com/repos/contributor-assistant/github-action/git/refs/tags/v2.6.1);
      # rotate via a deliberate PR.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures land in this repository at signatures/version1/cla.json
          # per the promise in CLA.md (line 14). Storing in-repo means the
          # workflow needs only the default GITHUB_TOKEN -- no Personal
          # Access Token and no separate signatures repository.
          path-to-signatures: 'signatures/version1/cla.json'
          # CLA document is the CLA.md file at the repository root.
          path-to-document: 'https://github.com/epochly-inc/relay/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot],github-actions[bot],renovate[bot]'
          signed-commit-message: 'CLA signature for $contributorName ($pullRequestNo)'
          custom-notsigned-prcomment: |
            Thanks for the PR! Before we can merge, you'll need to sign the
            [Relay Contributor License Agreement](https://github.com/epochly-inc/relay/blob/main/CLA.md).

            Reply in this PR with the exact phrase below to sign:

            `I have read the CLA Document and I hereby sign the CLA`

            Your signature is recorded once and applies to all future PRs
            from your GitHub account.

            Note: every commit must also include a `Signed-off-by:` DCO
            trailer (`git commit -s`). See
            [CONTRIBUTING.md](https://github.com/epochly-inc/relay/blob/main/CONTRIBUTING.md).
