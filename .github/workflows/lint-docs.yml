# Relay v0.1 OSS -- Docs lint workflow (VAL-DOCS-M4-008).
#
# Wires the banned-copy lint (scripts/lint-banned-copy.py) and the codebase-
# alignment audit (scripts/docs/audit-codebase-alignment.py) into CI so that
# no PR can merge documentation containing the forbidden product copy from
# spec section J.5 (CLAUDE.md banned pattern #9) and so that every concrete
# code-reference claim in docs/ is verified against current source.
#
# Triggers are path-scoped: only changes to docs, the lint scripts, or this
# workflow file rebuild. Unrelated source edits skip the job.
#
# Permissions: contents:read only. No write scope; this is a read-only gate.
#
# Action pins (match repo convention; cf. docs.yml, tier-budgets.yml):
#   actions/checkout@v4
#   actions/setup-python@v5
#
# Spec citations:
#   - plan.md Wave 4 deliverable 42 (banned-copy lint wired into CI)
#   - contract VAL-DOCS-M4-008 (banned-copy lint extension is wired into CI)
#   - CLAUDE.md banned pattern #9 (no banned product copy)

name: "docs-lint"

on:
  # Fix #12 (roborev 350, structural-review B, codex): banned-copy lint
  # and the codebase-alignment audit cover MANY surfaces beyond docs/.
  # Specifically, banned-copy scans 9 surfaces (CLI source, READMEs,
  # release-notes, etc.); the audit verifies citations against schemas,
  # error-codes, OpenAPI, CLI source, and the spec-sections vendor file.
  # If we only triggered on docs/* + 2 scripts, a PR adding banned copy
  # to packages/cli/README.md or breaking the error-codes registry would
  # NEVER schedule this gate. We run the lint on every PR; the audit
  # also runs on every PR because doc-source claims can be invalidated
  # by upstream changes to any of those surfaces.
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banned-copy:
    name: "banned-copy lint + alignment audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "setup python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "install uv"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "install repo deps"
        # --all-extras pulls every package's [test] extra so the audit's
        # Layer-2 executable-snippet pass can import pytest + transitive
        # test deps when a snippet references them. Without --all-extras
        # CI reports phantom P0s on Layer 2 that don't reproduce locally.
        run: uv sync --all-packages --all-extras

      - name: "banned-copy lint (docs)"
        run: python scripts/lint-banned-copy.py

      - name: "codebase-alignment audit (all waves, layers 1+2+4)"
        # Fix #25 (roborev 350, structural-review B): POSIX exit codes are
        # truncated to the low 8 bits, so sys.exit(s['p0']) wraps modulo
        # 256 and exactly 256 / 512 / ... P0 findings would falsely exit 0.
        # Use a boolean exit code instead: 1 on any P0/P1, 0 only on clean.
        run: |
          # set +e so the audit's non-zero exit doesn't trip bash -e
          # before the Python diagnostic runs and prints findings.
          set +e
          uv run python scripts/docs/audit-codebase-alignment.py \
            --all-waves --layers 1,2,4 --json \
            > /tmp/audit.json
          AUDIT_EXIT=$?
          set -e
          if [ ! -s /tmp/audit.json ]; then
            echo "ERROR: audit produced empty output (exit code: $AUDIT_EXIT)"
            exit 1
          fi
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/audit.json'))
          s = d['summary']
          print(f\"p0={s['p0']} p1={s['p1']} p2={s['p2']} files={s['files_audited']}\")
          # Print every P0 / P1 finding so CI logs surface root cause
          for f in d.get('findings', []):
              if f['severity'] in ('P0', 'P1'):
                  print(f\"  {f['severity']} {f['file']}:{f['line']} -- {f['message'][:200]}\")
          sys.exit(1 if (s['p0'] or s['p1']) else 0)
          "
