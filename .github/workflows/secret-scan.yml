# Relay v0.1 OSS -- Secret Scan Workflow (VAL-W12-035 / VAL-W12-036)
#
# Pre-merge guard that scans diffs and the full tracked tree for
# trust-anchor key material AND long-lived publish credentials. A PR
# that attempts to add a `.pem`, `.key`, `.p12`, KMS URN, or TSA
# credential pattern is blocked at this gate even if the file lives
# outside `tests/fixtures/`.
#
# Per CLAUDE.md banned pattern 14: signing keys, KMS references for
# those keys, TSA partner credentials, and transparency-log custody
# keys MUST NOT be committed to either repository. This workflow is the
# structural enforcement for that rule.
#
# Why this exists separately from the per-feature guards:
#   The per-feature guards (check-pypi-publish-workflow.py,
#   check-sidecar-bundle.py, etc.) enforce the contract surface for
#   their own assertions. The secret-scan workflow enforces the
#   cross-cutting rule that no trust-anchor material EVER enters the
#   repo, regardless of which feature is touched. A PR that adds a
#   .pem outside tests/fixtures/ trips this guard before any
#   per-feature guard runs.
#
# Allowed exception: files explicitly named `*_FIXTURE.*` under
# `tests/` are accepted as test fixtures. The PR description must
# explain why the fixture is needed.
#
# Spec citations:
#   - CLAUDE.md banned pattern 14
#   - CLAUDE.md keystone invariant 11
#   - Contract VAL-W12-035 / VAL-W12-036
#   - Spec section AO.4 (trust anchor is not in OSS code)

name: "secret-scan"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # gitleaks scan with the project's custom ruleset. Blocks the merge
  # on any non-fixture match of the trust-anchor key material patterns
  # AND the long-lived publish credential patterns.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: "gitleaks: trust-anchor key material + publish creds"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run gitleaks (custom ruleset)"
        # SHA-pinned per CLAUDE.md keystone #11 supply-chain discipline:
        # a mutable @v2 tag would let a compromise of the gitleaks-action
        # repo silently alter our trust-anchor scan behavior. Pinned to
        # the commit SHA of v2.3.9 (resolved via
        # ``gh api repos/gitleaks/gitleaks-action/git/refs/tags/v2``).
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        # The gitleaks-action's default scan mode is `pull-request` for
        # PR events and `full-history` for push events. The custom
        # config at .github/gitleaks/relay-trust-anchor.toml covers:
        #   - PEM-encoded RSA/EC private keys (.pem, .key)
        #   - PKCS#12 archives (.p12, .pfx, .pkcs12)
        #   - Java keystores (.jks)
        #   - X.509 certificates (.cer, .crt)
        #   - PKCS#8 raw private keys (.p8)
        #   - PGP/GPG key material (.pgp, .asc, .gpg)
        #   - AWS KMS URNs (arn:aws:kms:...)
        #   - GCP KMS URNs (projects/*/locations/*/keyRings/...)
        #   - Azure Key Vault URLs (https://*.vault.azure.net/keys/...)
        #   - TSA credential patterns (X-API-Key.*sectigo, X-API-Key.*digicert)
        #   - PyPI long-lived tokens (pypi-*)
        #   - npm long-lived tokens (npm_*)
        #
        # gitleaks-action@v2 requires GITLEAKS_LICENSE for organization
        # repos (the action reads it from env, not a `with:` input). The
        # full git history is provided by the checkout step's
        # `fetch-depth: 0` above -- gitleaks-action does NOT accept a
        # `fetch-depth` input (passing one trips an "Unexpected input"
        # warning), so it is not set here.
        env:
          GITLEAKS_CONFIG: .github/gitleaks/relay-trust-anchor.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------------
  # Cross-check: file-extension scan. Defense-in-depth against a
  # gitleaks ruleset gap. Greps the tree directly for trust-anchor
  # file extensions per the explicit list in VAL-W12-035.
  # ---------------------------------------------------------------------------
  extension-scan:
    name: "extension-scan: trust-anchor file extensions"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Scan for trust-anchor file extensions"
        shell: bash
        run: |
          set -euo pipefail
          # Exclude tests/fixtures/, explicitly-named *_FIXTURE.* files,
          # AND production TSA chain public certs that legitimately
          # ship with the verifier wheels per VAL-W12-035 evidence
          # clause. The TSA chains are public certificate-only files
          # (PEM with no PRIVATE KEY blocks); verified via the
          # banned-pattern grep in the next "Scan for KMS URN" step
          # which would also catch any PRIVATE KEY block.
          HITS=$(git ls-files \
            | grep -E '\.(pem|key|p12|pfx|pkcs12|jks|cer|p8|crt|pgp|asc|gpg)$' \
            | grep -vE '(tests/fixtures/|_FIXTURE\.|packages/verifier/src/relay_verifier/tsa_chain/tsa-chain\.pem$|packages/verifier/trust/tsa-chain\.pem$|packages/verifier-typescript/src/tsa_chain/tsa-chain\.pem$)' \
            || true)
          if [ -n "${HITS}" ]; then
            echo "FAIL: RELAY-RELEASE-035 trust-anchor file extension found in non-fixture path:"
            echo "${HITS}"
            exit 1
          fi
          echo "PASS: no trust-anchor file extensions outside tests/fixtures/"

      - name: "Scan for KMS URN patterns"
        shell: bash
        run: |
          set -euo pipefail
          HITS=$(git ls-files \
            | xargs -I{} grep -lE 'arn:aws:kms|/keyRings/|vault\.azure\.net/keys|sectigo|digicert' {} 2>/dev/null \
            | grep -vE '(tests/fixtures/|_FIXTURE\.|docs/release/sectigo-tsa-fallback\.md|docs/release/runbook\.md|docs/release/trust-anchor-governance\.md|docs/legal/trust-anchor-governance\.md|scripts/check-sidecar-bundle\.py|scripts/check-runbook-exists\.py|\.github/workflows/secret-scan\.yml|\.github/workflows/release-sidecar-bundle\.yml|packages/schemas/raw/error-codes\.yaml|packages/schemas/python/tests/test_v2m01_evidence_timestamps\.py|tests/release/test_w12_5_sidecar_bundle_workflow\.py)' \
            || true)
          if [ -n "${HITS}" ]; then
            echo "FAIL: RELAY-RELEASE-035 KMS / TSA credential pattern found:"
            echo "${HITS}"
            exit 1
          fi
          echo "PASS: no KMS / TSA credential patterns outside documented allowlist"
