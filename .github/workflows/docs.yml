# Relay v0.1 OSS -- Documentation build + GitHub Pages publish (VAL-DOCS-M4-005).
#
# Builds the MkDocs Material site on every PR (preview artifact) and deploys
# to GitHub Pages on merge to main at https://epochly-inc.github.io/relay/.
#
# Triggers are path-scoped so unrelated source changes do not rebuild docs.
#
# Permissions follow the GitHub Pages requirement set:
#   contents: read   - checkout
#   pages: write     - publish to GitHub Pages
#   id-token: write  - OIDC token for actions/deploy-pages
#
# Concurrency: the 'pages' group prevents overlapping deploys. We do NOT
# cancel in-progress deploys, because cancelling mid-publish can leave the
# Pages environment in a half-deployed state.
#
# Action pins (match repo convention; cf. tier-budgets.yml,
# conformance-release-block.yml):
#   actions/checkout@v4
#   actions/setup-python@v5
#   actions/configure-pages@v5
#   actions/upload-pages-artifact@v3
#   actions/deploy-pages@v4
#
# Spec citations:
#   - plan.md Wave 4 deliverable 38 (publish infrastructure)
#   - contract VAL-DOCS-M4-005 (build + deploy to GH Pages)
#   - CLAUDE.md banned pattern #9 (no banned product copy in CI output)

name: "docs"

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      # Inputs to the regenerated reference pages: changes to the error-
      # code registry, the CLI source (whose `--json help` output the
      # CLI reference is built from), or the generator scripts themselves
      # must rebuild + publish docs so the deployed reference doesn't go
      # stale.
      - "scripts/docs/build-error-reference.py"
      - "scripts/docs/build-cli-reference.py"
      - "packages/schemas/raw/error-codes.yaml"
      - "packages/cli/**"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - "scripts/docs/build-error-reference.py"
      - "scripts/docs/build-cli-reference.py"
      - "packages/schemas/raw/error-codes.yaml"
      - "packages/cli/**"
  workflow_dispatch:

# Fix #13 (codex review): default workflow permissions are read-only.
# The deploy job overrides to grant pages:write + id-token:write only when
# it actually publishes. PR builds (which run untrusted code via PR YAML
# changes / docs config) no longer carry the Pages/OIDC write scope.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build the docs site. Runs on every PR (preview artifact) and on push to
  # main (artifact consumed by the deploy job below). Read-only.
  # ---------------------------------------------------------------------------
  build:
    name: "build mkdocs site"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "setup python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "install uv"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "install docs deps"
        run: uv sync --extra docs --all-packages

      # Regenerate the gitignored reference pages (error-code + CLI
      # subcommand pages) before building so the DEPLOYED Pages site
      # includes them. They are generated artifacts (.gitignore
      # excludes docs/reference/errors/RELAY-*/); without this the
      # published site is missing the error-code pages and every
      # external link to relay.epochly.com/.../errors/<CODE> 404s.
      - name: "regenerate reference pages"
        run: |
          uv run python scripts/docs/build-error-reference.py
          uv run python scripts/docs/build-cli-reference.py

      - name: "build docs (strict)"
        run: uv run mkdocs build --strict

      - name: "upload pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site/"

  # ---------------------------------------------------------------------------
  # Deploy the built artifact to GitHub Pages. Only runs on push to main; PR
  # builds stop at the artifact-upload step so contributors get a preview
  # without publishing.
  #
  # Fix #13: pages:write + id-token:write are scoped to THIS job only, so
  # PR builds (which run the `build` job under contents:read) cannot
  # publish or mint an OIDC token. configure-pages moved here too because
  # it requires the same elevated scope and only ever needs to run when
  # deploying.
  # ---------------------------------------------------------------------------
  deploy:
    name: "deploy to github pages"
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "configure pages"
        uses: actions/configure-pages@v5

      - name: "deploy to github pages"
        id: deployment
        uses: actions/deploy-pages@v4
