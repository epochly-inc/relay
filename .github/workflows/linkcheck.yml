# Relay v0.1 OSS -- Docs linkcheck CI gate (VAL-DOCS-M4-007).
#
# Runs lychee against docs/ on every PR that touches docs/, the lychee config,
# or this workflow itself. Also runs weekly (Monday noon UTC) to catch link
# rot in external references between PRs.
#
# Triggers are path-scoped so unrelated source changes do not invoke lychee.
#
# Permissions:
#   contents: read   - checkout
#
# Action pins (match repo convention; cf. docs.yml, tier-budgets.yml):
#   actions/checkout@v4
#   actions/setup-python@v5
#   lycheeverse/lychee-action@v2
#
# Spec citations:
#   - plan.md Wave 4 deliverable 41 (linkcheck)
#   - contract VAL-DOCS-M4-007 (linkcheck CI gate fails on broken links)
#   - CLAUDE.md banned pattern #9 (no banned product copy in CI output)

name: "docs-linkcheck"

on:
  pull_request:
    # Fix #26 (roborev 351, structural-review B P2): the published site
    # may have broken links even when source docs/ does not, because
    # mkdocs.yml exclude_docs can drop linked assets. Trigger on mkdocs
    # config + pyproject changes too, and run the check against site/
    # after building.
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".lychee.toml"
      - ".github/workflows/linkcheck.yml"
      # Linkcheck builds the site from the regenerated reference pages,
      # so a change in their INPUTS (error-code registry, CLI source) or
      # their generators must run linkcheck too -- otherwise a broken
      # cross-link in regenerated output can land on main unchecked.
      - "scripts/docs/build-error-reference.py"
      - "scripts/docs/build-cli-reference.py"
      - "packages/schemas/raw/error-codes.yaml"
      - "packages/cli/**"
  schedule:
    # Weekly Monday noon UTC -- catches link rot between PRs.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: "lychee linkcheck"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "checkout"
        uses: actions/checkout@v4

      - name: "setup python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "install uv"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fix #26: build the mkdocs site so lychee checks the PUBLISHED
      # links, not just source. mkdocs.yml exclude_docs can drop linked
      # assets and lychee on docs/ alone would not catch that 404.
      - name: "install docs deps"
        run: uv sync --extra docs --all-packages

      # Regenerate the gitignored reference pages (error-code +
      # CLI subcommand pages) before building. They are generated
      # artifacts (.gitignore excludes docs/reference/errors/RELAY-*/)
      # so a fresh CI checkout lacks them; without regeneration the
      # built site is missing those pages and every doc cross-link to
      # them 404s under lychee.
      - name: "regenerate reference pages"
        run: |
          uv run python scripts/docs/build-error-reference.py
          uv run python scripts/docs/build-cli-reference.py

      - name: "build docs (strict)"
        run: uv run mkdocs build --strict

      - name: "run lychee on built site"
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--config .lychee.toml --no-progress site/"
          fail: true

      # Also run a quick source-level lychee pass as a fast-fail; catches
      # obviously-malformed links before the slower build+published-site
      # check on the rare PR where source has bugs the build masks.
      - name: "run lychee on source docs (fast-fail)"
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--config .lychee.toml --no-progress docs/"
          fail: true
