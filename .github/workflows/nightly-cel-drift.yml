# Relay v0.1 OSS -- Nightly cel-spec drift workflow (VAL-W17-014,
# VAL-CWC-P6REMOVE-012).
#
# Purpose (post-M6 single-engine WASM cutover): the ONLY CEL engine is the
# pinned wasm artifact (relay_cel_wasm, shipped as relay_contracts package
# data) loaded under wasmtime (Python host) and Node (TS host). The legacy
# Python and TypeScript CEL libraries were both REMOVED in M6, so there is
# no upgradable upstream CEL package left to canary -- an "install the
# latest upstream CEL package" step would monitor a dependency that no
# longer exists (dead CI). This workflow is therefore RETARGETED to the
# wasm engine's PINNED inputs:
#
#   1. The wasm artifact identity (sha256 of the shipped relay_cel_wasm
#      package data) MUST equal the checked-in pin (WASM_PINNED_SHA256),
#      and the wasmtime host runtime version is recorded as provenance.
#   2. The cel-spec conformance corpus still runs on that wasm path as a
#      nightly canary -- the corpus / environment can drift even though the
#      engine is pinned.
#   3. The upstream cel-spec commit pin (tests/conformance/cel-spec/
#      PINNED_COMMIT.txt) MUST still resolve on the google/cel-spec remote;
#      a deleted upstream tag is a meaningful drift signal for the corpus
#      that the pinned wasm is measured against.
#
# On drift the workflow:
#   1. Fails with a structured drift report saved as a workflow
#      artifact (drift-report.json).
#   2. Opens a GitHub issue labelled `area:conformance-drift` and
#      assigns it to the CODEOWNER for /packages/contracts/ (per
#      C-MIN-007 alerting-path reconciliation and contract VAL-W17-014).
#
# Spec citations:
#   - contract VAL-W17-014 (nightly drift detection)
#   - contract VAL-CWC-P6REMOVE-012 (wasm-only retarget; no removed-dep canary)
#   - eng plan CQ1 (upstream CEL semantic / corpus drift detection)
#   - CLAUDE.md keystone invariant 1 (manifest is source of truth)
#
# Manual trigger via workflow_dispatch is supported so an operator can
# re-run after a pin bump without waiting for the cron.

name: "nightly-cel-drift"

on:
  schedule:
    # 07:13 UTC daily. Offset from the top of the hour to spread
    # GitHub-Actions runner load. UTC chosen so the run completes
    # well before US-West business start.
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      open_issue_even_on_pass:
        description: "Open an info-only issue even when no drift is detected (debug helper)."
        required: false
        default: "false"

permissions: {}

jobs:
  drift-detect:
    name: "drift-detect: pinned wasm engine + cel-spec corpus canary"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Setup Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "install uv"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Install pinned workspace (baseline)"
        shell: bash
        run: |
          set -euo pipefail
          # packages/contracts depends on the workspace sibling
          # epochly-relay-schemas, which is NOT published to PyPI. A plain
          # `pip install -e packages/contracts` therefore fails resolving
          # that dependency. uv sync installs the whole workspace
          # (resolving siblings via the workspace) from uv.lock, including
          # wasmtime + the packaged pinned wasm engine -- exactly the
          # baseline this drift check needs. The TS host (Node) loads the
          # same packaged wasm, so npm install pulls the workspace deps for
          # the vitest corpus mirror below.
          uv sync --all-packages --all-extras
          npm ci --workspace=packages/contracts-typescript --include-workspace-root

      - name: "Record pinned wasm engine provenance + run corpus canary"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .drift
          # Run the cel-spec conformance suite on the PINNED wasm engine
          # and capture per-vector results. A non-zero exit on the pinned
          # run is itself a bug (the pinned run should always pass); we
          # surface it as drift.
          uv run pytest tests/conformance/cel-spec/test_w17_3_celspec_corpus.py \
            -q --tb=line --junitxml=.drift/pinned-pytest.xml || true
          # Capture the single CEL-engine provenance: the PINNED wasm
          # artifact (sha256 of the shipped relay_cel_wasm package data,
          # plus the checked-in pin it must equal) and the wasmtime host
          # runtime version. The legacy Python and TypeScript CEL libraries
          # were REMOVED in M6, so there is no upstream-CEL-package version
          # to record -- the wasm pin IS the engine identity.
          uv run python -c "
          import hashlib
          import importlib.metadata as m
          from relay_contracts.wasm_artifact import (
              WASM_PINNED_SHA256,
              resolve_packaged_wasm_path,
          )
          path = resolve_packaged_wasm_path()
          actual = (
              hashlib.sha256(path.read_bytes()).hexdigest()
              if path is not None
              else '<missing>'
          )
          print('relay_cel_wasm sha256', actual)
          print('relay_cel_wasm pinned', WASM_PINNED_SHA256)
          print('wasmtime', m.version('wasmtime'))
          if actual != WASM_PINNED_SHA256:
              raise SystemExit(
                  'RELAY-W17-3-WASM-PIN-MISMATCH: packaged wasm does not '
                  'hash to WASM_PINNED_SHA256'
              )
          " > .drift/wasm-engine.txt
          cat .drift/wasm-engine.txt

      - name: "Run cel-spec corpus on the wasm engine (Python + TS hosts)"
        id: corpus-run
        shell: bash
        run: |
          set -euo pipefail
          set +e
          # Both hosts evaluate via the SAME pinned wasm. The Python run is
          # the corpus canary on the wasmtime host; the vitest run is the
          # corpus canary on the Node host. Byte-parity between them is by
          # construction (one engine), so a divergence here is a real
          # corpus/environment drift signal -- not an upstream-package bump
          # (there is no upstream CEL package left to bump).
          uv run pytest tests/conformance/cel-spec/test_w17_3_celspec_corpus.py \
            -q --tb=line --junitxml=.drift/wasm-pytest.xml \
            -o "junit_logging=system-out" \
            > .drift/wasm-pytest.stdout 2>&1
          PY_EXIT=$?
          (cd packages/contracts-typescript && npx vitest run test/w17_3_celspec_corpus.test.ts \
            --reporter=verbose --reporter=junit --outputFile=../../.drift/wasm-vitest.xml \
            > ../../.drift/wasm-vitest.stdout 2>&1)
          TS_EXIT=$?
          set -e
          echo "py_exit=${PY_EXIT}" >> "${GITHUB_OUTPUT}"
          echo "ts_exit=${TS_EXIT}" >> "${GITHUB_OUTPUT}"
          echo "CORPUS-RUN: py_exit=${PY_EXIT} ts_exit=${TS_EXIT}"

      - name: "Print corpus-canary logs"
        # The artifact upload is unreliable in this org (retention), so
        # surface the captured conformance output inline. This is the
        # primary diagnosis surface when py_exit/ts_exit are non-zero:
        # without it the only signal is the bare exit code.
        if: always()
        shell: bash
        run: |
          echo "===== wasm-engine (pinned, sole CEL engine) ====="; cat .drift/wasm-engine.txt 2>/dev/null || true
          echo "===== wasm-pytest.stdout ====="; cat .drift/wasm-pytest.stdout 2>/dev/null || true
          echo "===== wasm-vitest.stdout (tail 80) ====="; tail -80 .drift/wasm-vitest.stdout 2>/dev/null || true

      - name: "Build drift report"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json, pathlib, datetime
          out = {
            "_schema_version": 1,
            "report_kind": "celspec-drift",
            "generated_at_utc": datetime.datetime.utcnow().isoformat() + "Z",
            "wasm_engine": pathlib.Path(".drift/wasm-engine.txt").read_text().strip() if pathlib.Path(".drift/wasm-engine.txt").exists() else "<missing>",
            "pytest_wasm_stdout_tail": pathlib.Path(".drift/wasm-pytest.stdout").read_text()[-4000:] if pathlib.Path(".drift/wasm-pytest.stdout").exists() else "<missing>",
            "vitest_wasm_stdout_tail": pathlib.Path(".drift/wasm-vitest.stdout").read_text()[-4000:] if pathlib.Path(".drift/wasm-vitest.stdout").exists() else "<missing>",
            "alert_label": "area:conformance-drift",
            "workflow_run_url": __import__("os").environ.get("GITHUB_SERVER_URL", "") + "/" + __import__("os").environ.get("GITHUB_REPOSITORY", "") + "/actions/runs/" + __import__("os").environ.get("GITHUB_RUN_ID", ""),
          }
          pathlib.Path(".drift/drift-report.json").write_text(json.dumps(out, indent=2, sort_keys=True))
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: "Upload drift report artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-cel-drift-report
          path: .drift/

      - name: "Verify upstream pin still exists on cel-spec remote"
        id: upstream-pin-check
        shell: bash
        run: |
          set -euo pipefail
          # VAL-W17-010 nightly enforcement: the SHA recorded in
          # PINNED_COMMIT.txt MUST still resolve on
          # https://github.com/google/cel-spec. If google deletes the
          # tag/branch, this fails with RELAY-CELSPEC-PIN-MISSING. The
          # pinned wasm engine is measured against this corpus, so a vanished
          # upstream pin is a meaningful wasm-corpus drift signal.
          PIN=$(grep -v '^#' tests/conformance/cel-spec/PINNED_COMMIT.txt | grep -E '^[0-9a-f]{40}$' | head -1)
          echo "Resolving pin ${PIN} against google/cel-spec..."
          if ! git ls-remote https://github.com/google/cel-spec | grep -q "${PIN}"; then
            echo "::error::RELAY-CELSPEC-PIN-MISSING: pinned commit ${PIN} not found at https://github.com/google/cel-spec"
            echo "pin_missing=true" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "pin_missing=false" >> "${GITHUB_OUTPUT}"
          echo "Pin ${PIN} resolves on upstream"

      - name: "Open GitHub issue on drift (area:conformance-drift)"
        if: failure() || steps.corpus-run.outputs.py_exit != '0' || steps.corpus-run.outputs.ts_exit != '0' || steps.upstream-pin-check.outputs.pin_missing == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const report = fs.readFileSync('.drift/drift-report.json', 'utf-8');
              body = "Nightly cel-spec conformance drift detected (wasm-engine canary).\n\n" +
                "## Drift report\n\n```json\n" + report + "\n```\n\n" +
                "## Workflow run\n\n" +
                "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n" +
                "## Required action\n\n" +
                "1. Inspect the wasm-pytest.stdout and wasm-vitest.stdout artifacts.\n" +
                "2. Decide: did the cel-spec corpus / environment drift, or did the upstream pin vanish?\n" +
                "3. If the corpus drifted: re-run scripts/build-celspec-corpus.py and refresh celspec_vectors.json + relay-profile-filter.yaml + dropped-candidates.json + MANIFEST.sha256.\n" +
                "4. If the upstream pin vanished: re-pin tests/conformance/cel-spec/PINNED_COMMIT.txt + .upstream-pins.json to a surviving commit and regenerate.\n";
            } catch (e) {
              body = "Drift report missing; see workflow run for stderr. Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            }
            // Per VAL-W17-014: auto-assignee is the CODEOWNER for
            // /packages/contracts/. We grep CODEOWNERS for that path
            // and take the first @user listed.
            let assignees = [];
            try {
              const codeowners = fs.readFileSync('.github/CODEOWNERS', 'utf-8');
              for (const raw of codeowners.split('\n')) {
                const line = raw.trim();
                if (line.startsWith('#') || !line) continue;
                if (line.startsWith('/packages/contracts/') || line.startsWith('packages/contracts/')) {
                  const owners = line.split(/\s+/).slice(1).filter(t => t.startsWith('@'));
                  assignees = owners.map(o => o.replace(/^@/, ''));
                  break;
                }
              }
            } catch (e) {
              // Fall through with empty assignees; issue still opens.
            }
            const issuePayload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[nightly-cel-drift] cel-spec conformance drift detected on " + new Date().toISOString().slice(0, 10),
              body: body,
              labels: ["area:conformance-drift"],
              assignees: assignees,
            };
            try {
              await github.rest.issues.create(issuePayload);
            } catch (e) {
              // A CODEOWNERS user who is not an assignable collaborator
              // (e.g. a personal account not added to the repo) makes the
              // GitHub API reject the whole create call. The drift ALERT
              // is the load-bearing outcome; the assignee is best-effort.
              // Retry without assignees so the issue still opens.
              const msg = (e && e.message) ? e.message : String(e);
              if (msg.includes("assignee")) {
                console.log("assignee rejected (" + msg + "); reopening issue without assignees");
                delete issuePayload.assignees;
                await github.rest.issues.create(issuePayload);
              } else {
                throw e;
              }
            }

      - name: "Fail workflow on drift"
        if: steps.corpus-run.outputs.py_exit != '0' || steps.corpus-run.outputs.ts_exit != '0' || steps.upstream-pin-check.outputs.pin_missing == 'true'
        shell: bash
        run: |
          echo "RELAY-W17-3-DRIFT: workflow failing because drift was detected."
          echo "py_exit=${{ steps.corpus-run.outputs.py_exit }}"
          echo "ts_exit=${{ steps.corpus-run.outputs.ts_exit }}"
          echo "pin_missing=${{ steps.upstream-pin-check.outputs.pin_missing }}"
          exit 1
