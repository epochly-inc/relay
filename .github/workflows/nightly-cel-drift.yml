# Relay v0.1 OSS -- Nightly cel-spec drift workflow (VAL-W17-014).
#
# Purpose (post-M6 legacy-Python-CEL-engine removal, ROBOREV M6 finding
# D): the Python CEL axis is the SINGLE pinned wasm engine (relay_cel_wasm,
# shipped as relay_contracts package data) -- there is no upgradable
# Python CEL dependency anymore, so this workflow records the wasm sha256
# and the wasmtime runtime version as the Python-axis provenance and runs
# the cel-spec corpus on that wasm path as a nightly canary (the corpus /
# environment can still drift). The npm axis is unchanged while cel-js
# remains the TS legacy/rollback evaluator: per-PR gates use the pinned
# cel-js in tests/conformance/cel-spec/.upstream-pins.json; this workflow
# runs nightly against `npm install cel-js@latest` so a silent upstream
# null-semantics change cannot slip past us. (The cel-js axis is removed
# together with cel-js itself by the M6 CI-collapse feature.)
#
# On drift the workflow:
#   1. Fails with a structured drift report saved as a workflow
#      artifact (drift-report.json).
#   2. Opens a GitHub issue labelled `area:conformance-drift` and
#      assigns it to the CODEOWNER for /packages/contracts/ (per
#      C-MIN-007 alerting-path reconciliation and contract VAL-W17-014).
#
# Spec citations:
#   - contract VAL-W17-014
#   - eng plan CQ1 (upstream CEL semantic drift detection)
#   - CLAUDE.md keystone invariant 1 (manifest is source of truth)
#
# Manual trigger via workflow_dispatch is supported so an operator can
# re-run after a pin bump without waiting for the cron.

name: "nightly-cel-drift"

on:
  schedule:
    # 07:13 UTC daily. Offset from the top of the hour to spread
    # GitHub-Actions runner load. UTC chosen so the run completes
    # well before US-West business start.
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      open_issue_even_on_pass:
        description: "Open an info-only issue even when no drift is detected (debug helper)."
        required: false
        default: "false"

permissions: {}

jobs:
  drift-detect:
    name: "drift-detect: pinned wasm engine + pinned-vs-latest cel-js"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Setup Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "install uv"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Install pinned workspace (baseline)"
        shell: bash
        run: |
          set -euo pipefail
          # packages/contracts depends on the workspace sibling
          # epochly-relay-schemas, which is NOT published to PyPI. A plain
          # `pip install -e packages/contracts` therefore fails resolving
          # that dependency. uv sync installs the whole workspace
          # (resolving siblings via the workspace) from uv.lock, including
          # wasmtime + the packaged pinned wasm engine -- exactly the
          # baseline this drift check needs.
          uv sync --all-packages --all-extras
          npm ci --workspace=packages/contracts-typescript --include-workspace-root

      - name: "Record pinned-version corpus result"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .drift
          # Run the conformance suite under the PINNED versions and
          # capture per-vector results. A non-zero exit on the pinned
          # run is itself a bug (the pinned run should always pass);
          # we surface it as drift.
          uv run pytest tests/conformance/cel-spec/test_w17_3_celspec_corpus.py \
            -q --tb=line --junitxml=.drift/pinned-pytest.xml || true
          # Capture the Python-axis engine provenance: the PINNED wasm
          # artifact (sha256 of the shipped relay_cel_wasm package data,
          # plus the checked-in pin it must equal) and the wasmtime host
          # runtime version. The legacy Python CEL package was REMOVED in
          # M6 WS-I -- querying its distribution version here raised
          # PackageNotFoundError and killed the scheduled job before the
          # corpus ran (ROBOREV M6 finding D).
          uv run python -c "
          import hashlib
          import importlib.metadata as m
          from relay_contracts.wasm_artifact import (
              WASM_PINNED_SHA256,
              resolve_packaged_wasm_path,
          )
          path = resolve_packaged_wasm_path()
          actual = (
              hashlib.sha256(path.read_bytes()).hexdigest()
              if path is not None
              else '<missing>'
          )
          print('relay_cel_wasm sha256', actual)
          print('relay_cel_wasm pinned', WASM_PINNED_SHA256)
          print('wasmtime', m.version('wasmtime'))
          if actual != WASM_PINNED_SHA256:
              raise SystemExit(
                  'RELAY-W17-3-WASM-PIN-MISMATCH: packaged wasm does not '
                  'hash to WASM_PINNED_SHA256'
              )
          " > .drift/wasm-engine.txt
          cat .drift/wasm-engine.txt
          # Capture the installed cel-js version via `npm ls`. Reading
          # cel-js/package.json directly (require / require.resolve) hits
          # ERR_PACKAGE_PATH_NOT_EXPORTED because cel-js's "exports" map
          # blocks deep package.json access; and a hardcoded
          # ./node_modules path breaks under npm workspace hoisting. npm
          # ls reports the resolved installed version regardless. Capture
          # WITHOUT aborting on a non-zero npm-ls exit (npm ls can exit
          # non-zero when the installed version no longer satisfies the
          # package.json pin while still printing a valid tree -- exactly
          # the case the latest-upgrade pass below needs to test). Then
          # FAIL FAST on an empty parsed version.
          NPM_LS_OUT=$(cd packages/contracts-typescript && npm ls cel-js --depth=0 2>/dev/null || true)
          CELJS_VER=$(echo "${NPM_LS_OUT}" | grep -oE 'cel-js@[^ ]+' | head -1 | sed 's/cel-js@//')
          if [ -z "${CELJS_VER}" ]; then
            echo "RELAY-W17-3-CELJS-VERSION-LOOKUP-FAILED: npm ls returned no cel-js version" >&2
            exit 1
          fi
          echo "cel-js ${CELJS_VER}" > .drift/pinned-celjs.txt

      - name: "Upgrade to LATEST cel-js"
        shell: bash
        run: |
          set -euo pipefail
          # VAL-W17-014: install the LATEST published cel-js, NOT the
          # pinned one. The drift signal is "does the latest still match
          # what the pinned passed?" The Python axis has NO upgrade step:
          # the single wasm engine is PINNED package data (recorded with
          # its sha256 + wasmtime version in the previous step); the legacy
          # Python CEL package was removed in M6 WS-I.
          #
          # --no-save: install the LATEST cel-js into node_modules for the
          # conformance run WITHOUT rewriting packages/contracts-typescript/
          # package.json. A plain `npm install cel-js@latest` rewrites the
          # pin "0.8.2" -> "^0.8.2", which the committed-state drift checker
          # (invoked by test_drift_checker_exits_zero in the conformance
          # pytest below) then flags as a spurious pin move. The drift run
          # must test latest, not mutate the committed pin.
          npm install cel-js@latest --no-save \
            --workspace=packages/contracts-typescript --include-workspace-root
          # Same as the pinned-version capture above: tolerate a non-zero
          # npm-ls exit (after `npm install cel-js@latest --no-save`, the
          # installed latest may not satisfy package.json's pinned spec,
          # which makes npm ls exit non-zero while still printing the
          # resolved tree -- exactly the case we want to TEST here).
          NPM_LS_LATEST=$(cd packages/contracts-typescript && npm ls cel-js --depth=0 2>/dev/null || true)
          CELJS_LATEST=$(echo "${NPM_LS_LATEST}" | grep -oE 'cel-js@[^ ]+' | head -1 | sed 's/cel-js@//')
          if [ -z "${CELJS_LATEST}" ]; then
            echo "RELAY-W17-3-CELJS-VERSION-LOOKUP-FAILED: npm ls returned no cel-js version after upgrade" >&2
            exit 1
          fi
          echo "cel-js ${CELJS_LATEST}" > .drift/latest-celjs.txt

      - name: "Run conformance under LATEST"
        id: latest-run
        shell: bash
        run: |
          set -euo pipefail
          set +e
          # The Python run executes on the PINNED wasm engine (there is no
          # latest-Python-CEL axis after M6); it is the nightly corpus
          # canary. The vitest run below is the actual latest-cel-js axis.
          uv run pytest tests/conformance/cel-spec/test_w17_3_celspec_corpus.py \
            -q --tb=line --junitxml=.drift/latest-pytest.xml \
            -o "junit_logging=system-out" \
            > .drift/latest-pytest.stdout 2>&1
          PY_EXIT=$?
          (cd packages/contracts-typescript && npx vitest run test/w17_3_celspec_corpus.test.ts \
            --reporter=verbose --reporter=junit --outputFile=../../.drift/latest-vitest.xml \
            > ../../.drift/latest-vitest.stdout 2>&1)
          TS_EXIT=$?
          set -e
          echo "py_exit=${PY_EXIT}" >> "${GITHUB_OUTPUT}"
          echo "ts_exit=${TS_EXIT}" >> "${GITHUB_OUTPUT}"
          echo "DRIFT-DETECTED: py_exit=${PY_EXIT} ts_exit=${TS_EXIT}"

      - name: "Print conformance-under-latest logs"
        # The artifact upload is unreliable in this org (retention), so
        # surface the captured conformance output inline. This is the
        # primary diagnosis surface when py_exit/ts_exit are non-zero:
        # without it the only signal is the bare exit code.
        if: always()
        shell: bash
        run: |
          echo "===== wasm-engine (pinned Python axis) ====="; cat .drift/wasm-engine.txt 2>/dev/null || true
          echo "===== pinned-celjs ====="; cat .drift/pinned-celjs.txt 2>/dev/null || true
          echo "===== latest-celjs ====="; cat .drift/latest-celjs.txt 2>/dev/null || true
          echo "===== latest-pytest.stdout ====="; cat .drift/latest-pytest.stdout 2>/dev/null || true
          echo "===== latest-vitest.stdout (tail 80) ====="; tail -80 .drift/latest-vitest.stdout 2>/dev/null || true

      - name: "Build drift report"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json, pathlib, datetime
          out = {
            "_schema_version": 1,
            "report_kind": "celspec-drift",
            "generated_at_utc": datetime.datetime.utcnow().isoformat() + "Z",
            "wasm_engine": pathlib.Path(".drift/wasm-engine.txt").read_text().strip() if pathlib.Path(".drift/wasm-engine.txt").exists() else "<missing>",
            "pinned": {
              "celjs": pathlib.Path(".drift/pinned-celjs.txt").read_text().strip() if pathlib.Path(".drift/pinned-celjs.txt").exists() else "<missing>",
            },
            "latest": {
              "celjs": pathlib.Path(".drift/latest-celjs.txt").read_text().strip() if pathlib.Path(".drift/latest-celjs.txt").exists() else "<missing>",
            },
            "pytest_latest_stdout_tail": pathlib.Path(".drift/latest-pytest.stdout").read_text()[-4000:] if pathlib.Path(".drift/latest-pytest.stdout").exists() else "<missing>",
            "vitest_latest_stdout_tail": pathlib.Path(".drift/latest-vitest.stdout").read_text()[-4000:] if pathlib.Path(".drift/latest-vitest.stdout").exists() else "<missing>",
            "alert_label": "area:conformance-drift",
            "workflow_run_url": __import__("os").environ.get("GITHUB_SERVER_URL", "") + "/" + __import__("os").environ.get("GITHUB_REPOSITORY", "") + "/actions/runs/" + __import__("os").environ.get("GITHUB_RUN_ID", ""),
          }
          pathlib.Path(".drift/drift-report.json").write_text(json.dumps(out, indent=2, sort_keys=True))
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: "Upload drift report artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-cel-drift-report
          path: .drift/

      - name: "Verify upstream pin still exists on cel-spec remote"
        id: upstream-pin-check
        shell: bash
        run: |
          set -euo pipefail
          # VAL-W17-010 nightly enforcement: the SHA recorded in
          # PINNED_COMMIT.txt MUST still resolve on
          # https://github.com/google/cel-spec. If google deletes the
          # tag/branch, this fails with RELAY-CELSPEC-PIN-MISSING.
          PIN=$(grep -v '^#' tests/conformance/cel-spec/PINNED_COMMIT.txt | grep -E '^[0-9a-f]{40}$' | head -1)
          echo "Resolving pin ${PIN} against google/cel-spec..."
          if ! git ls-remote https://github.com/google/cel-spec | grep -q "${PIN}"; then
            echo "::error::RELAY-CELSPEC-PIN-MISSING: pinned commit ${PIN} not found at https://github.com/google/cel-spec"
            echo "pin_missing=true" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "pin_missing=false" >> "${GITHUB_OUTPUT}"
          echo "Pin ${PIN} resolves on upstream"

      - name: "Open GitHub issue on drift (area:conformance-drift)"
        if: failure() || steps.latest-run.outputs.py_exit != '0' || steps.latest-run.outputs.ts_exit != '0' || steps.upstream-pin-check.outputs.pin_missing == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const report = fs.readFileSync('.drift/drift-report.json', 'utf-8');
              body = "Nightly cel-spec conformance drift detected.\n\n" +
                "## Drift report\n\n```json\n" + report + "\n```\n\n" +
                "## Workflow run\n\n" +
                "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n" +
                "## Required action\n\n" +
                "1. Inspect the latest-pytest.stdout and latest-vitest.stdout artifacts.\n" +
                "2. Decide: was an upstream null-semantics or type-coercion change introduced?\n" +
                "3. If yes: update tests/conformance/cel-spec/.upstream-pins.json (pinned versions) and refresh celspec_vectors.json + MANIFEST.sha256.\n" +
                "4. If no: file an upstream issue against cel-js, or investigate the wasm-engine corpus canary.\n";
            } catch (e) {
              body = "Drift report missing; see workflow run for stderr. Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            }
            // Per VAL-W17-014: auto-assignee is the CODEOWNER for
            // /packages/contracts/. We grep CODEOWNERS for that path
            // and take the first @user listed.
            let assignees = [];
            try {
              const codeowners = fs.readFileSync('.github/CODEOWNERS', 'utf-8');
              for (const raw of codeowners.split('\n')) {
                const line = raw.trim();
                if (line.startsWith('#') || !line) continue;
                if (line.startsWith('/packages/contracts/') || line.startsWith('packages/contracts/')) {
                  const owners = line.split(/\s+/).slice(1).filter(t => t.startsWith('@'));
                  assignees = owners.map(o => o.replace(/^@/, ''));
                  break;
                }
              }
            } catch (e) {
              // Fall through with empty assignees; issue still opens.
            }
            const issuePayload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[nightly-cel-drift] cel-spec conformance drift detected on " + new Date().toISOString().slice(0, 10),
              body: body,
              labels: ["area:conformance-drift"],
              assignees: assignees,
            };
            try {
              await github.rest.issues.create(issuePayload);
            } catch (e) {
              // A CODEOWNERS user who is not an assignable collaborator
              // (e.g. a personal account not added to the repo) makes the
              // GitHub API reject the whole create call. The drift ALERT
              // is the load-bearing outcome; the assignee is best-effort.
              // Retry without assignees so the issue still opens.
              const msg = (e && e.message) ? e.message : String(e);
              if (msg.includes("assignee")) {
                console.log("assignee rejected (" + msg + "); reopening issue without assignees");
                delete issuePayload.assignees;
                await github.rest.issues.create(issuePayload);
              } else {
                throw e;
              }
            }

      - name: "Fail workflow on drift"
        if: steps.latest-run.outputs.py_exit != '0' || steps.latest-run.outputs.ts_exit != '0' || steps.upstream-pin-check.outputs.pin_missing == 'true'
        shell: bash
        run: |
          echo "RELAY-W17-3-DRIFT: workflow failing because drift was detected."
          echo "py_exit=${{ steps.latest-run.outputs.py_exit }}"
          echo "ts_exit=${{ steps.latest-run.outputs.ts_exit }}"
          echo "pin_missing=${{ steps.upstream-pin-check.outputs.pin_missing }}"
          exit 1
