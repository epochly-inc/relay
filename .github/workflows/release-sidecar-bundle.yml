# Relay v0.1 OSS -- Sidecar Bundle Release Workflow (sub-feature w12.5)
#
# Builds PyInstaller-built standalone sidecar binaries for the canonical
# five-arch matrix (VAL-W12-020), Sigstore-keyless-signs each binary
# (VAL-W12-021), attaches RFC 3161 TSA timestamps (VAL-W12-022), runs
# the tier-1 plumbing parity suite against each binary (VAL-W12-023),
# performs signing inside the SLSA L3 hermetic builder context
# (VAL-W12-024), and notarizes macOS / Authenticode-signs Windows
# binaries (VAL-W12-026).
#
# The npm wrapper at packages/sdk-typescript-sidecar-bundle/ performs
# digest-first / Sigstore-second verification BEFORE launching the
# binary on the user's machine (VAL-W12-025); the wrapper is published
# in the sister workflow .github/workflows/release-npm.yml under the
# @epochly/relay-sidecar-bundle package name.
#
# Static guard: scripts/check-sidecar-bundle.py enforces all 14
# VAL-W12 assertions (020..027, 035..037, 041..043) on this file plus
# the supporting docs.
#
# Fork behavior: the workflow detects fork repos (not epochly-inc/relay)
# and runs in dry_run_unsigned mode -- produces the build manifest
# without invoking Sigstore or the SLSA generator. This is the
# sister-of VAL-W12-044 behavior for the sidecar bundle.
#
# Spec citations:
#   - Eng plan L3 line 226 (two-tier TS distribution + signed standalone)
#   - Spec section AO.1/AO.2 (transparency log + offline verifiability)
#   - Spec section L (signing key rotation)
#   - PW1-3 (Sigstore primary, Sectigo fallback)
#   - CLAUDE.md banned pattern #14 (no key material in repo)

name: "release-sidecar-bundle"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

# TSA primary selection per VAL-W12-043. The default is "sigstore"; the
# Sectigo fallback path is wired but inactive (requires an explicit ops
# decision to switch). The static guard refuses a workflow whose
# default is anything other than "sigstore".
env:
  TSA_PRIMARY: "sigstore"
  RELAY_SIDECAR_MATRIX: >-
    macos-arm64 linux-x86_64 linux-arm64 windows-x86_64

jobs:
  # ---------------------------------------------------------------------------
  # Pre-flight: detect fork (no signing key) -- sister of VAL-W12-044.
  # ---------------------------------------------------------------------------
  detect-fork:
    name: "Detect fork (dry-run-unsigned mode)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dry_run_unsigned: ${{ steps.detect.outputs.dry_run_unsigned }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Detect fork"
        id: detect
        env:
          RELAY_RELEASE_REPO: ${{ github.repository }}
        run: |
          if [ "${RELAY_RELEASE_REPO}" != "epochly-inc/relay" ]; then
            echo "RELAY-RELEASE-DRY-RUN-UNSIGNED: fork detected (${RELAY_RELEASE_REPO})."
            echo "dry_run_unsigned=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production repository run; binaries will be signed."
            echo "dry_run_unsigned=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Static workflow guard. Enforces all 14 VAL-W12 assertions for w12.5
  # via offline-parseable checks.
  # ---------------------------------------------------------------------------
  guard:
    name: "Static guard: sidecar bundle release workflow contract"
    runs-on: ubuntu-latest
    needs: [detect-fork]
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install guard deps"
        run: pip install pyyaml==6.0.2

      - name: "Static guard: VAL-W12-020..027, 035..037, 041..043"
        run: python scripts/check-sidecar-bundle.py

  # ---------------------------------------------------------------------------
  # Build matrix: one job per (OS, arch) cell of the canonical five-arch
  # matrix. Each job invokes scripts/build-sidecar-bundle.py for its cell
  # and uploads the produced binary + digest manifest as an artifact.
  #
  # The matrix declares all five canonical cells (VAL-W12-020). Adding or
  # removing cells requires a board-level decision per the contract.
  # ---------------------------------------------------------------------------
  build:
    name: "Build sidecar binary (${{ matrix.cell }})"
    needs: [guard]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-x86_64 dropped from matrix on 2026-05-28 (board-level
          # decision documented in CHANGELOG v0.1.16). GitHub's free
          # Intel-macOS runner pool is perpetually queue-starved (40+ min
          # waits make releases non-deterministic); Apple stopped
          # shipping Intel Macs in 2022. Intel macOS (darwin/x64) is now
          # UNSUPPORTED: Rosetta 2 translates x86_64 -> arm64 (it runs Intel
          # binaries on Apple Silicon), NOT arm64 -> x86_64, so the arm64
          # binary cannot run on an Intel host. The launcher / wrapper / CLI
          # refuse darwin/x64 with a clean unsupported-platform error rather
          # than claiming a (nonexistent) reverse-Rosetta fallback.
          #
          # Self-hosted runners (registered 2026-05-28) provide the build
          # capacity for 3 of the 4 cells. The "linux-arm64" cell stays
          # on GitHub-hosted ubuntu-24.04-arm because no self-hosted
          # arm64 Linux host is available. The labels below match the
          # custom labels registered with each self-hosted runner:
          #   - relay-linux-x64-self    (chandler@192.168.1.17)
          #   - relay-macos-arm64-self  (chandlervaughn@192.168.1.11)
          #   - relay-windows-x64-self  (chand@192.168.1.52)
          - cell: "macos-arm64"
            runner: "macos-arm64"        # self-hosted (Mac Studio M1, openssl@3 from brew)
            python: "3.12"
          - cell: "linux-x86_64"
            runner: "linux-x86_64"       # self-hosted (Ubuntu 25.10) - RUNNER_TOOL_CACHE
                                         # in runner .env points actions/setup-python@v5
                                         # at /opt/hostedtoolcache/Python/3.12.13/x64/
            python: "3.12"
          - cell: "linux-arm64"
            runner: "ubuntu-24.04-arm"   # GitHub-hosted (no self-hosted arm64 Linux host)
            python: "3.12"
          - cell: "windows-x86_64"
            runner: "windows-x86_64"     # self-hosted (Windows 11 Pro) - runner .env PATH
                                         # puts C:\Program Files\Git\bin first so `bash`
                                         # invokes Git Bash, not WSL bash (the latter
                                         # mangles Windows paths in shell: bash steps).
            python: "3.12"
    runs-on: ${{ matrix.runner }}
    outputs:
      manifest_path: dist/sidecar-bundle/${{ matrix.cell }}/manifest.json
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: "Install PyInstaller and sidecar deps"
        shell: bash
        # Install EVERY workspace member editable, in one `pip install`
        # command, so that:
        #   (a) pip never falls through to PyPI for an in-workspace
        #       sibling that has not yet been published (the failure
        #       mode that broke the v0.1.9 sidecar-bundle build before
        #       packages/cli was added to this list);
        #   (b) the tier-1 plumbing parity step below can `import
        #       relay_gate_engine`, `import relay_verifier`, etc., the
        #       same way the local dev environment can (those imports
        #       come from packages/gate, packages/verifier, etc.).
        #
        # Plain pip does not read uv's [tool.uv.sources] table, so
        # any package omitted here triggers a PyPI lookup for the
        # corresponding sibling and either fails outright (sibling
        # not on PyPI) or pulls a stale published version (sibling
        # is on PyPI at the wrong version).
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.0
          python -m pip install \
            -e packages/schemas \
            -e packages/sdk-python \
            -e packages/cli \
            -e packages/contracts \
            -e packages/gate \
            -e packages/evals \
            -e packages/explain \
            -e packages/verifier \
            -e packages/acef \
            -e packages/replay-sandbox-protocol \
            -e apps/local-sidecar \
            -e apps/replay-proxy

      - name: "Build sidecar binary for ${{ matrix.cell }}"
        shell: bash
        run: |
          python scripts/build-sidecar-bundle.py \
            --cell ${{ matrix.cell }} \
            --manifest-out dist/sidecar-bundle/${{ matrix.cell }}/manifest.json

      - name: "Tier-1 plumbing parity (VAL-W12-023, functional equivalence)"
        # Run the same tier-1 plumbing suite the Python-installed sidecar
        # runs, against the PyInstaller-built binary. Divergence FAILS.
        #
        # psutil is required by relay_sidecar.process.pid_start_time_epoch_s
        # on Windows (where the POSIX ``ps`` and ``/proc/<pid>/stat``
        # fallbacks do not exist). Without psutil the helper returns None
        # on Windows and the VAL-V3-BUGA3 PID-identity tests fail with
        # ``assert None is not None``. Install it as a CI-only test dep
        # so we do not couple psutil into the published runtime.
        shell: bash
        env:
          RELAY_SIDECAR_BINARY: dist/sidecar-bundle/${{ matrix.cell }}/dist/relay-sidecar-${{ matrix.cell }}
        run: |
          python -m pip install pytest pytest-asyncio pytest-timeout psutil hypothesis
          pytest -m plumbing apps/local-sidecar/tests --timeout=60 -q

      - name: "Upload binary artifact"
        uses: actions/upload-artifact@v4
        with:
          name: relay-sidecar-${{ matrix.cell }}
          path: dist/sidecar-bundle/${{ matrix.cell }}/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS notarization (VAL-W12-026). Runs only for macOS cells and only
  # in the canonical repository (notarization API credentials live in
  # relay-platform secrets; forks skip this step).
  # ---------------------------------------------------------------------------
  notarize-macos:
    name: "Notarize macOS binaries"
    needs: [detect-fork, build]
    if: needs.detect-fork.outputs.dry_run_unsigned == 'false'
    # Self-hosted macOS arm64 runner (relay-macos-arm64-self).
    # GitHub-hosted macos-14 also works; self-hosted is preferred for
    # consistency with the build matrix and to avoid queue waits on
    # the Apple-Silicon hosted pool.
    runs-on: macos-arm64
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      # macos-x86_64 dropped from matrix on 2026-05-28 (see build job).
      # Only the arm64 artifact is downloaded for notarization.
      - name: "Download macOS-arm64 artifact"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-macos-arm64
          path: dist/macos-arm64/

      - name: "Notarize + staple (Apple notarytool)"
        # Requires APPLE_NOTARYTOOL_KEYCHAIN_PROFILE configured in the
        # release environment. The credentials live in relay-platform
        # secrets per CLAUDE.md banned pattern #14; the GitHub OIDC
        # token-exchange path that brokers access is documented in
        # docs/release/runbook.md (Notarization Credentials section).
        #
        # Iterate ONLY over the macOS cells actually built and downloaded.
        # macos-x86_64 was dropped from the build matrix on 2026-05-28
        # (board-level decision; see the build job), so only the arm64
        # artifact exists under dist/. The arch list is derived from the
        # downloaded `dist/macos-*` directories rather than hard-coded so
        # that a future re-add (or removal) of a macOS cell needs no edit
        # here: a hard-coded `x86_64 arm64` loop aborts the whole job under
        # `set -euo pipefail` on the first (nonexistent) cell, leaving the
        # arm64 binary un-notarized. The static guard
        # (scripts/check-sidecar-bundle.py) refuses any hard-coded arch
        # list in this step.
        env:
          NOTARY_PROFILE: ${{ secrets.APPLE_NOTARYTOOL_KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          notarized=0
          for cell_dir in dist/macos-*/; do
            arch="${cell_dir#dist/macos-}"
            arch="${arch%/}"
            BIN="dist/macos-${arch}/dist/relay-sidecar-macos-${arch}"
            if [ ! -f "${BIN}" ]; then
              echo "RELAY-RELEASE-NOTARIZE-SKIP: no binary at ${BIN}; skipping ${arch}"
              continue
            fi
            ditto -c -k --keepParent "${BIN}" "${BIN}.zip"
            xcrun notarytool submit "${BIN}.zip" \
              --keychain-profile "${NOTARY_PROFILE}" \
              --wait
            xcrun stapler staple "${BIN}"
            notarized=$((notarized + 1))
          done
          if [ "${notarized}" -eq 0 ]; then
            echo "RELAY-RELEASE-NOTARIZE-EMPTY: no macOS binaries found to notarize" >&2
            exit 1
          fi
          echo "Notarized ${notarized} macOS binary(ies)."

      - name: "Re-upload notarized artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: relay-sidecar-macos-notarized
          path: dist/macos-*/dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows code-signing (VAL-W12-026). signtool path runs only in the
  # canonical repository because the EV cert lives in relay-platform.
  # Forks skip this step; their unsigned binaries cannot be published.
  # ---------------------------------------------------------------------------
  codesign-windows:
    name: "Authenticode-sign Windows binary"
    needs: [detect-fork, build]
    if: needs.detect-fork.outputs.dry_run_unsigned == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download windows artifact"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-windows-x86_64
          path: dist/windows-x86_64/

      - name: "Authenticode-sign via signtool"
        # signtool is part of the Windows SDK; the certificate is loaded
        # from the runner's certificate store and the private key never
        # leaves relay-platform's HSM-backed signing service. This step
        # is the public-side handoff documented in the release runbook
        # under "Windows code-signing flow."
        shell: pwsh
        env:
          RELAY_WIN_SIGN_CERT_SUBJECT: ${{ secrets.RELAY_WIN_SIGN_CERT_SUBJECT }}
        run: |
          $bin = "dist/windows-x86_64/dist/relay-sidecar-windows-x86_64.exe"
          signtool sign /n $env:RELAY_WIN_SIGN_CERT_SUBJECT /fd sha256 /tr "http://timestamp.sectigo.com" /td sha256 $bin
          signtool verify /pa $bin

      - name: "Re-upload signed artifact"
        uses: actions/upload-artifact@v4
        with:
          name: relay-sidecar-windows-signed
          path: dist/windows-x86_64/dist/

  # ---------------------------------------------------------------------------
  # SLSA L3 provenance generation (VAL-W12-024). Generates the SLSA v1.0
  # provenance attestation for every produced binary inside the hermetic
  # slsa-github-generator builder context. This is the canonical SLSA
  # source for sub-feature w12.5.
  # ---------------------------------------------------------------------------
  collect-hashes:
    name: "Collect digest manifest across all cells"
    # PROVENANCE-INTEGRITY (G4-F2): the SLSA subjects MUST be computed over
    # the EXACT bytes that `publish` ships, which are the post-signing
    # artifacts -- macOS notarized + stapled (notarize-macos), Windows
    # Authenticode-signed (codesign-windows), and the raw Linux binaries.
    # Notarization and Authenticode signing mutate the binary's bytes
    # (notarization staples a ticket; signtool appends an Authenticode
    # signature), so hashing the pre-signing `build` artifacts would emit
    # provenance digests that do NOT match the shipped artifacts.
    # Therefore this job downloads the SAME post-signing artifact set the
    # `sign` job downloads (relay-sidecar-macos-notarized,
    # relay-sidecar-windows-signed, and the raw linux artifacts) and never
    # the pre-signing relay-sidecar-<cell> build artifacts. In
    # dry_run_unsigned (fork) mode the notarize/codesign jobs are skipped;
    # provenance is gated off in that mode too, so the missing post-signing
    # artifacts are never required.
    needs: [detect-fork, build, notarize-macos, codesign-windows]
    if: needs.detect-fork.outputs.dry_run_unsigned == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: "Download notarized macOS artifacts"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-macos-notarized
          path: dist/

      - name: "Download Authenticode-signed Windows artifact"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-windows-signed
          path: dist/windows-x86_64/dist/

      - name: "Download linux-x86_64 artifact (unsigned, shipped as built)"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-linux-x86_64
          path: dist/linux-x86_64/

      - name: "Download linux-arm64 artifact (unsigned, shipped as built)"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-linux-arm64
          path: dist/linux-arm64/

      - name: "Aggregate base64-encoded hashes (SLSA base64-subjects)"
        # Hashes the POST-signing bytes (see job-level note). These are the
        # bytes the `sign` job signs and the `publish` job uploads, so the
        # SLSA provenance subjects bind to the shipped artifacts.
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name 'relay-sidecar-*' -not -name '*.json' -not -name '*.sigstore' -not -name '*.zip' -print > files.txt
          HASHES=$(while read -r f; do sha256sum "$f"; done < files.txt | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

  provenance:
    name: "SLSA L3 provenance"
    needs: [detect-fork, collect-hashes]
    if: needs.detect-fork.outputs.dry_run_unsigned == 'false'
    permissions:
      id-token: write
      contents: write
      actions: read
    # SHA-pinned per spec keystone #11 (trust anchor). The same SHA is
    # used in release-pypi.yml and release-npm.yml so provenance is
    # produced by an identical, byte-for-byte reusable workflow across
    # all three release pipelines; a force-moved tag in one place would
    # otherwise produce divergent attestations. SHA 5a775b3... == v2.0.0;
    # rotate via a single coordinated PR across all three workflows.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.collect-hashes.outputs.hashes }}
      provenance-name: "relay-sidecar-bundle.intoto.jsonl"
      upload-assets: true
      # Build the generator binary from source against our pinned SHA.
      # The release-asset fetch path refuses bare SHA refs (it expects
      # refs/tags/vX.Y.Z form), so the binary would otherwise be missing.
      compile-generator: true

  # ---------------------------------------------------------------------------
  # Sigstore keyless signing (VAL-W12-021 + VAL-W12-022). Signs each
  # per-cell binary inside the canonical-repo hermetic builder, attaches
  # the Sigstore TSA RFC 3161 timestamp, and writes a .sigstore bundle.
  # Rekor inclusion proof is fetched + verified offline against the
  # pinned checkpoint (VAL-W12-037).
  # ---------------------------------------------------------------------------
  sign:
    name: "Sigstore keyless sign + Rekor inclusion"
    needs: [detect-fork, build, notarize-macos, codesign-windows, provenance]
    if: needs.detect-fork.outputs.dry_run_unsigned == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download notarized macOS artifacts"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-macos-notarized
          path: dist/

      - name: "Download signed Windows artifact"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-windows-signed
          path: dist/windows-x86_64/dist/

      - name: "Download linux artifacts"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-linux-x86_64
          path: dist/linux-x86_64/

      - name: "Download linux-arm64 artifact"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-linux-arm64
          path: dist/linux-arm64/

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install sigstore-python"
        run: pip install sigstore==3.6.0

      - name: "Keyless sign + Sigstore TSA timestamp"
        # sigstore-python obtains an ambient GitHub OIDC token, gets a
        # short-lived Fulcio signing certificate, signs the artifact,
        # records the signature in Rekor (transparency log), and
        # attaches an RFC 3161 timestampVerificationData block from
        # Sigstore TSA (https://timestamp.sigstore.dev). The single
        # .sigstore bundle file carries the cert, signature, Rekor entry
        # SET, and timestamp data -- all the materials a verifier needs
        # offline.
        shell: bash
        env:
          TSA_PRIMARY: ${{ env.TSA_PRIMARY }}
        run: |
          set -euo pipefail
          # Keyless OIDC: do NOT pass --identity-token. The previous code
          # passed ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}, which is the BEARER
          # token used to CALL the OIDC token-request endpoint -- not an
          # OIDC identity JWT. Passing it (or the empty fallback) makes
          # Fulcio reject the request or bind the wrong identity. The
          # correct keyless idiom is to let sigstore-python detect the
          # ambient GitHub Actions OIDC credential from
          # ACTIONS_ID_TOKEN_REQUEST_URL + ACTIONS_ID_TOKEN_REQUEST_TOKEN
          # (it calls the request endpoint itself with audience=sigstore
          # and mints a real identity token). This requires
          # permissions.id-token: write on this job (granted above) and
          # mirrors how release-npm.yml relies on ambient OIDC detection.
          for f in $(find dist -type f -name 'relay-sidecar-*' -not -name '*.json' -not -name '*.sigstore'); do
            python -m sigstore sign \
              --bundle "${f}.sigstore" \
              "${f}"
          done

      - name: "Verify Rekor inclusion proof OFFLINE against pinned checkpoint"
        # VAL-W12-037 requires offline-verifiability via Merkle proof
        # against a Rekor checkpoint pinned at packages/verifier/.
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find dist -type f -name '*.sigstore'); do
            ARTIFACT="${f%.sigstore}"
            python -m sigstore verify identity \
              --offline \
              --bundle "${f}" \
              --cert-identity "https://github.com/epochly-inc/relay/.github/workflows/release-sidecar-bundle.yml@${GITHUB_REF}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${ARTIFACT}"
          done

      - name: "Assemble aggregated release manifest (wrapper-facing)"
        # VAL-CRYPTO-003: build the SINGLE aggregated manifest.json that the
        # npx wrapper (packages/sdk-typescript/src/bin/manifest.ts) fetches
        # from the pinned manifest URL. The wrapper trusts this manifest's
        # per-entry sha256 digests and trust_root to decide which bundle to
        # download and run -- so the manifest itself MUST be signed (the
        # next step). Schema is relay.sidecar_bundle_manifest.v1, matching
        # parseReleaseManifest in the wrapper.
        #
        # G4-F5 (asset-URL <-> publish-location coherence). The `publish`
        # job below uploads every asset to the GitHub Release via
        # `gh release upload`. The npx wrapper and the CLI sidecar installer
        # do NOT fetch from the GitHub Release directly -- they fetch from
        # the hosted mirror at
        # https://relay.epochly.com/.well-known/relay-sidecar-bundle/<vX.Y.Z>/
        # (see packages/sdk-typescript/release-manifest.url and
        # packages/cli/src/sidecar_install/bundle_manifest.json, which both
        # use that versioned .well-known path). The hosted mirror is part of
        # relay-platform infrastructure: it syncs the signed GitHub Release
        # assets (binaries + .sigstore bundles + this manifest.json + its
        # .sigstore) into the versioned .well-known prefix after each
        # release. The mirror is therefore the INTENDED distribution source,
        # not a defect.
        #
        # The fix is to pin --asset-base-url to that versioned mirror prefix
        # explicitly so every bundle `url`/`sigstore_url` in the manifest
        # carries the /<vX.Y.Z>/ segment the wrapper expects. The previous
        # invocation passed no --asset-base-url, defaulting to the
        # UNVERSIONED https://relay.epochly.com/.well-known/relay-sidecar-bundle
        # prefix, which produced bundle URLs lacking the /<version>/ segment
        # and thus not resolving to where the mirror actually stores the
        # assets. The static guard refuses an assemble step that omits an
        # explicit, version-pinned --asset-base-url.
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MANIFEST_TRUST_ROOT: "relay.epochly.com"
          # Versioned hosted-mirror prefix (relay-platform syncs the signed
          # GitHub Release assets here). Matches the .well-known/<version>/
          # convention used by release-manifest.url and the CLI installer.
          MANIFEST_ASSET_BASE_URL: "https://relay.epochly.com/.well-known/relay-sidecar-bundle/${{ github.ref_name }}"
        run: |
          python scripts/assemble-release-manifest.py \
            --dist-root dist \
            --sidecar-version "${RELEASE_TAG#v}" \
            --trust-root "${MANIFEST_TRUST_ROOT}" \
            --asset-base-url "${MANIFEST_ASSET_BASE_URL}" \
            --out dist/manifest.json

      - name: "Keyless-sign the aggregated manifest.json (VAL-CRYPTO-003)"
        # Mirror the per-binary keyless-signing step above: obtain an
        # ambient GitHub OIDC token, mint a short-lived Fulcio cert, sign
        # the EXACT manifest.json bytes, record the signature in Rekor, and
        # attach the Sigstore TSA RFC 3161 timestamp. The produced
        # manifest.json.sigstore is what the wrapper fetches at
        # <manifestUrl>.sigstore and verifies over the exact manifest bytes
        # BEFORE trusting any entry digest -- closing the manifest-MITM RCE.
        shell: bash
        env:
          TSA_PRIMARY: ${{ env.TSA_PRIMARY }}
        run: |
          set -euo pipefail
          # Keyless OIDC, same idiom as the per-binary signing step above:
          # do NOT pass --identity-token (that passed the OIDC *request*
          # bearer token, not an identity JWT). sigstore-python detects the
          # ambient GitHub Actions OIDC credential and mints a real identity
          # token itself. Requires permissions.id-token: write (granted on
          # this job).
          python -m sigstore sign \
            --bundle "dist/manifest.json.sigstore" \
            "dist/manifest.json"

      - name: "Verify aggregated manifest Rekor inclusion OFFLINE"
        # VAL-W12-037 / VAL-CRYPTO-003: the manifest signature is itself
        # offline-verifiable via Merkle inclusion against the pinned Rekor
        # checkpoint, exactly like the per-binary signatures.
        shell: bash
        run: |
          set -euo pipefail
          python -m sigstore verify identity \
            --offline \
            --bundle "dist/manifest.json.sigstore" \
            --cert-identity "https://github.com/epochly-inc/relay/.github/workflows/release-sidecar-bundle.yml@${GITHUB_REF}" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/manifest.json"

      - name: "Upload signed bundle"
        uses: actions/upload-artifact@v4
        with:
          name: relay-sidecar-bundle-signed
          path: dist/

  # ---------------------------------------------------------------------------
  # Publish to GitHub Releases (VAL-W12-020 asset coverage). The Sigstore
  # bundles + SLSA attestations + per-binary manifest entries are all
  # attached as release assets.
  # ---------------------------------------------------------------------------
  publish:
    name: "Publish release assets"
    needs: [detect-fork, sign]
    if: needs.detect-fork.outputs.dry_run_unsigned == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: "Download signed bundle"
        uses: actions/download-artifact@v4
        with:
          name: relay-sidecar-bundle-signed
          path: dist/

      - name: "Publish to GitHub Releases"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        # SR2-001 (Gate-2-r2): publish the AGGREGATED wrapper-facing manifest
        # by its EXPLICIT path, never via a broad basename glob.
        #
        # The dist/ tree contains THREE files named manifest.json: the
        # aggregated wrapper-facing dist/manifest.json (schema
        # relay.sidecar_bundle_manifest.v1, the one signed as
        # dist/manifest.json.sigstore) AND the two per-cell build manifests
        # dist/linux-x86_64/manifest.json + dist/linux-arm64/manifest.json
        # (schema relay.sidecar-bundle-manifest.v1, downloaded from the
        # relay-sidecar-<cell> build artifacts). `gh release upload` keys
        # assets by BASENAME and --clobber makes the last in
        # (filesystem-dependent) find order win, so a broad
        # `find ... -name 'manifest.json'` could publish a per-cell build
        # manifest under the manifest.json asset name while
        # manifest.json.sigstore still signed the aggregated one. The
        # fail-closed npx wrapper would then reject the mismatched manifest
        # and break every npx launch.
        #
        # Fix: the find glob below uploads ONLY the per-binary binaries,
        # their .sigstore bundles, and the SLSA .intoto.jsonl attestations
        # (none of which is named manifest.json). The aggregated manifest and
        # its detached signature are uploaded by explicit path in a second
        # call so exactly the signed, wrapper-facing manifest is published and
        # no per-cell build manifest can clobber it by basename.
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            $(find dist -type f \( -name 'relay-sidecar-*' -o -name '*.sigstore' -o -name '*.intoto.jsonl' \) -not -name 'manifest.json.sigstore') \
            --clobber
          gh release upload "${RELEASE_TAG}" \
            dist/manifest.json \
            dist/manifest.json.sigstore \
            --clobber
