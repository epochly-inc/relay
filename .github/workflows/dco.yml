name: "DCO"

# Developer Certificate of Origin (https://developercertificate.org/).
# Every commit in an external pull request MUST include a `Signed-off-by:`
# trailer. CLA.md (line 17-20) requires this; this workflow is the gate
# that enforces it on the PR-merge surface.
#
# Pairs with the CLA Assistant Lite check at .github/workflows/cla.yml.
# Both checks are required by branch protection on main.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco-check:
    name: "DCO sign-off check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          # Fetch the full PR commit range so we can inspect every commit
          # individually, not just the merge result.
          fetch-depth: 0

      - name: "Verify every commit has Signed-off-by trailer"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=()
          while IFS= read -r sha; do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              missing+=("$sha")
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "FAIL: the following commits are missing a Signed-off-by trailer:"
            for sha in "${missing[@]}"; do
              echo "  $sha  $(git show -s --format=%s "$sha")"
            done
            echo
            echo "Add the trailer by amending each commit with:"
            echo "  git commit --amend --signoff --no-edit"
            echo
            echo "Or for the whole PR range:"
            echo "  git rebase --signoff ${BASE_SHA}"
            echo
            echo "Then force-push the branch."
            exit 1
          fi
          echo "OK: every commit in this PR has a Signed-off-by trailer."
