# Relay v0.1 OSS - PyPI Release Workflow (sub-feature w12.1)
#
# Publishes the epochly-relay Python distribution to PyPI using PyPI's
# trusted-publisher (OIDC) flow. NO long-lived API token. Every
# distribution is signed via PEP 740 Sigstore-backed attestations, and
# every artifact is bound to a SLSA v1.0 L3 provenance attestation
# generated by the slsa-framework/slsa-github-generator reusable
# workflow.
#
# This workflow is the only path that may push a distribution of
# epochly-relay to PyPI. The PyPI project's trusted-publisher binding
# is scoped to:
#
#   repo:        epochly-inc/relay
#   workflow:    release-pypi.yml
#   environment: release
#
# The `release` environment requires Chandler (release engineering
# owner) to manually approve every run before publish. See
# docs/release/runbook.md for the operational procedure.
#
# Static guard: scripts/check-pypi-publish-workflow.py enforces the
# VAL-W12-001..006, 038..040, 046 invariants on this file.
#
# Pinned-by-SHA references (slsa-github-generator, sigstore-python,
# pypa/gh-action-pypi-publish) are reviewed semi-annually per the
# release runbook. Renovate / Dependabot bumps land on a release-pipe
# branch; sub-feature w12.3 (SLSA L3) carries the canonical pinning
# review process.

name: "release-pypi"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Pre-publish gates (VAL-W12-039 / VAL-W12-040 / VAL-W12-046).
  # ---------------------------------------------------------------------------
  precheck:
    name: "Precheck: monotonic version, pre-announcement"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install PyYAML for static guard"
        # The static guard parses release workflow YAML with PyYAML.
        # Pinned MAJOR.x range to silence Dependabot drift, --no-deps to
        # avoid pulling unrelated wheels into the precheck job.
        run: pip install --no-deps "pyyaml>=6.0,<7.0"

      - name: "Static guard: PyPI publish workflow contract"
        # Enforces VAL-W12-001..006, 038..040, 046 by static analysis
        # of this workflow file plus the release runbook.
        run: python scripts/check-pypi-publish-workflow.py

      - name: "Pre-announcement gate (VAL-W12-046)"
        # Refuses to proceed when the tag carries the RELAY-BREAKING-CHANGE
        # marker without a 7-day-old announcement in docs/release/announcements/.
        env:
          RELAY_RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-pre-announcement.py

      - name: "Monotonic SemVer gate (VAL-W12-040)"
        # Refuses to proceed when the proposed version is not strictly
        # greater than every prior published version of epochly-relay on PyPI.
        env:
          RELAY_RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/check-semver-monotonic.py

  # ---------------------------------------------------------------------------
  # Build sdist + wheel and produce base64-encoded sha256 digests for SLSA.
  # ---------------------------------------------------------------------------
  build:
    name: "Build sdist + wheel"
    runs-on: ubuntu-latest
    needs: [precheck]
    permissions:
      contents: read
    outputs:
      # base64-encoded "sha256sum dist/*" output. Consumed by the SLSA
      # generator's base64-subjects input (VAL-W12-004).
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install build frontend"
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.2.2.post1

      - name: "Build sdist + wheel"
        run: python -m build --sdist --wheel packages/sdk-python --outdir dist/

      - name: "Compute artifact hashes (base64-subjects payload)"
        id: hash
        # Produces the base64 of "<sha256>  <filename>" lines that the
        # SLSA generator consumes via base64-subjects.
        run: |
          cd dist
          HASHES=$(sha256sum * | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

      - name: "Upload dist/ artifact"
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SLSA L3 provenance (VAL-W12-004).
  #
  # The reusable workflow runs in its own isolated builder; it consumes
  # the base64-encoded subjects payload from `build` and emits a
  # signed attestation whose subject digests bind to the actual
  # uploaded sdist + wheel digests. Pinned-by-SHA per VAL-W12-012.
  # ---------------------------------------------------------------------------
  provenance:
    name: "SLSA L3 provenance"
    needs: [build]
    permissions:
      id-token: write   # for keyless Sigstore signing
      # contents: write is required even though `upload-assets: false`
      # below disables actual release-asset writes. The SLSA reusable
      # workflow's internal `upload-assets` job declares
      # `permissions.contents: write` in its top-level metadata, and
      # GitHub validates declared (not actually-used) permissions on
      # the calling workflow at startup -- without `contents: write`
      # here, the entire workflow fails with
      #   "The nested job 'upload-assets' is requesting 'contents: write',
      #    but is only allowed 'contents: read'."
      # (observed on the v0.1.0 tag run 26474621339).
      contents: write
      actions: read     # for the reusable workflow to read its own run
    # Pinned by SHA (VAL-W12-012). When bumping, refresh from
    # https://github.com/slsa-framework/slsa-github-generator/releases.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false
      provenance-name: "epochly-relay-provenance.intoto.jsonl"
      # When upload-assets: false, the SLSA generator skips its
      # upload-assets job, which leaves the "final" outcome as
      # SUCCESS=false. Without continue-on-error: true, the final
      # step exits 27 and the SLSA caller is marked failed despite
      # the attestation having been produced correctly. We download
      # the attestation as a workflow artifact (via the SLSA
      # generator's provenance-name surface) so the publish job can
      # fetch and forward it to PyPI.
      continue-on-error: true
      # compile-generator builds the slsa-generator-generic binary from
      # the pinned-SHA source checkout rather than fetching a pre-built
      # release asset. Required because the generator's internal builder
      # fetch step refuses bare SHAs ("Invalid ref: <sha>. Expected ref
      # of the form refs/tags/vX.Y.Z") -- but our VAL-W12-012 guard
      # mandates SHA pinning. compile-generator bridges the gap at a
      # ~2-minute build cost, preserving both supply-chain pinning AND
      # the v2.1.0 generator surface.
      compile-generator: true

  # ---------------------------------------------------------------------------
  # Publish to PyPI via trusted-publisher OIDC flow (VAL-W12-001/002/005/006).
  #
  # This job MUST:
  #   - run in the `release` GitHub environment (required_reviewers gate)
  #   - hold permissions.id-token: write for OIDC token exchange
  #   - NEVER reference a PYPI_TOKEN / TWINE_PASSWORD secret
  #   - call pypa/gh-action-pypi-publish with attestations: true and
  #     skip-existing: true
  # ---------------------------------------------------------------------------
  publish:
    name: "Publish to PyPI (trusted publisher)"
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: "https://pypi.org/project/epochly-relay/"
    permissions:
      id-token: write   # OIDC token exchange for PyPI trusted publishing
      contents: read    # download the dist artifact
    steps:
      # ----------------------------------------------------------------
      # Fork detection (VAL-W12-044, dry_run_unsigned mode).
      #
      # Per spec sections A.3 and AI.6, forks of epochly-inc/relay MUST
      # be able to run the full release workflow without paid credentials
      # (no PyPI trusted-publisher binding, no NPM_TOKEN, no signing
      # secrets).  When the workflow detects it is running outside the
      # canonical repository (i.e., from a fork), it MUST:
      #   - record dry_run_unsigned: true in workflow output
      #   - skip the actual publish step
      #   - exit cleanly (the SLSA attestation produced by the upstream
      #     `provenance` job is still emitted; only the registry upload
      #     is skipped)
      #
      # Detection rule: github.repository != epochly-inc/relay implies a
      # fork PR / fork-tag run.  Pull-request events from forks also
      # trigger this branch.
      # ----------------------------------------------------------------
      - name: "Fork detection (dry-run-unsigned mode)"
        id: dry-run-unsigned
        env:
          RELAY_RELEASE_REPO: ${{ github.repository }}
        run: |
          if [ "${RELAY_RELEASE_REPO}" != "epochly-inc/relay" ]; then
            echo "RELAY-RELEASE-DRY-RUN-UNSIGNED: fork detected (${RELAY_RELEASE_REPO}); skipping publish."
            echo "dry_run_unsigned=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production repository run; publish will proceed."
            echo "dry_run_unsigned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Download dist artifact"
        if: steps.dry-run-unsigned.outputs.dry_run_unsigned != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: "Download SLSA provenance attestation"
        if: steps.dry-run-unsigned.outputs.dry_run_unsigned != 'true'
        uses: actions/download-artifact@v4
        with:
          name: "epochly-relay-provenance.intoto.jsonl"
          path: provenance/

      - name: "Publish to PyPI (OIDC trusted publisher, Sigstore attestations, idempotent)"
        if: steps.dry-run-unsigned.outputs.dry_run_unsigned != 'true'
        # Pinned to SHA cef2210 (release/v1 branch tip, resolved
        # 2026-05-16 via https://api.github.com/repos/pypa/gh-action-pypi-publish/branches/release/v1);
        # rotate manually when upstream releases v1.x. Renovate/Dependabot
        # bumps go through the release-pipeline review (sub-feature w12.3).
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          # Sigstore-backed PEP 740 PyPI distribution attestations.
          # The action signs every dist/* file with the GitHub OIDC
          # identity before upload (VAL-W12-005).
          attestations: true
          # Idempotent re-runs: a re-pushed tag whose distribution is
          # already on PyPI no-ops (VAL-W12-006).
          skip-existing: true
          packages-dir: dist/
          # NO `password:` input. Trusted-publisher OIDC flow only.
          # (VAL-W12-001 enforced by the static guard.)
