# epochly-relay (Python SDK package skeleton)
#
# This package will house the Relay Python SDK (W3). For W1.5 it carries the
# generated canonical schemas (Pydantic v2 BaseModel subclasses) under
# `relay/_generated/schemas/`, produced by the W1.5 codegen pipeline
# (datamodel-code-generator from packages/schemas/raw/openapi.yaml).
#
# Per VAL-W1-033: `python -c "from relay._generated.schemas import RunResult,
# GateDecision, ..."` MUST succeed; every generated class is a `BaseModel`
# subclass with `model_config = ConfigDict(extra='forbid')`.
#
# The hand-authored rich-validation envelopes (cross-field checks, canonical
# serializers) live under `packages/schemas/python/relay_schemas/`; the
# W1.5 generated tree is a base layer the SDK can compose on top of.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epochly-relay"
version = "0.1.7"
description = "Relay Python SDK (placeholder; W3 wires the client surface)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Epochly, Inc.", email = "engineering@epochly.com" },
]
dependencies = [
  "pydantic>=2.7,<3",
  # W3.1: the SDK calls the local sidecar over loopback HTTP (the /health
  # nonce challenge on attach, the lifecycle-metadata ingest surface in
  # W3.2). A single shared httpx.Client is created per Relay instance.
  # Pinned to match the sidecar's range so the workspace resolves one
  # httpx version.
  "httpx>=0.27,<0.29",
  # W3.1: SDK auto-spawn reuses relay_sidecar.spawn.acquire_or_attach,
  # whose race serialization is built on portalocker. Pinned to match the
  # sidecar package's range.
  "portalocker>=2.10,<3",
  # W3.1: the SDK reuses the canonical, race-safe sidecar spawn path
  # (relay_sidecar.spawn.acquire_or_attach) plus the file-based event log.
  # This is a workspace dependency: uv resolves it from the workspace
  # tree, never from a published-index copy (CLAUDE.md import-boundary
  # rule -- the SDK consumes the sidecar package, it does not fork it).
  "epochly-relay-sidecar",
  # W1.5: the generated + hand-authored canonical schema models the SDK
  # composes on top of. Also a workspace dependency.
  "epochly-relay-schemas",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "httpx>=0.27,<0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.hatch.build.targets.sdist]
include = [
  "relay",
  "README.md",
]

[tool.uv.sources]
epochly-relay-sidecar = { workspace = true }
epochly-relay-schemas = { workspace = true }
