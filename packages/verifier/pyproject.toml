# epochly-relay-verifier (Python offline verifier package).
#
# W10.1 surface: offline JWKS resolution with bundled JWKS shipping inside
# the wheel, BYO trust-anchor via flag or config file, and clear-fail when
# no JWKS is available. The verifier package is the canonical OSS-portable
# trust-anchor consumer per spec section AO.4 line 6165 -- it ships in
# relay/ (Apache 2.0), defaults to https://relay.epochly.com/.well-known/
# jwks.json, and supports BYO trust anchors. Trust-anchor key material
# (signing private keys, KMS refs, TSA credentials, transparency-log
# custody keys) lives ONLY in relay-platform/ and is not granted by
# Apache 2.0 (CLAUDE.md banned pattern #14).
#
# Spec anchors:
#   AO.1 (line 6113-6123)  Trust anchor: JWKS, transparency log, TSA
#   AO.3 (line 6145-6158)  Trust anchor governance program
#   AO.4 (line 6160-6168)  OSS verifier defaults + BYO trust anchors
#   L.1  (line 4442)       Signing keys / JWKS publication
#   L.2  (line 4462)       Auditor trust-bundle download for offline use
#   L.5  (line 4482)       Trust bundle drift behaviour
#   K    (line 4382)       Verifier output trust_anchor_source field
#   Edge cases (4382)      JWKS unreachable -> bundled / cache / fail
# Eng plan anchors:
#   W10 (line 130-135)     packages/verifier/ scope
# CLAUDE.md anchors:
#   keystone invariant 11  Trust anchor is the commercial moat
#   banned pattern 13      Default JWKS URL is board-level decision
#   banned pattern 14      No trust-anchor key material in OSS
#
# Contract assertions: VAL-W10-001 .. VAL-W10-009 (w10.1).
# w10.2 (RFC 7515 JWS) / w10.3 (RFC 8785 JCS) / w10.4 (bundle validate)
# are separate feature-sized commits; this package's __init__.py reserves
# the surface only.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epochly-relay-verifier"
version = "0.0.0"
description = "Relay offline evidence verifier (Python; bundled JWKS, BYO trust anchor, offline-first)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Epochly, Inc.", email = "engineering@epochly.com" },
]
dependencies = [
  # The offline verifier has NO first-party runtime dependency: it vendors
  # its own RelayErrorCode constants (e.g. bundle_paths.RELAY_EVID_024,
  # tsa.RELAY_EVID_031 / RELAY_EVID_038) and the one schema-id string it
  # writes (local_signer -> relay.evidence_bundle.v1) so an air-gapped
  # auditor install stands alone on third-party crypto libs only (README
  # "strict offline-first semantics"; spec AO.4; keystone invariant #11).
  # relay_schemas is a TEST-only extra (see [project.optional-dependencies]).
  # Ed25519 + ECDSA-P256 JWS verification (RFC 7518 + RFC 8037). Pinned
  # major-version range; the CLI's evidence verifier
  # (packages/cli/src/relay_cli/evidence_verifier.py) uses the same
  # surface and version family.
  "cryptography>=42",
  "asn1crypto>=1.5",
  "rfc3161-client>=1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",  # property suites (test_merkle_property.py)
  # TEST-ONLY: the VAL-V3M1-016 deprecation guard
  # (test_v3m1_no_deprecation_on_subject_access.py) imports
  # relay_schemas.envelopes (the process-level flat-subject deprecation
  # tracker) to assert production callers never trip it. Production code
  # never imports relay_schemas (the offline verifier vendors its own
  # constants), so it is a test dependency, not a runtime one.
  "epochly-relay-schemas",
]

[tool.hatch.build.targets.wheel]
packages = ["src/relay_verifier"]
# Ship the bundled JWKS snapshot inside the wheel (VAL-W10-003). The
# importlib.resources loader in relay_verifier.bundled depends on this
# file being present alongside the package modules.
[tool.hatch.build.targets.wheel.force-include]
"src/relay_verifier/bundled_jwks.json" = "relay_verifier/bundled_jwks.json"
# W10.4 VAL-W10-042: ship the public TSA cert chain inside the wheel so
# importlib.resources finds it at the canonical packaged path
# relay_verifier/tsa_chain/tsa-chain.pem. Banned pattern #14 still
# applies; the file contains PUBLIC certs only.
"src/relay_verifier/tsa_chain/tsa-chain.pem" = "relay_verifier/tsa_chain/tsa-chain.pem"

[tool.hatch.build.targets.sdist]
include = [
  "src/relay_verifier",
  "README.md",
]

[tool.uv.sources]
epochly-relay-schemas = { workspace = true }
