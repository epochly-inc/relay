# Canonical Relay error-code registry (W1.4 / VAL-W1-057).
#
# Single source of truth for every `RELAY-{AREA}-NNN` error code referenced
# anywhere in the Relay v0.1 contract surface (contract.md + contract-drafts/).
#
# Generated outputs (this YAML is the source; outputs are DERIVED, not authored):
#   - packages/schemas/python/relay_schemas/error_codes.py  (RelayErrorCode constants)
#   - packages/schemas/typescript/src/error_codes.ts        (RelayErrorCode object literal)
#
# W1.4 generator: packages/schemas/scripts/gen_error_codes.py (minimal Python
# script). The W1.5 codegen pipeline (datamodel-code-generator + openapi-
# typescript + drift check) will replace this minimal generator step. The
# YAML format here is deliberately compatible with the W1.5 pipeline (flat
# string list per code; W1.5 only needs to re-emit the constant tables).
#
# Spec anchors:
#   B.4 lines 3392-3428      closed error envelope + per-code retry_advice table
#   contract preamble CW-003 namespace allocation
#
# VAL-W1-057 enforcement: a CI tier-1 plumbing test runs
#   grep -roE 'RELAY-[A-Z]+-[0-9]{3}' contract.md contract-drafts/
# and diffs the captured code set against `codes[]` below. Codes referenced
# in contract text but missing from this YAML fail the test. Codes in this
# YAML never referenced by any contract surface emit a warning but do NOT
# fail (room for spec-locked codes not yet bound in contract assertions).
#
# Convention:
#   - YAML key `codes` is a flat list of strings. Each string is an exact
#     `RELAY-{AREA}-NNN` token.
#   - The generated Py constant for `RELAY-ING-031` is
#     `RelayErrorCode.RELAY_ING_031` (uppercase + underscore + numeric tail);
#     the TS form is `RelayErrorCode.RELAY_ING_031`. Both mirror the YAML
#     token verbatim modulo hyphen->underscore.
#   - Codes are sorted lexicographically within `codes`.
#
# VAL-W1-030 requirement: the 15 documented spec B.4 codes (RELAY-ING-001,
# RELAY-ING-014, RELAY-ING-021, RELAY-ING-031, RELAY-AUTH-001, RELAY-AUTH-014,
# RELAY-RATE-001, RELAY-RATE-014, RELAY-GATE-001, RELAY-GATE-014,
# RELAY-GATE-021, RELAY-EVID-001, RELAY-EVID-014, RELAY-REPLAY-001,
# RELAY-REPLAY-014) MUST all be present in this list. Their generated
# constants are checked by VAL-W1-030 tests.

schema: relay.error_codes.v1

