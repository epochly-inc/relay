# -----------------------------------------------------------------------------
# Per-code structured metadata (M05 w5-explain; VAL-V2M05-016, VAL-V2M05-017).
# -----------------------------------------------------------------------------
#
# The flat `codes:` list above is the source-of-truth registry for the W1.4
# constant generator (gen_error_codes.py). It treats this YAML as the
# single-source list of wire-format tokens.
#
# `code_details:` below is an additive mapping of structured metadata
# (description, http_status, spec anchor) for the subset of codes whose
# wire envelope requires explicit per-code wiring. The generator ignores
# this key (it only reads `codes:`). The Python registry loader at
# packages/schemas/python/relay_schemas/error_code_registry.py exposes
# this mapping for callers that need description + http_status.
#
# Only M05 w5-explain codes are populated here today; other workers may
# add additional entries as needed. Entries are keyed by the canonical
# wire token (e.g. `RELAY-EXPLAIN-001`) and must have non-empty
# `description` and an `http_status` integer in the canonical 4xx/5xx range.

code_details:
  RELAY-EVAL-024:
    description: >-
      Pass@N filter rejection: the assertion set produced an uninformative
      edge across the last N runs (all-pass or all-fail). Spec AL.2
      (lines 5775-5785).
    http_status: 422
    spec_anchor: "AL.2 5775-5785"
  RELAY-EXPLAIN-001:
    description: >-
      Explain ingestion received a hypothesis whose span_id is not present
      on the associated run; the cross-row check failed before INSERT.
      Spec T (line 4895).
    http_status: 422
    spec_anchor: "T 4895"
