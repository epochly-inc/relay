# -----------------------------------------------------------------------------
# Per-code structured metadata (M05 w5-explain; VAL-V2M05-016, VAL-V2M05-017).
# -----------------------------------------------------------------------------
#
# The flat `codes:` list above is the source-of-truth registry for the W1.4
# constant generator (gen_error_codes.py). It treats this YAML as the
# single-source list of wire-format tokens.
#
# `code_details:` below is an additive mapping of structured metadata
# (description, http_status, spec anchor) for the subset of codes whose
# wire envelope requires explicit per-code wiring. The generator ignores
# this key (it only reads `codes:`). The Python registry loader at
# packages/schemas/python/relay_schemas/error_code_registry.py exposes
# this mapping for callers that need description + http_status.
#
# Only M05 w5-explain codes are populated here today; other workers may
# add additional entries as needed. Entries are keyed by the canonical
# wire token (e.g. `RELAY-EXPLAIN-001`) and must have non-empty
# `description` and an `http_status` integer in the canonical 4xx/5xx range.

code_details:
  RELAY-EVAL-024:
    description: >-
      Pass@N filter rejection: the assertion set produced an uninformative
      edge across the last N runs (all-pass or all-fail). Spec AL.2
      (lines 5775-5785).
    http_status: 422
    spec_anchor: "AL.2 5775-5785"
  RELAY-EXPLAIN-001:
    description: >-
      Explain ingestion received a hypothesis whose span_id is not present
      on the associated run; the cross-row check failed before INSERT.
      Spec T (line 4895).
    http_status: 422
    spec_anchor: "T 4895"
  # V2M08 w8-ai-hardening structured metadata. Each entry below carries
  # the contract-required `category` + `message_template` fields plus the
  # canonical `description`, `http_status`, and `spec_anchor`. The loader
  # at error_code_registry.py exposes all fields via CodeDetail; callers
  # construct the wire envelope by formatting message_template against
  # context.
  RELAY-ING-041:
    category: ingest
    description: >-
      Ingest span exceeded the canonical-JSON span size limit (256 KiB
      / 262144 bytes) or the nesting depth limit (16 levels). The envelope
      carries offending_span_id plus either measured_bytes or
      reason=nesting_depth_exceeded.
    message_template: >-
      span exceeded ingest hardening limits (256 KiB canonical-JSON size
      and depth-16 nesting); offending_span_id={offending_span_id}.
    http_status: 413
    spec_anchor: "AI line 5659"
  RELAY-REDACT-014:
    category: redaction
    description: >-
      Redaction policy publish rejected because a regex matcher exceeded
      the 50 ms per-input wall-clock budget when evaluated against the
      published catastrophic-backtracking corpus. Envelope carries
      matcher_id plus measured_ms.
    message_template: >-
      redaction matcher {matcher_id} exceeded the 50 ms per-input ReDoS
      regex budget (measured {measured_ms} ms); revise the pattern.
    http_status: 422
    spec_anchor: "AI line 5665"
  RELAY-AUTH-017:
    category: auth
    description: >-
      Request rejected because the signed timestamp is outside the
      acceptable +/-300 s clock-skew window. Envelope carries
      server_now_utc and client_claim_utc so the client can self-diagnose;
      the remediation hint points at NTP / system time sync.
    message_template: >-
      clock skew exceeds +/-300 s window: server_now_utc={server_now_utc}
      client_claim_utc={client_claim_utc}; remediation: sync the client
      clock via NTP or the host time service.
    http_status: 401
    spec_anchor: "L line 4479; AI lines 5651-5670"
  RELAY-AUTH-022:
    category: auth
    description: >-
      Auditor-room token presented from an IP that does not match its
      first-use IP binding. [OUT-OF-SCOPE-PRIVATE]: auditor rooms live in
      private relay-platform/; the enforcement runtime is NOT shipped in
      OSS relay/. This code is registered in the public OSS registry so
      verifier and CLI tools can decode envelopes produced by the hosted
      surface.
    message_template: >-
      auditor token rejected by first-use IP binding [OUT-OF-SCOPE-PRIVATE].
    http_status: 403
    spec_anchor: "AI line 5675"
  RELAY-ING-045:
    category: ingest
    description: >-
      Ingest span carried invalid UTF-8 byte sequences in an indexed
      field (prompt_template_id, tool_name, model, retriever_name, or any
      field declared via indexed_string_fields). Envelope carries
      field_path identifying the offending field.
    message_template: >-
      indexed field {field_path} contains invalid UTF-8; all indexed
      string fields MUST be valid UTF-8 NFC.
    http_status: 400
    spec_anchor: "AI line 5698"
