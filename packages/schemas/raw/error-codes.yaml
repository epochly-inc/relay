- code: RELAY-GATE-031
  domain: gate
  severity: error
  description: |
    A `GatePolicy` condition references a metric name that is not defined in `relay.gate_metric_catalog.v1`. Detected by `metric_compiler.validate_policy` at policy-publish time, before the policy can be activated against any scope.
  triggers: |
    Author of a gate policy typed a metric name that does not match any registered metric in the catalog, or referenced a metric from a private vertical pack that the active catalog does not load.
  how_to_fix: |
    Register the metric in `gate_metric_catalog.v1.json` (and ship it with its source/aggregation/sampling clauses) or correct the metric name in the policy. Do not work around the validator; a policy that references an undefined metric cannot produce a binding decision.
