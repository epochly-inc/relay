  - code: RELAY-REPLAY-001
    domain: replay
    severity: error
    description: |
      Default replay-namespace rejection (catch-all).
    triggers: |
      Replay request failed in a way more specific codes do not classify.
    how_to_fix: |
      Inspect `details` on the envelope; consult `docs/how-to/debug-replay-failures.md`.
    spec_section: "E"
    introduced_in: v0.1.0
  - code: RELAY-REPLAY-002
    domain: replay
    severity: error
    description: |
      Replay precondition not met (missing fixture, missing manifest binding, or stale handoff).
    triggers: |
      Caller invoked `rly replay run` against a case whose prerequisites are not satisfied.
    how_to_fix: |
      Confirm the case has a recorded cassette and an active manifest binding; re-record if needed.
    spec_section: "E.2"
    introduced_in: v0.1.0
  - code: RELAY-REPLAY-014
    domain: replay
    severity: error
    description: |
      Side-effecting tool attempted execution during replay without an audited policy override. Cassette-first replay is default-deny for `mutating` and `external_irreversible` tools.
    triggers: |
      Replay run hits a tool span whose `side_effect_class` requires either cassette playback (recorded output) or an explicit two-person approval override.
    how_to_fix: |
      Use cassette mode (default), or add an audited `side_effect_class` policy override; never auto-approve `mutating` or `external_irreversible` classes in CI.
    spec_section: "E.3"
    introduced_in: v0.1.0
