  - code: RELAY-COVERAGE-001
    domain: contract-coverage
    severity: error
    description: |
      Coverage invariant: orphan assertion (an assertion has no owning feature).
    triggers: |
      `rly contract publish` detected an assertion without exactly one owner.
    how_to_fix: |
      Assign the assertion to a feature in the manifest; re-publish.
    spec_section: "D.5"
    introduced_in: v0.1.0
  - code: RELAY-COVERAGE-002
    domain: contract-coverage
    severity: error
    description: |
      Coverage invariant: duplicate `expression` digest across assertions.
    triggers: |
      Two assertions in the manifest have the same canonical-form expression.
    how_to_fix: |
      Consolidate the duplicate assertions; rename or re-scope one of them.
    spec_section: "D.5"
    introduced_in: v0.1.0
  - code: RELAY-COVERAGE-003
    domain: contract-coverage
    severity: error
    description: |
      Coverage invariant: missing `owner_email` on a P0/P1 assertion.
    triggers: |
      P0 or P1 assertion lacks a human owner contact.
    how_to_fix: |
      Add `owner_email`; P0/P1 assertions require exactly one human owner.
    spec_section: "D.5"
    introduced_in: v0.1.0
  - code: RELAY-COVERAGE-004
    domain: contract-coverage
    severity: error
    description: |
      Coverage invariant: duplicate primary ownership.
    triggers: |
      More than one feature claims `primaryFulfills` for the same assertion.
    how_to_fix: |
      Re-scope so exactly one feature primarily fulfills each assertion; other features may `secondaryFulfills`.
    spec_section: "D.5"
    introduced_in: v0.1.0
  - code: RELAY-EVAL-024
    domain: eval
    severity: error
    description: |
      Pass@N filter rejection: the assertion set produced an uninformative edge across the last N runs (all-pass or all-fail). Spec AL.2 (lines 5775-5785).
    triggers: ""
    how_to_fix: ""
    spec_section: "AL.2 5775-5785"
    introduced_in: v0.1.0
  - code: RELAY-EVID-001
    domain: evidence
    severity: error
    description: |
      Default evidence-namespace rejection (catch-all).
    triggers: |
      Evidence submission failed in a way more specific codes do not classify.
    how_to_fix: |
      Inspect `details`; consult `docs/evidence/bundle-anatomy.md`.
    spec_section: "K"
    introduced_in: v0.1.0
  - code: RELAY-EVID-002
    domain: evidence
    severity: error
    description: |
      Evidence bundle is incomplete: at least one required claim is missing its paired artifact hash, exit code, span IDs, or assertion IDs.
    triggers: |
      Bundle assembled without binding every success claim to its evidence (CLAUDE.md keystone invariant #2).
    how_to_fix: |
      Re-run the validation step so the runner emits the missing artifacts; rebuild the bundle.
    spec_section: "K"
    introduced_in: v0.1.0
  - code: RELAY-EVID-014
    domain: evidence
    severity: error
    description: |
      Evidence bundle signature verification failed. Subcodes carry the specific failure (`signature_invalid`, `signature_key_revoked`, `trust_anchor_mismatch`, `manifest_digest_mismatch`).
    triggers: |
      JWS signature fails verification against the configured trust-anchor JWKS, signing key is revoked, declared `trust_anchor` does not match verifier config, or manifest digest does not match the stored value.
    how_to_fix: |
      Investigate. Do not ignore. Pull the bundle and re-run `rly evidence verify --verbose` to inspect `details.subcode`; consult `docs/evidence/signing-key-lifecycle.md`.
    spec_section: "K, AO"
    introduced_in: v0.1.0
  - code: RELAY-EVID-024
    domain: evidence
    severity: error
    description: |
      Evidence bundle redaction policy missing or invalid.
    triggers: |
      Bundle submitted without an active redaction policy version, or referencing a revoked policy.
    how_to_fix: |
      Publish a current redaction policy and re-bundle.
    spec_section: "G"
    introduced_in: v0.1.0
  - code: RELAY-EVID-031
    domain: evidence
    severity: error
    description: |
      Evidence bundle trust-anchor mismatch: declared `trust_anchor` does not match verifier configuration.
    triggers: |
      Bundle's `trust_anchor` field references a JWKS the verifier is not configured to trust.
    how_to_fix: |
      Configure the verifier with the bundle's trust anchor (or vice versa); see `docs/evidence/trust-anchor.md`.
    spec_section: "AO.4"
    introduced_in: v0.1.0
  - code: RELAY-EVID-038
    domain: evidence
    severity: error
    description: |
      Evidence bundle TSA timestamp missing or invalid.
    triggers: |
      Bundle assembled without a Time-Stamp Authority countersignature, or with one that fails verification.
    how_to_fix: |
      Re-bundle with a valid TSA countersignature; check the TSA's availability.
    spec_section: "AO"
    introduced_in: v0.1.0
  - code: RELAY-EVID-040
    domain: evidence
    severity: error
    description: |
      Merkle root mismatch in a multi-claim bundle: the recomputed root differs from the stored root.
    triggers: |
      Claim ordering changed between sign and verify, or a claim payload was tampered.
    how_to_fix: |
      Rebuild the bundle from the original claim set; do not edit claims post-sign.
    spec_section: "K"
    introduced_in: v0.1.0
  - code: RELAY-EVID-041
    domain: evidence
    severity: error
    description: |
      Signer key expired: bundle's `signer_key_id` resolves to a JWK whose `not_after` is in the past (with the L.5 tolerance exhausted).
    triggers: |
      Bundle was signed (or verification ran) after the signing key's expiry.
    how_to_fix: |
      Rotate to an active signing key and re-sign the bundle.
    spec_section: "L.5"
    introduced_in: v0.1.0
  - code: RELAY-EVID-042
    domain: evidence
    severity: error
    description: |
      Signer key revoked: bundle was signed AFTER the JWK's `revoked_at` timestamp.
    triggers: |
      Signature occurred after the key was revoked (signing-before-revocation is a WARN, not an error).
    how_to_fix: |
      Rotate to an active key; investigate why a revoked key was still in use.
    spec_section: "L.5"
    introduced_in: v0.1.0
  - code: RELAY-EXPLAIN-001
    domain: explain
    severity: error
    description: |
      Explain ingestion received a hypothesis whose span_id is not present on the associated run; the cross-row check failed before INSERT. Spec T (line 4895).
    triggers: ""
    how_to_fix: ""
    spec_section: "T 4895"
    introduced_in: v0.1.0
  - code: RELAY-FUTURE-999
    domain: forward-compat
    severity: error
    description: |
      Forward-compat fallback for an unknown sidecar code the SDK does not recognise.
    triggers: |
      Sidecar emitted a wire code with a namespace or numeric ordinal the SDK has not been updated to map.
    how_to_fix: |
      Upgrade the SDK to a release whose code registry covers the new code. The SDK still surfaces the envelope as `RelayUnknownError` for forward compatibility.
    spec_section: "B.4"
    introduced_in: v0.1.0
  - code: RELAY-GATE-001
    domain: gate
    severity: error
    description: |
      Default gate-namespace rejection (catch-all).
    triggers: |
      Gate decision request failed in a way more specific codes do not classify.
    how_to_fix: |
      Inspect `details`; consult `docs/how-to/audit-gate-decision.md`.
    spec_section: "C"
    introduced_in: v0.1.0
  - code: RELAY-GATE-014
    domain: gate
    severity: error
    description: |
      Gate evidence pairing rule violated: a claim is marked passing without paired artifact hash + command + exit code.
    triggers: |
      Gate engine refused to write `accepted` because a contract assertion's evidence is incomplete.
    how_to_fix: |
      Re-run the validation command; ensure the runner emits a structured exit code and artifact digest. See CLAUDE.md keystone invariant #2.
    spec_section: "K"
    introduced_in: v0.1.0
  - code: RELAY-GATE-021
    domain: gate
    severity: error
    description: |
      Stale three-anchor handoff: one of `scope_id`, `actor_identity_hash`, or `manifest_commit_hash` is missing or mismatched.
    triggers: |
      CI submission carrying a `manifest_commit_hash` outside the active or grace window, a revoked actor identity, or a mismatched run_id.
    how_to_fix: |
      Refresh the manifest commit hash and the actor identity; do not bypass. See `docs/contracts/manifest-binding.md` for the three-anchor model.
    spec_section: "C.5"
    introduced_in: v0.1.0
  - code: RELAY-GATE-024
    domain: gate
    severity: error
    description: |
      Gate decision draft references a manifest_commit_hash not in the active or grace window.
    triggers: |
      Submission's manifest commit is older than the configured grace window.
    how_to_fix: |
      Re-publish the contract against the current manifest commit; re-submit.
    spec_section: "F"
    introduced_in: v0.1.0
