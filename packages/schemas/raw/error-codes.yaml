- code: RELAY-EXPLAIN-001
  domain: explain
  severity: error
  description: |
    Explain ingestion received a hypothesis whose span_id is not present on the associated run; the cross-row check failed before INSERT. Spec T (line 4895).
  triggers: |
    `ExplainEngine.ingest_hypothesis` in `packages/explain/src/relay_explain/engine.py` performed the cross-row check `span_belongs_to_run(run_id, span_id)` and the span was not present on the run. Surfaced by `packages/explain/src/relay_explain/api.py` as HTTP 422 with this code in the error envelope (`SpanNotOnRunError`).
