# Relay error-code documentation registry.
#
# Authoritative source for the user-facing error-code reference pages
# rendered at https://relay.epochly.com/docs/errors/<CODE> (and staged at
# https://epochly-inc.github.io/relay/errors/<CODE>/).
#
# Relationship to packages/schemas/raw/relay-error-codes.yaml:
#   - relay-error-codes.yaml is the WIRE-TOKEN registry. It is the source
#     of truth for the constants emitted by gen_error_codes.py and consumed
#     by the SDKs / CLI / verifier as machine-readable identifiers.
#   - This file (error-codes.yaml) is the DOCS registry. It contains the
#     same code set plus the human-readable description / triggers /
#     how_to_fix / spec_section fields that the docs generator
#     (scripts/docs/build-error-reference.py) renders into Markdown pages.
#
# Both files must contain the same set of codes; a Layer-1 audit check
# enforces parity. When a new wire code lands in relay-error-codes.yaml,
# this file gets a corresponding entry; the description / triggers /
# how_to_fix fields MAY start empty (the generator emits "TBD" placeholders
# documented as such) and get filled in as docs work catches up.
#
# Schema:
#   schema_version: relay.error_registry.v1
#   codes:
#     - code: RELAY-<DOMAIN>-<TAIL>
#       domain: <human-readable category label>
#       severity: error | warning | informational
#       description: |
#         <user-facing summary; may be empty until docs are written>
#       triggers: |
#         <what causes the code to be emitted>
#       how_to_fix: |
#         <operator remediation>
#       spec_section: <optional, format "X.Y" or "X" without leading section glyph>
#       introduced_in: <semver tag of first release that emitted the code>
#
# ASCII-only per CLAUDE.md "ASCII-Safe Source".

schema_version: relay.error_registry.v1

codes:
- code: RELAY-AUTH-001
  domain: auth
  severity: error
  description: |
    Default authn failure for the auth namespace (missing or invalid bearer/identity assertion).
  triggers: |
    Request to a protected endpoint without a valid actor identity assertion.
  how_to_fix: |
    Re-authenticate the actor; confirm the identity assertion is current.
  spec_section: "C.5"
  introduced_in: v0.1.0
- code: RELAY-AUTH-014
  domain: auth
  severity: error
  description: |
    Auth assertion failed validation (signature, expiry, or audience mismatch).
  triggers: |
    Bearer/identity assertion fails JWS verification, is expired, or carries the wrong audience claim.
  how_to_fix: |
    Re-mint the actor identity assertion; verify clock skew against the authority's `iat`/`exp` claims.
  spec_section: "C.5"
  introduced_in: v0.1.0
- code: RELAY-AUTH-017
  domain: auth
  severity: error
  description: |
    Request rejected because the signed timestamp is outside the acceptable +/-300 s clock-skew window. Envelope carries server_now_utc and client_claim_utc so the client can self-diagnose; the remediation hint points at NTP / system time sync.
  triggers: |
    Caller's signed `client_claim_utc` differs from the server's `server_now_utc` by more than the +/-300 second clock-skew tolerance; the CLI's gate-evaluate flow surfaces this after an automatic single retry with a compensated timestamp also fails.
  how_to_fix: |
    Re-sync the caller's system clock against NTP (or your platform equivalent) and re-issue the signed request. Persistent drift across retries indicates a misconfigured time source on the caller host, not a server-side issue.
  spec_section: "L line 4479; AI lines 5651-5670"
  introduced_in: v0.1.0
- code: RELAY-AUTH-022
  domain: auth
  severity: error
  description: |
    Auditor-room token presented from an IP that does not match its first-use IP binding. The enforcement runtime is hosted-only and is not shipped in OSS Relay. This code is registered in the OSS registry so verifier and CLI tools can decode envelopes produced by the hosted surface.
  triggers: |
    A subsequent request on an auditor-room session presents the room token from a network egress IP that does not match the IP recorded on first use of that token. (Hosted enforcement only; the OSS verifier and CLI decode the envelope but do not enforce the binding.)
  how_to_fix: |
    Re-mint the auditor-room token from the original network location, or open a new auditor-room session from the new location. Token IP binding is single-use by design and is not relaxable from the OSS surface.
  spec_section: "AI line 5675"
  introduced_in: v0.1.0
- code: RELAY-CANON-001
  domain: canonicalization
  severity: error
  description: |
    Canonical-JSON encoder refused to produce cross-runtime-stable bytes. The current emit site is the BMP-only object-key screen: a JSON object key contains a supplementary-plane codepoint (>= U+10000), where the Python-codepoint sort order and the JS UTF-16 code-unit sort order diverge and would silently yield different JCS bytes between cel-python and cel-js. The wire envelope's word-form subcode `RELAY-CANON-NON-BMP-KEY` discriminates this specific reason.
  triggers: |
    JCS canonicalisation invoked over a value whose object keys include a supplementary-plane codepoint. Raised by `jcs_canonicalize` in both `packages/contracts/src/relay_contracts/canonical.py` and `packages/contracts-typescript/src/canonical.ts`.
  how_to_fix: |
    Re-encode the offending object so all keys are in the Basic Multilingual Plane (< U+10000); supplementary-plane characters remain legal in string values. Cross-runtime byte equality is required for trust-anchor signing (CLAUDE.md keystone invariant 11).
  introduced_in: v0.1.0
- code: RELAY-CEL-001
  domain: contract-cel
  severity: error
  description: |
    Reserved wire-format slot for the Relay CEL evaluator's default (catch-all) error namespace. No emit site in v0.1; the CEL evaluator surfaces every classified failure via 002 (profile), 003 (timeout), 004 (UDF impurity), 006 (numeric out-of-bounds), 007 (regex backref), or 008 (resource exhausted). Reserved so future unclassified CEL failures have a stable code without renumbering the namespace.
  triggers: |
    Not currently emitted. Reserved by `packages/schemas/raw/relay-error-codes.yaml` and the generated `RelayErrorCode.RELAY_CEL_001` constant; no runtime code path raises it in v0.1.
  how_to_fix: |
    If observed in the wild before a future minor release binds it, treat as a defensive bug: file an issue with the envelope contents and consult `packages/contracts/src/relay_contracts/errors.py` for the current classified set.
  introduced_in: v0.1.0
- code: RELAY-CEL-002
  domain: contract-cel
  severity: error
  description: |
    Relay CEL profile violation: the expression uses a construct the profile forbids. Discriminating subtypes: `RELAY-CEL-PROFILE-DYN-DISABLED` (dyn(...) erases the type lattice), `RELAY-CEL-PROFILE-TS-DISABLED` (native timestamp(...)), `RELAY-CEL-PROFILE-DUR-DISABLED` (native duration(...)). Raised at `compile()` time so contract publish fails before any assertion is stored.
  triggers: |
    Evaluation called on an expression containing `dyn(...)`, `timestamp(...)`, or `duration(...)`. Emit site: `packages/contracts/src/relay_contracts/evaluator.py` (the host profile screen) and the TypeScript wasm host at `packages/contracts-typescript/src/wasm-evaluator.ts` (the wasm engine emits the structured RELAY-CEL-002 envelope, mapped by `decodeWasmEnvelope`). Surfaced via `RelayCelProfileError`.
  how_to_fix: |
    Replace the disallowed construct with a profile-safe form: use typed inputs instead of `dyn`, the `relay.timestamp_*` UDFs instead of native temporal types, and structured field access instead of duration arithmetic. See `docs/contracts/udf-reference.md`.
  introduced_in: v0.1.0
- code: RELAY-CEL-003
  domain: contract-cel
  severity: error
  description: |
    Wall-clock evaluation timeout. The Relay CEL evaluator enforces a per-evaluation wall-clock budget; expressions (including UDF execution) that exceed the budget are rejected with subtype `RELAY-CEL-TIMEOUT-001`. Per CLAUDE.md banned-pattern #16 every Relay UDF is pure and bounded; a timeout is a defensive cap, not a normal outcome.
  triggers: |
    Evaluation exceeded the configured wall-clock budget (VAL-W6-003). Emit site: `packages/contracts/src/relay_contracts/evaluator.py` (raises `RelayCelTimeoutError`) and the TypeScript wasm host at `packages/contracts-typescript/src/wasm-evaluator.ts` (the node:worker_threads Worker is hard-killed on budget exceed, raising `RelayCelTimeoutError`).
  how_to_fix: |
    Simplify the expression, shorten the UDF call chain, or raise the per-evaluation budget after auditing the cause. A persistent timeout on a pure UDF indicates either a pathological input or a UDF bug; re-verify the UDF against the conformance corpus.
  introduced_in: v0.1.0
- code: RELAY-CEL-004
  domain: contract-cel
  severity: error
  description: |
    UDF purity violation. A user-defined function was registered with `pure=False`, which the Relay CEL profile forbids: replay must be byte-deterministic, and an impure UDF breaks cross-runtime evidence parity. Subtype: `RELAY-CEL-UDF-IMPURE`. Per CLAUDE.md banned-pattern #16, every registered UDF must be pure (no wall clock, no network, no filesystem, no random, no mutable globals, no locale-dependent ops).
  triggers: |
    UDF registration attempted with `pure=False` (VAL-W6-004), or a caller-supplied non-allowlist UDF was forwarded to the wasm engine. Emit site: `packages/contracts/src/relay_contracts/udf.py` and `packages/contracts-typescript/src/udf.ts` (raise `RelayUdfPurityError` on a non-pure registration); the wasm host at `packages/contracts-typescript/src/wasm-evaluator.ts` raises `RelayCelUnsupportedUdfError` for a non-allowlist UDF.
  how_to_fix: |
    Remove all non-deterministic dependencies from the UDF body (eliminate `time.time` / `Date.now`, network, fs, random, locale-dependent sorts). Re-register with `pure=True` and add a case to the Relay Conformance Corpus (`tests/conformance/cel/`) demonstrating cross-runtime determinism before re-publishing.
  introduced_in: v0.1.0
- code: RELAY-CEL-005
  domain: contract-cel
  severity: error
  description: |
    Reserved wire-format slot in the Relay CEL namespace. No emit site in v0.1; held for a future classified CEL failure mode so the existing 002/003/004/006/007/008 numbering does not need to shift. Reserved in `packages/schemas/raw/relay-error-codes.yaml` and the generated `RelayErrorCode.RELAY_CEL_005` constant.
  triggers: |
    Not currently emitted; reserved code.
  how_to_fix: |
    Not applicable until bound. If observed, treat as defensive: file an issue with the envelope contents.
  introduced_in: v0.1.0
- code: RELAY-CEL-006
  domain: contract-cel
  severity: error
  description: |
    Evaluation produced a non-finite numeric (NaN, +Inf, or -Inf). Subtype: `RELAY-CEL-NUMERIC-OOB`. RFC 8785 (JCS) section 3.2.2 cannot canonicalise NaN or Infinity, so the evaluator rejects the result before any digest or evidence binding is attempted; emitting such a value would silently break cross-runtime signature parity.
  triggers: |
    An arithmetic operation or UDF return produced NaN / +Inf / -Inf, or an out-of-safe-range integer, during evaluation (VAL-W6-006). Emit site: `packages/contracts/src/relay_contracts/evaluator.py` (raises `RelayCelNumericOutOfBoundsError`) and the TypeScript host guard at `packages/contracts-typescript/src/host-guards.ts` (`checkFinite`, applied on the wasm result, raises `RelayCelNumericOutOfBoundsError`).
  how_to_fix: |
    Guard division and exponentiation against zero / overflow in the expression. If the value legitimately needs a non-finite sentinel, represent it as an explicit enum string (e.g. `"infinity"`) so JCS can canonicalise it.
  introduced_in: v0.1.0
- code: RELAY-CEL-007
  domain: contract-cel
  severity: error
  description: |
    Regex literal contains a backreference, which RE2 forbids. Subtype: `RELAY-CEL-PROFILE-REGEX-BACKREF`. RE2 is the only regex engine the Relay CEL profile permits because PCRE-style backtracking opens a ReDoS attack surface. Rejected at `compile()` so contract publish fails before storage.
  triggers: |
    `matches(...)` (or a string literal used as a regex) contains a backreference like `\1`, `(.)\1+`, etc. (VAL-W6-007). Emit site: `packages/contracts/src/relay_contracts/evaluator.py` (raises `RelayCelRegexBackreferenceError`) and the TypeScript host guard at `packages/contracts-typescript/src/host-guards.ts` (`checkRegexBackref`, the host pre-screen run before the wasm call, raises `RelayCelRegexBackreferenceError`).
  how_to_fix: |
    Rewrite the pattern without backreferences. Most backref idioms have an equivalent RE2 formulation using character classes or explicit repetition; otherwise move the check out of CEL into a pure UDF that validates the input structurally.
  introduced_in: v0.1.0
- code: RELAY-CEL-008
  domain: contract-cel
  severity: error
  description: |
    Evaluator orphan-thread cap reached. Subtype: `RELAY-CEL-RESOURCE-EXHAUSTED`. cel-python evaluation is not interruptible from another thread, so a wall-clock timeout leaves the worker thread alive until cel-python finishes; under adversarial inputs orphans would accumulate without bound (DoS). The evaluator caps live orphans at `MAX_ORPHAN_THREADS`; once reached, new evaluations are rejected instead of spawning yet another orphan.
  triggers: |
    Live orphan thread count reached `MAX_ORPHAN_THREADS` at `RelayCelEvaluator.evaluate` (Round-3 P1 fix #4). Emit site: `packages/contracts/src/relay_contracts/evaluator.py` (raises `RelayCelResourceExhaustedError`); covered by `packages/contracts/tests/test_evaluator_orphan_thread_bound.py`.
  how_to_fix: |
    Investigate why prior evaluations are timing out instead of completing: the cap is reached only when cel-python is wedged on pathological inputs. Reduce concurrency, tighten the CEL timeout, or fix the underlying UDF / expression causing the wedges. The cap can be lifted once cel-python exposes a cancellation handle.
  introduced_in: v0.1.0
- code: RELAY-CEL-009
  domain: contract-cel
  severity: error
  description: |
    The CEL engine reported an internal failure that is NOT one of the classified CEL conditions (profile 002, timeout 003, UDF 004, numeric 006, regex 007, resource 008). Subtypes: `RELAY-CEL-ENGINE-COMPILE` (the engine could not parse/compile the expression), `RELAY-CEL-ENGINE-EXEC` (a runtime execution failure such as a missing overload or division by zero), `RELAY-CEL-ENGINE-REQUEST` (a malformed engine request envelope -- a host marshaling bug), and `RELAY-CEL-ENGINE-PANIC` (the engine reactor trapped and was re-instantiated). Introduced with the single-engine (cel-wasm) evaluator: the WASM engine emits its own `RELAY-CEL-001/004/006/PANIC` envelope codes whose NUMBERS overlap the host's classified set (004 = UDF-impure, 006 = numeric-out-of-bounds) but whose MEANINGS differ; the wasm-backed host adapter translates those into THIS distinct 009 code so a wasm compile/exec/request/panic failure is never confused with a host UDF-impurity or numeric-out-of-bounds classification -- a confusion that would poison the gate's signed per-condition error_code (keystone invariant: cross-runtime byte equality).
  triggers: |
    A non-classified `{"ok": false}` envelope from the cel-wasm engine (its own 001/004/006 codes, or an ENGINE_PANIC trap) is translated into this code by `RelayCelEngineError.from_wasm_envelope` and surfaced as `RelayCelEngineError`. Emit site: `packages/contracts/src/relay_contracts/errors.py`; covered by `packages/contracts/tests/test_engine_errors.py`. (The M1 wasm-backed host evaluator constructs this error from the engine envelope; until that evaluator lands, the construction path lives entirely in `errors.py`.) ENGINE-EXEC indicates an expression that compiled but failed at runtime; ENGINE-COMPILE a syntax error; ENGINE-REQUEST / ENGINE-PANIC indicate a host marshaling or engine bug (ENGINE-PANIC should be unreachable for in-profile inputs after the struct/proto fence).
  how_to_fix: |
    Read the subtype + the embedded engine code in the message. ENGINE-COMPILE: fix the CEL syntax. ENGINE-EXEC: check the expression's runtime operands (overloads, division by zero). ENGINE-REQUEST / ENGINE-PANIC: file an issue with the envelope contents -- these indicate a host marshaling or engine bug, not a contract-author error.
  introduced_in: v0.1.0
- code: RELAY-CLI-070
  domain: cli
  severity: error
  description: |
    CLI command failed with a usage error.
  triggers: |
    User invoked the CLI with an unknown subcommand, missing required flag, or invalid argument shape.
  how_to_fix: |
    Run `rly <subcommand> --help`; correct the invocation and retry.
  spec_section: "P"
  introduced_in: v0.1.0
- code: RELAY-CLI-130
  domain: cli
  severity: error
  description: |
    CLI command interrupted (typically Ctrl-C / SIGINT).
  triggers: |
    Operator interrupted a long-running CLI operation.
  how_to_fix: |
    Re-run the command. If interruption was unintentional, check whether the operation completed via the sidecar log.
  spec_section: "P"
  introduced_in: v0.1.0
- code: RELAY-CONTRACT-001
  domain: contract
  severity: error
  description: |
    Contract document envelope validation failure: the document is not a JSON object, is missing the required `schema_version` field, has a non-string `schema_version`, references an unknown `schema_version`, or is missing required top-level fields for its declared kind.
  triggers: |
    `parse_contract` envelope checks rejected the document. Emit site: `packages/contracts/src/relay_contracts/dsl_parser.py` (`_check_envelope` / `_check_required_fields` raise `ContractParseError`). Covered by `packages/contracts/tests/test_w6_4_dsl_parser.py` (VAL-W6-041).
  how_to_fix: |
    Inspect the envelope's `payload.json_path` (and `missing` / `allowed`); correct the offending field and re-submit. Contract schemas live in `packages/schemas/raw/`.
  introduced_in: v0.1.0
- code: RELAY-CONTRACT-002
  domain: contract
  severity: error
  description: |
    Contract input shape / schema validation failure. Reused by two classes of caller: (1) the DSL parser when `severity` is not in the permitted set, and (2) the W9.2 assertion-template runtime when a template's structured input fails JSON-Schema validation. The envelope's `payload.json_path` identifies the offending field.
  triggers: |
    Parser path: `_check_severity` in `packages/contracts/src/relay_contracts/dsl_parser.py` rejects an invalid `severity`. Template path: `packages/evals/src/relay_evals/templates/errors.py` raises `RelayTemplateInputError` (VAL-W9-010). Covered by `packages/contracts/tests/test_w6_4_dsl_parser.py` and `packages/evals/tests/test_w9_3_llm_judge.py`.
  how_to_fix: |
    Inspect `payload.json_path` and `payload.allowed` (when present); fix the input to satisfy the declared schema and re-submit. Do not coerce inputs at the call site -- templates and the parser refuse silent normalisation by design.
  introduced_in: v0.1.0
- code: RELAY-CONTRACT-003
  domain: contract
  severity: error
  description: |
    Contract lifecycle / loader rejection. Reused by two classes of caller: (1) the DSL parser when `lifecycle_state` is not in the permitted set, and (2) the W9.2 assertion-template loader when a caller asks to load a template from a disk path outside the installed package. The v0.1 runtime forbids dynamic plugin loading (spec S, malicious-template-upload mitigation).
  triggers: |
    Parser path: `_check_lifecycle` in `packages/contracts/src/relay_contracts/dsl_parser.py` rejects an invalid `lifecycle_state`. Loader path: `packages/evals/src/relay_evals/templates/errors.py` raises `RelayTemplateLoaderError` (VAL-W9-012). Covered by `packages/contracts/tests/test_w6_4_dsl_parser.py`.
  how_to_fix: |
    Set `lifecycle_state` to one of the documented values, or reference a template by its registered name (see `payload.permitted_names`). Custom templates must ship in a signed package release, not via an ad-hoc path.
  introduced_in: v0.1.0
- code: RELAY-CONTRACT-004
  domain: contract
  severity: error
  description: |
    Contract publish failure: a CEL profile violation, unregistered UDF call, or other compile-time defect was detected by `publish_contract`. The envelope's `payload` carries `assertion_id`, `cel_token` (the failing subtype, e.g. `RELAY-CEL-PROFILE-DYN-DISABLED`), `cel_code`, and, for unregistered UDFs, `unknown_callees`.
  triggers: |
    `publish_contract` in `packages/contracts/src/relay_contracts/pipeline.py` re-wrapped a `RelayCelError` from `RelayCelEvaluator.compile`, or detected an unregistered UDF in function-call position (VAL-W6-042). Covered by `packages/contracts/tests/test_w6_4_dsl_parser.py`.
  how_to_fix: |
    Resolve the underlying CEL failure (see the RELAY-CEL-NNN code in `payload.cel_code`) or register the missing UDF before publishing. Profile violations are intentional and must not be worked around; rewrite the expression in profile-safe form.
  introduced_in: v0.1.0
- code: RELAY-CONTRACT-005
  domain: contract
  severity: error
  description: |
    Contract outcome envelope is incomplete: `evaluate_assertion` produced an outcome missing one or more required binding fields (`assertion_id`, `expression_digest`, `udfs_invoked`, `udf_outputs_jcs`, `wall_time_ms`, `outcome`). CLAUDE.md keystone invariant 2: pass without evidence is not a pass; the runtime refuses to emit a partial envelope.
  triggers: |
    `_validate_outcome_envelope` in `packages/contracts/src/relay_contracts/pipeline.py` detected at least one missing required field (VAL-W6-045); raised as `RelayContractOutcomeError`.
  how_to_fix: |
    Inspect `error.missing` to see which fields were omitted and fix the evaluation path that produced the envelope; do not retry silently. A truncated envelope is `invalid`, not `accepted`.
  introduced_in: v0.1.0
- code: RELAY-COVERAGE-001
  domain: contract-coverage
  severity: error
  description: |
    Coverage invariant: orphan assertion (an assertion has no owning feature).
  triggers: |
    `rly contract publish` detected an assertion without exactly one owner.
  how_to_fix: |
    Assign the assertion to a feature in the manifest; re-publish.
  spec_section: "D.5"
  introduced_in: v0.1.0
- code: RELAY-COVERAGE-002
  domain: contract-coverage
  severity: error
  description: |
    Coverage invariant: duplicate `expression` digest across assertions.
  triggers: |
    Two assertions in the manifest have the same canonical-form expression.
  how_to_fix: |
    Consolidate the duplicate assertions; rename or re-scope one of them.
  spec_section: "D.5"
  introduced_in: v0.1.0
- code: RELAY-COVERAGE-003
  domain: contract-coverage
  severity: error
  description: |
    Coverage invariant: missing `owner_email` on a P0/P1 assertion.
  triggers: |
    P0 or P1 assertion lacks a human owner contact.
  how_to_fix: |
    Add `owner_email`; P0/P1 assertions require exactly one human owner.
  spec_section: "D.5"
  introduced_in: v0.1.0
- code: RELAY-COVERAGE-004
  domain: contract-coverage
  severity: error
  description: |
    Coverage invariant: duplicate primary ownership.
  triggers: |
    More than one feature claims `primaryFulfills` for the same assertion.
  how_to_fix: |
    Re-scope so exactly one feature primarily fulfills each assertion; other features may `secondaryFulfills`.
  spec_section: "D.5"
  introduced_in: v0.1.0
- code: RELAY-EVAL-024
  domain: eval
  severity: error
  description: |
    Pass@N filter rejection: the assertion set produced an uninformative edge across the last N runs (all-pass or all-fail). Spec AL.2 (lines 5775-5785).
  triggers: |
    `check_pass_at_n` in `packages/evals/src/relay_evals/pass_at_n.py` scored the assertion set over the most recent N runs (default N=8) and found either `pass_count == N` (all-pass edge) or `pass_count == 0` (all-fail edge). The publish path surfaces this as HTTP 422 with `failing_edge` referencing the offending run set.
  how_to_fix: |
    Tighten or relax the assertion so it discriminates between passing and failing runs in the most recent N executions, or widen / narrow the sampled cohort before retrying. An all-pass edge means the assertion never fires (wasted CEL budget); an all-fail edge means the assertion always rejects (degenerate). See `docs/contracts/pass-at-n.md`.
  spec_section: "AL.2 5775-5785"
  introduced_in: v0.1.0
- code: RELAY-EVID-001
  domain: evidence
  severity: error
  description: |
    Default evidence-namespace rejection (catch-all).
  triggers: |
    Evidence submission failed in a way more specific codes do not classify.
  how_to_fix: |
    Inspect `details`; consult `docs/evidence/bundle-anatomy.md`.
  spec_section: "K"
  introduced_in: v0.1.0
- code: RELAY-EVID-002
  domain: evidence
  severity: error
  description: |
    Evidence bundle is incomplete: at least one required claim is missing its paired artifact hash, exit code, span IDs, or assertion IDs.
  triggers: |
    Bundle assembled without binding every success claim to its evidence (CLAUDE.md keystone invariant #2).
  how_to_fix: |
    Re-run the validation step so the runner emits the missing artifacts; rebuild the bundle.
  spec_section: "K"
  introduced_in: v0.1.0
- code: RELAY-EVID-014
  domain: evidence
  severity: error
  description: |
    Evidence bundle signature verification failed. Subcodes carry the specific failure (`signature_invalid`, `signature_key_revoked`, `trust_anchor_mismatch`, `manifest_digest_mismatch`).
  triggers: |
    JWS signature fails verification against the configured trust-anchor JWKS, signing key is revoked, declared `trust_anchor` does not match verifier config, or manifest digest does not match the stored value.
  how_to_fix: |
    Investigate. Do not ignore. Pull the bundle and re-run `rly evidence verify --verbose` to inspect `details.subcode`; consult `docs/evidence/signing-key-lifecycle.md`.
  spec_section: "K, AO"
  introduced_in: v0.1.0
- code: RELAY-EVID-024
  domain: evidence
  severity: error
  description: |
    Evidence bundle redaction policy missing or invalid.
  triggers: |
    Bundle submitted without an active redaction policy version, or referencing a revoked policy.
  how_to_fix: |
    Publish a current redaction policy and re-bundle.
  spec_section: "G"
  introduced_in: v0.1.0
- code: RELAY-EVID-031
  domain: evidence
  severity: error
  description: |
    Evidence bundle trust-anchor mismatch: declared `trust_anchor` does not match verifier configuration.
  triggers: |
    Bundle's `trust_anchor` field references a JWKS the verifier is not configured to trust.
  how_to_fix: |
