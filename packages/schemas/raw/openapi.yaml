# Relay Canonical Schemas - OpenAPI 3.1 Source of Truth (W1.5)
#
# Single source of truth for the W1 canonical control-plane envelopes.
# Codegen pipeline (W1.5):
#   - datamodel-code-generator (Python) -> packages/sdk-python/relay/_generated/schemas/
#   - openapi-typescript           (TS)  -> packages/sdk-typescript/src/_generated/
#
# Every persisted control-plane envelope from W1.1-W1.4 appears EXACTLY ONCE
# under components.schemas. The drift check (VAL-W1-035) re-runs codegen and
# verifies zero diff against the committed generated trees.
#
# Per VAL-W1-032: this is the ONLY OpenAPI/JSON Schema source-of-truth file.
# The legacy custom-format envelopes.yaml (kept as a lock-in documentation
# companion) is NOT a JSON Schema document and does NOT participate in
# codegen.
#
# Per VAL-W1-033: generated Python models are Pydantic v2 BaseModel subclasses
# with model_config = ConfigDict(extra='forbid'); enforced by datamodel-code-
# generator flag --use-default-kwarg combined with x-extra=forbid in the
# components.schemas entries (additionalProperties: false propagates).
#
# Per VAL-W1-036: schema_version is pinned as `const` on every envelope so
# documents carrying an unregistered version (e.g. relay.run_result.v99) are
# refused at validation time. The generated runtime raises a hard error
# (RelayUnknownSchemaVersionError) via the schema_version Literal pin.
#
# Per VAL-W1-037: snake_case field names are canonical. The Pydantic side
# uses snake_case attributes; the TS side uses snake_case property names by
# default. A camelCase alias map is documented in the generated header and
# exposed via the SDK alias helpers (packages/sdk-python/relay/_generated/
# schemas/aliases.py and packages/sdk-typescript/src/_generated/aliases.ts).
#
# ASCII-only per CLAUDE.md.
openapi: 3.1.0
info:
  title: Relay Canonical Schemas
  version: 0.1.0
  description: |
    Canonical control-plane envelope schemas for the Relay agent reliability
    OS. Generated from this single OpenAPI 3.1 document into Pydantic v2
    (Python) and TS type aliases. The drift check (VAL-W1-035) keeps the
    generated trees byte-equal with the YAML on every commit.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

paths:
  # Audit-V3M2 (2026-05-18): enumeration of every /v1 and /diagnostics
  # route registered by the sidecar runtime
  # (apps/local-sidecar/relay_sidecar/runtime.py + the routers it
  # include_router()s, currently the state_engine HTTP boundary at
  # apps/local-sidecar/relay_sidecar/state_engine/http_endpoint.py).
  #
  # scripts/check-openapi-route-coverage.py asserts set-equality between
  # the FastAPI registration and this paths: block (VAL-V3M2-001),
  # operation shape (summary + responses 2xx+4xx + requestBody for
  # mutating verbs, VAL-V3M2-002), and operationId uniqueness across
  # the document (VAL-V3M2-003). New routes added to the sidecar MUST
  # land here in the same PR or CI rejects.
  #
  # Most response payloads carry the canonical ErrorEnvelope on the
  # failure path (spec B.4) and an opaque object on the success path.
  # Tightening the success schemas to per-route component refs is
  # tracked outside this audit milestone.

  /diagnostics/sqlite:
    get:
      operationId: getDiagnosticsSqlite
      summary: Read sidecar SQLite journal_mode + busy_timeout
      description: |
        VAL-W2-014 diagnostic. Opens a short-lived aiosqlite connection
        and reports PRAGMA journal_mode + PRAGMA busy_timeout. Used to
        prove WAL mode is in effect after lifespan startup. Bearer-token
        authenticated; no body.
      responses:
        '200':
          description: SQLite diagnostics snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /diagnostics/runtime:
    get:
      operationId: getDiagnosticsRuntime
      summary: Read sidecar runtime diagnostics
      description: |
        Returns the current sidecar runtime state -- start time, uptime,
        active connections, lock state. Documented at
        apps/local-sidecar/relay_sidecar/runtime.py around the
        @app.get('/diagnostics/runtime') decorator. Authenticated via
        bearer token; no body.
      responses:
        '200':
          description: Runtime diagnostics snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /diagnostics/quiesce:
    get:
      operationId: getDiagnosticsQuiesce
      summary: Read sidecar quiesce / draining state
      description: |
        Reports whether the runtime is currently draining for shutdown.
        Used by external supervisors to confirm SIGTERM has been
        observed and the in-flight tracker is unwinding.
      responses:
        '200':
          description: Quiesce-state snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /diagnostics/db:
    get:
      operationId: getDiagnosticsDb
      summary: Read sidecar database connectivity diagnostics
      description: |
        Reports the active SidecarDatabase wiring (path, lock state,
        migration head). Used by self-test and ops smoke checks.
      responses:
        '200':
          description: Database diagnostics snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/ingest:
    post:
      operationId: postV1Ingest
      summary: Generic ingest probe endpoint
      description: |
        W2.6 placeholder ingest endpoint participating in the in-flight
        tracker so drain-path tests (VAL-W2-044) can exercise the
        draining handshake. Full ingest envelope validation lands in
        the typed ingest routes below.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Ingest probe accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Sidecar draining; retry after the indicated window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/ingest/runs:
    post:
      operationId: postV1IngestRuns
      summary: Ingest a run-lifecycle envelope
      description: |
        Submits a run lifecycle envelope (Run / RunResult-draft / etc).
        Canonical control plane writes the eventual run_result row.
        Spec B; envelope kinds defined in components.schemas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Run lifecycle envelope accepted for processing.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failure or stale three-anchor handoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/ingest/spans:batch:
    post:
      operationId: postV1IngestSpansBatch
      summary: Batch-ingest spans
      description: |
        Batch span submission. Enforces the §AI.1 per-envelope 256 KiB
        size cap and nesting depth <= 16 (RELAY-ING-041). Spec B.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Span batch accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failure (oversize, deep, or malformed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/ingest/contract-results:batch:
    post:
      operationId: postV1IngestContractResultsBatch
      summary: Batch-ingest contract evaluation results
      description: |
        Batch submission of ContractResult envelopes produced by the
        contract engine. Spec A.6, B. Canonical control plane resolves
        the join to run_results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Contract-result batch accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/projects/{project_id}/runs:
    get:
      operationId: listProjectRuns
      summary: List runs for a project
      description: |
        Paginated list of runs scoped to a single project. Cursor is
        signed + TTL'd per §B.3 (VAL-V3M2-009).
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A paginated page of runs with a next_cursor field.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid cursor or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Read a single run
      description: Fetch the Run envelope by id.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run envelope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Run not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/runs/{run_id}/trace:
    get:
      operationId: getRunTrace
      summary: Read the span trace for a run
      description: |
        Paginated trace of spans bound to the run. Cursor is signed +
        TTL'd per §B.3.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Page of spans + next_cursor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Run not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/runs/{run_id}/result:
    get:
      operationId: getRunResult
      summary: Read the canonical run_result for a run
      description: |
        Returns the run_result row (control-plane-authored, spec A.1).
        404 until the result-writer has resolved the run.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Canonical RunResult envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '404':
          description: Run or run_result not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/runs/{run_id}/explain:
    get:
      operationId: getRunExplain
      summary: Read explain output (root-cause hypotheses) for a run
      description: |
        Returns ranked root-cause hypotheses associated with the run.
        Hypotheses are generator-versioned (spec §AJ).
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Explain result payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Run not found or no explain output yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/replay-cases:
    post:
      operationId: createReplayCase
      summary: Create a replay case
      description: Submits a ReplayCase envelope. Spec A.8.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayCase'
      responses:
        '201':
          description: Replay case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayCase'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/replay-cases/{case_id}:
    get:
      operationId: getReplayCase
      summary: Read a replay case by id
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ReplayCase envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayCase'
        '404':
          description: Replay case not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/replay-cases/{case_id}/fixtures:
    post:
      operationId: addReplayFixture
      summary: Attach a replay fixture to a replay case
      description: |
        Appends a ReplayFixture to the case. Spec A.8, §E. Fixture
        side_effect_class governs whether the fixture is replayable.
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayFixture'
      responses:
        '201':
          description: Fixture attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayFixture'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Replay case not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/replay-cases/{case_id}/run:
    post:
      operationId: runReplayCase
      summary: Execute a replay case
      description: |
        Enqueues an execution of the replay case. Cassette mode is
        default; live mode requires explicit annotation. Spec §E.
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Replay execution enqueued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failure or policy violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Replay case not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/replay-results/{result_id}:
    get:
      operationId: getReplayResult
      summary: Read a replay execution result
      parameters:
        - in: path
          name: result_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ReplayResult envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
        '404':
          description: Replay result not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/eval-datasets:
    post:
      operationId: createEvalDataset
      summary: Create an eval dataset
      description: Registers a dataset for use by eval runs. Spec §AM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Eval dataset created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/eval-runs:
    post:
      operationId: createEvalRun
      summary: Create an eval run
      description: |
        Enqueues an eval run against a dataset. Spec §AM. The control
        plane writes the eval_run scope_state transitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Eval run enqueued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/eval-runs/{eval_run_id}:
    get:
      operationId: getEvalRun
      summary: Read an eval run
      parameters:
        - in: path
          name: eval_run_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Eval run envelope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Eval run not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/gates/{gate_id}:
    put:
      operationId: putGate
      summary: Upsert a gate definition
      description: |
        Creates or replaces the gate-definition row at gate_id. Spec
        A.5. Backed by the gate-engine writer; not gate_decisions.
      parameters:
        - in: path
          name: gate_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Gate definition upserted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/gate-policies/{policy_id}:
    put:
      operationId: putGatePolicy
      summary: Upsert a gate policy version
      description: |
        Creates or replaces a gate-policy version. Spec A.5
        (VAL-V2M01-001). New versions become effective at the
        declared effective_at boundary.
      parameters:
        - in: path
          name: policy_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatePolicy'
      responses:
        '200':
          description: Gate policy upserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatePolicy'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/gates/{gate_id}/drafts:
    post:
      operationId: submitGateDecisionDraft
      summary: Submit a gate decision draft
      description: |
        Submits a GateDecisionDraft. Spec A.3. NOT authoritative; the
        state engine resolves at most one draft per (gate, scope,
        round) into a canonical gate_decision row written by the
        gate-engine service (keystone #1).
      parameters:
        - in: path
          name: gate_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateDecisionDraft'
      responses:
        '202':
          description: Draft accepted for resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateDecisionDraft'
        '400':
          description: Validation failure or stale three-anchor handoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflicting in-flight draft for the same (scope, round).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/gate-decisions/{decision_id}:
    get:
      operationId: getGateDecision
      summary: Read a canonical gate decision
      parameters:
        - in: path
          name: decision_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Canonical GateDecision envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateDecision'
        '404':
          description: Gate decision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/gates/{gate_id}/rounds:
    get:
      operationId: listGateRounds
      summary: List gate rounds for a gate
      description: |
        Paginated list of GateRound rows for a single gate. Cursor is
        signed + TTL'd per §B.3 (VAL-V3M2-009).
      parameters:
        - in: path
          name: gate_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Page of gate rounds with next_cursor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/evidence-bundles:
    post:
      operationId: createEvidenceBundle
      summary: Create a signed evidence bundle
      description: |
        Creates an evidence bundle row + signed bundle artifact. Spec
        §K. Hosted bundles must be signed by the control-plane
        evidence-signer service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceBundle'
      responses:
        '201':
          description: Evidence bundle created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceBundle'
        '400':
          description: Validation failure or missing claim binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/evidence-bundles/{bundle_id}:
    get:
      operationId: getEvidenceBundle
      summary: Read an evidence bundle row
      parameters:
        - in: path
          name: bundle_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Evidence bundle envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceBundle'
        '404':
          description: Bundle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/evidence-bundles/{bundle_id}/download:
    get:
      operationId: downloadEvidenceBundle
      summary: Download a signed evidence bundle artifact
      description: |
        Streams the signed bundle blob. Subject to legal-hold and
        redaction-tombstone semantics (spec Y).
      parameters:
        - in: path
          name: bundle_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bundle artifact bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Bundle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: Bundle tombstoned or under legal hold and not retrievable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/evidence-bundles/{bundle_id}/verify:
    post:
      operationId: verifyEvidenceBundle
      summary: Verify a signed evidence bundle
      description: |
        Runs the verifier against the bundle artifact. Returns the
        verification verdict + signer trust path (control_plane,
        local_dev, or unknown). Spec §K rule line 4427.
      parameters:
        - in: path
          name: bundle_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Verification verdict payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Verification failed (tampered, missing artifact, etc).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Bundle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/manifests:
    post:
      operationId: createManifestVersion
      summary: Submit a new manifest version
      description: |
        Submits a manifest version. commit_hash is the canonical
        sha256 wire form. Spec §F. The manifest is the source of
        truth for commands, ports, and side-effect policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestVersion'
      responses:
        '201':
          description: Manifest version recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestVersion'
        '400':
          description: Validation failure or signature mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: |
            Manifest version persistence failed (e.g. schema drift /
            integrity error); the manifest was NOT made durable. Canonical
            ErrorEnvelope (RELAY-SIDECAR-010); the concrete failure class
            rides in details.error_class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: |
            Manifest version persistence could not acquire the SQLite write
            lock within the busy-retry budget (RELAY-SQLITE-001). Canonical
            ErrorEnvelope; retry after the Retry-After window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '507':
          description: |
            Manifest version persistence hit ENOSPC mid-write; the
            transaction was rolled back (RELAY-SIDECAR-011). Canonical
            ErrorEnvelope. Free disk space and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/manifests/{manifest_id}/versions/{commit_hash}:
    get:
      operationId: getManifestVersion
      summary: Read a specific manifest version
      parameters:
        - in: path
          name: manifest_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: commit_hash
          required: true
          schema:
            $ref: '#/components/schemas/Sha256Hash'
      responses:
        '200':
          description: ManifestVersion envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestVersion'
        '404':
          description: Manifest or version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/redaction-policies:
    post:
      operationId: createRedactionPolicy
      summary: Publish a new redaction-policy version
      description: |
        Publishes a redaction policy. Each regex matcher must clear
        the 50ms ReDoS budget (VAL-V3M5-001). raw_capture=true
        additionally requires a signed DPA + org-admin approver
        (CLAUDE.md keystone #7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedactionPolicy'
      responses:
        '201':
          description: Redaction policy published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionPolicy'
        '400':
          description: Validation failure, ReDoS-budget exceeded, or DPA missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/redaction-policies/{policy_id}:
    get:
      operationId: getRedactionPolicy
      summary: Read a redaction policy version
      parameters:
        - in: path
          name: policy_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: RedactionPolicy envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionPolicy'
        '404':
          description: Policy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/tokens:
    post:
      operationId: createAuthToken
      summary: Create an auth token
      description: |
        Issues a bearer token scoped to the calling principal. Token
        material is returned ONCE in the response body; subsequent
        reads expose only the token row metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Caller not authorised to mint tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/tokens/{token_id}:
    delete:
      operationId: revokeAuthToken
      summary: Revoke an auth token
      description: |
        Marks the token row as revoked. Revocation propagates to
        subsequent authn checks on the next request.
      parameters:
        - in: path
          name: token_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Token revoked.
        '404':
          description: Token not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/state/transition:
    post:
      operationId: postV1StateTransition
      summary: Apply a state-engine transition
      description: |
        State-engine HTTP boundary. Validates the three-anchor
        handoff (scope_id, actor_identity_hash, manifest_commit_hash;
        keystone #4) BEFORE forwarding to compare_and_set_state.
        Stale or cross-project handoffs are rejected with the
        appropriate GUARD_FAILED code (e.g. RELAY-GATE-021).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Transition applied; canonical scope_state updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Malformed body, missing anchors, or invalid transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            Actor kind not allowed for the requested transition
            (ACTOR_NOT_ALLOWED). Canonical ErrorEnvelope; the structured
            reason rides in details.reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            Scope not found (UNKNOWN_SCOPE). Canonical ErrorEnvelope; the
            structured reason rides in details.reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            Stale three-anchor handoff (RELAY-GATE-021) or state-machine
            conflict (EXPECTED_FROM_MISMATCH / TERMINAL_STATE). Canonical
            ErrorEnvelope; the structured reason rides in details.reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Transition rejected (INVALID_TRANSITION, GUARD_FAILED, or the
            fail-closed UNKNOWN_GUARD drift defense). Canonical
            ErrorEnvelope; the structured reason rides in details.reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # =========================================================================
  # V3 M2 F02 hosted-only 501 stubs (VAL-V3M2-004, VAL-V3M2-005)
  # =========================================================================
  # [OUT-OF-SCOPE-PRIVATE] These 5 routes belong to the private
  # ``relay-platform`` hosted control plane. The OSS sidecar exposes
  # them only as 501 stubs returning RELAY-HOSTED-ONLY with
  # blocked_surface=hosted_control_plane. Implementing the actual
  # hosted logic in OSS is a P0 boundary violation per CLAUDE.md
  # "Repository topology" and .ops boundaries.md DEFERRED item #3.

  /v1/evidence-bundles/{bundle_id}/assess:
    post:
      operationId: hostedAssessEvidenceBundle
      summary: 'Assess an evidence bundle [OUT-OF-SCOPE-PRIVATE]'
      description: |
        [OUT-OF-SCOPE-PRIVATE] Hosted-only: triggers a compliance
        assessment run against an evidence bundle. The OSS sidecar
        returns 501 with RELAY-HOSTED-ONLY; this endpoint is provided
        by the hosted Relay control plane.
      parameters:
        - in: path
          name: bundle_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: |
            [OUT-OF-SCOPE-PRIVATE] (hosted-only behavior, documentary):
            assessment accepted and queued; assessment_bundle_id
            returned. The OSS sidecar never returns this status; it
            always returns 501 below.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '501':
          description: |
            [OUT-OF-SCOPE-PRIVATE] Not available in OSS sidecar;
            provided by hosted Relay control plane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/assessment-bundles/{bundle_id}:
    get:
      operationId: hostedGetAssessmentBundle
      summary: 'Get an assessment bundle [OUT-OF-SCOPE-PRIVATE]'
      description: |
        [OUT-OF-SCOPE-PRIVATE] Hosted-only: retrieves an assessment
        bundle produced by the hosted compliance assessor. The OSS
        sidecar returns 501 with RELAY-HOSTED-ONLY.
      parameters:
        - in: path
          name: bundle_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            [OUT-OF-SCOPE-PRIVATE] (hosted-only behavior, documentary):
            assessment bundle envelope. The OSS sidecar never returns
            this status; it always returns 501 below.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '501':
          description: |
            [OUT-OF-SCOPE-PRIVATE] Not available in OSS sidecar;
            provided by hosted Relay control plane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/assessment-bundles/{bundle_id}/gaps:
    get:
      operationId: hostedGetAssessmentBundleGaps
      summary: 'Get an assessment bundle gap list [OUT-OF-SCOPE-PRIVATE]'
      description: |
        [OUT-OF-SCOPE-PRIVATE] Hosted-only: returns the structured
        gap list for an assessment bundle (which assertions failed,
        which evidence is missing). The OSS sidecar returns 501 with
        RELAY-HOSTED-ONLY.
      parameters:
        - in: path
          name: bundle_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            [OUT-OF-SCOPE-PRIVATE] (hosted-only behavior, documentary):
            gap list envelope. The OSS sidecar never returns this
