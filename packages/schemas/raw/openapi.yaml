          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:

    # --- Shared scalar formats ------------------------------------------------

    Sha256Hash:
      type: string
      pattern: '^sha256-[0-9a-f]{64}$'
      description: |
        Canonical Relay sha256 wire form: 'sha256-' + 64 lowercase hex chars.
        The colon form (sha256:<hex>) and bare-hex form are rejected
        (VAL-W1-009).

    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: |
        Crockford-base32 ULID, 26 uppercase chars (spec B.6 line 3517).
        Lowercase letters not permitted; I, L, O, U excluded.

    RelayErrorCodeStr:
      type: string
      pattern: '^RELAY-[A-Z]+-[0-9]{3}$'
      description: |
        Canonical Relay error-code wire form per VAL-W1-029. Known values
        enumerated in packages/schemas/raw/relay-error-codes.yaml.

    # --- W1.1 envelopes -------------------------------------------------------

    RunResult:
      type: object
      additionalProperties: false
      description: |
        Canonical run outcome. Written exclusively by the control plane.
        A successful run requires a bound evidence_bundle_id (CLAUDE.md
        keystone invariant #2). Spec A.1.
      required:
        - schema_version
        - run_result_id
        - run_id
        - project_id
        - written_by
        - status
        - manifest_commit_hash
        - actor_identity_hash
        - decided_at
        - signature
        - signature_key_id
      properties:
        schema_version:
          type: string
          const: relay.run_result.v1
        run_result_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        written_by:
          type: string
          const: control_plane
        status:
          type: string
          enum: [accepted, remediate_required, blocked, invalid]
        primary_failure_class:
          type: [string, "null"]
        error_priority_rule:
          type: string
          default: first_p0_then_highest_severity_then_earliest_span
        evidence_bundle_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        manifest_commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        actor_identity_hash:
          $ref: '#/components/schemas/Sha256Hash'
        decided_at:
          type: string
          format: date-time
        decision_epoch:
          type: integer
          minimum: 0
          default: 0
        signature:
          type: string
        signature_key_id:
          type: string

    GateDecision:
      type: object
      additionalProperties: false
      description: |
        Canonical gate decision. Written exclusively by the gate engine.
        Spec A.2.
      required:
        - schema_version
        - gate_decision_id
        - gate_id
        - scope_type
        - scope_id
        - round
        - action
        - evidence_bundle_id
        - decided_by
        - decided_at
        - manifest_commit_hash
        - actor_identity_hash
        - signature
        - signature_key_id
      properties:
        schema_version:
          type: string
          const: relay.gate_decision.v1
        gate_decision_id:
          type: string
          format: uuid
        gate_id:
          type: string
          format: uuid
        scope_type:
          type: string
          enum: [run, replay, eval_run, release, domain_pack]
        scope_id:
          type: string
          format: uuid
        round:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [accept, remediate, block, invalid]
        strict_pass:
          type: boolean
          default: false
        failed_assertion_ids:
          type: array
          items:
            type: string
          default: []
        unmet_conditions:
          type: array
          items: {}
          default: []
        evidence_bundle_id:
          type: string
          format: uuid
        cascade_on_block:
          type: boolean
          default: true
        decided_by:
          type: string
          const: gate_engine
        decided_at:
          type: string
          format: date-time
        manifest_commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        actor_identity_hash:
          $ref: '#/components/schemas/Sha256Hash'
        signature:
          type: string
        signature_key_id:
          type: string
        decision_epoch:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
          default: 0

    GateDecisionDraft:
      type: object
      additionalProperties: false
      description: |
        Submitter-facing draft. NOT authoritative. Resolved into a
        gate_decision exactly once by the state engine. Spec A.3.
      required:
        - schema_version
        - draft_id
        - gate_id
        - scope_type
        - scope_id
        - round
        - worker_id
        - manifest_commit_hash
        - actor_identity_hash
        - submitted_at
      properties:
        schema_version:
          type: string
          const: relay.gate_decision_draft.v1
        draft_id:
          type: string
          format: uuid
        gate_id:
          type: string
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        round:
          type: integer
          minimum: 1
        release_sha:
          type: [string, "null"]
        eval_run_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
        evidence_refs:
          type: array
          items: {}
          default: []
        worker_id:
          type: string
          format: uuid
        manifest_commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        actor_identity_hash:
          $ref: '#/components/schemas/Sha256Hash'
        submitted_at:
          type: string
          format: date-time
        resolved_gate_decision_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        draft_kind:
          type: string
          enum: [submitted, dry_run_unsigned]
          default: submitted
        resolution_state:
          type: string
          enum:
            - pending
            - resolved
            - rejected_handoff
            - expired
            - cancelled
            - duplicate_submission
          default: pending
        cancelled_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        cancellation_reason:
          type: [string, "null"]

    GateRound:
      type: object
      additionalProperties: false
      description: |
        Per-round audit trail. Spec A.4.
      required:
        - schema_version
        - gate_round_id
        - gate_id
        - scope_type
        - scope_id
        - round
        - initiated_at
        - initiated_by
      properties:
        schema_version:
          type: string
          const: relay.gate_round.v1
        gate_round_id:
          type: string
          format: uuid
        gate_id:
          type: string
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        round:
          type: integer
          minimum: 1
        initiated_at:
          type: string
          format: date-time
        initiated_by:
          type: string
          enum: [control_plane, cron, user, remediation]
        initiation_reason:
          type: [string, "null"]
        gate_decision_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        restart_predecessor:
          oneOf:
            - type: string
              format: uuid
            - type: "null"

    Actor:
      type: object
      additionalProperties: false
      description: |
        Actor identity registry. FK target for the three-anchor handoff.
        Spec C.5. Audit-R3 (2026-05-18) widened the kind enum to align
        with the sidecar 12-value operational set; envelopes.yaml is
        the canonical reference.
      required:
        - identity_hash
        - kind
        - created_at
      properties:
        identity_hash:
          $ref: '#/components/schemas/Sha256Hash'
        kind:
          type: string
          enum:
            - human
            - bot
            - reviewer
            - sdk
            - machine
            - worker
            - gate_engine
            - result_writer
            - evidence_signer
            - cron
            - control_plane
            - validation_worker
            - ingest_worker
            - replay_worker
        created_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    # --- W1.2 envelopes -------------------------------------------------------

    ManifestVersion:
      type: object
      additionalProperties: false
      description: |
        A specific committed manifest version. commit_hash is the canonical
        Relay sha256 wire form (sha256-<64 lowercase hex>). Spec A.9.
      required:
        - schema_version
        - manifest_version_id
        - manifest_id
        - commit_hash
        - body
        - effective_at
      properties:
        schema_version:
          type: string
          const: relay.manifest.v1
        manifest_version_id:
          type: string
          format: uuid
        manifest_id:
          type: string
          format: uuid
        commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        body:
          type: object
          additionalProperties: true
        signed_by:
          type: [string, "null"]
        signature:
          type: [string, "null"]
        signature_key_id:
          type: [string, "null"]
        effective_at:
          type: string
          format: date-time
        effective_until:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    ScopeState:
      description: |
        Mutable scope state per (scope_kind, scope_id). Discriminated union
        on scope_kind so each kind's allowed state set (spec C.1, spec AM,
        spec Q.2) is statically enforced at the wire-format layer. Spec W
        lines 5072-5085 enumerate all six scope_kind values; eval_run and
        release land in milestone M01 feature w1.7 (VAL-V2M01-036).
      oneOf:
        - $ref: '#/components/schemas/RunScopeState'
        - $ref: '#/components/schemas/ReplayCaseScopeState'
        - $ref: '#/components/schemas/GateRoundScopeState'
        - $ref: '#/components/schemas/EvidenceBundleScopeState'
        - $ref: '#/components/schemas/EvalRunScopeState'
        - $ref: '#/components/schemas/ReleaseScopeState'
      discriminator:
        propertyName: scope_kind
        mapping:
          run: '#/components/schemas/RunScopeState'
          replay_case: '#/components/schemas/ReplayCaseScopeState'
          gate_round: '#/components/schemas/GateRoundScopeState'
          evidence_bundle: '#/components/schemas/EvidenceBundleScopeState'
          eval_run: '#/components/schemas/EvalRunScopeState'
          release: '#/components/schemas/ReleaseScopeState'

    RunScopeState:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - scope_kind
        - state
        - scope_id
        - project_id
        - epoch
