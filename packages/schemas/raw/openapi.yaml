  /v1/orgs/{org_id}/usage:
    get:
      operationId: hostedGetOrgUsage
      summary: 'Get org usage metering [OUT-OF-SCOPE-PRIVATE]'
      description: |
        [OUT-OF-SCOPE-PRIVATE] Hosted-only: returns billing-grade
        usage metering for an org. The OSS sidecar returns 501 with
