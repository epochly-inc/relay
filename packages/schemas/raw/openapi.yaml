# Relay Canonical Schemas - OpenAPI 3.1 Source of Truth (W1.5)
#
# Single source of truth for the W1 canonical control-plane envelopes.
# Codegen pipeline (W1.5):
#   - datamodel-code-generator (Python) -> packages/sdk-python/relay/_generated/schemas/
#   - openapi-typescript           (TS)  -> packages/sdk-typescript/src/_generated/
#
# Every persisted control-plane envelope from W1.1-W1.4 appears EXACTLY ONCE
# under components.schemas. The drift check (VAL-W1-035) re-runs codegen and
# verifies zero diff against the committed generated trees.
#
# Per VAL-W1-032: this is the ONLY OpenAPI/JSON Schema source-of-truth file.
# The legacy custom-format envelopes.yaml (kept as a lock-in documentation
# companion) is NOT a JSON Schema document and does NOT participate in
# codegen.
#
# Per VAL-W1-033: generated Python models are Pydantic v2 BaseModel subclasses
# with model_config = ConfigDict(extra='forbid'); enforced by datamodel-code-
# generator flag --use-default-kwarg combined with x-extra=forbid in the
# components.schemas entries (additionalProperties: false propagates).
#
# Per VAL-W1-036: schema_version is pinned as `const` on every envelope so
# documents carrying an unregistered version (e.g. relay.run_result.v99) are
# refused at validation time. The generated runtime raises a hard error
# (RelayUnknownSchemaVersionError) via the schema_version Literal pin.
#
# Per VAL-W1-037: snake_case field names are canonical. The Pydantic side
# uses snake_case attributes; the TS side uses snake_case property names by
# default. A camelCase alias map is documented in the generated header and
# exposed via the SDK alias helpers (packages/sdk-python/relay/_generated/
# schemas/aliases.py and packages/sdk-typescript/src/_generated/aliases.ts).
#
# ASCII-only per CLAUDE.md.
openapi: 3.1.0
info:
  title: Relay Canonical Schemas
  version: 0.1.0
  description: |
    Canonical control-plane envelope schemas for the Relay agent reliability
    OS. Generated from this single OpenAPI 3.1 document into Pydantic v2
    (Python) and TS type aliases. The drift check (VAL-W1-035) keeps the
    generated trees byte-equal with the YAML on every commit.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

paths: {}

components:
  schemas:

    # --- Shared scalar formats ------------------------------------------------

    Sha256Hash:
      type: string
      pattern: '^sha256-[0-9a-f]{64}$'
      description: |
        Canonical Relay sha256 wire form: 'sha256-' + 64 lowercase hex chars.
        The colon form (sha256:<hex>) and bare-hex form are rejected
        (VAL-W1-009).

    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: |
        Crockford-base32 ULID, 26 uppercase chars (spec B.6 line 3517).
        Lowercase letters not permitted; I, L, O, U excluded.

    RelayErrorCodeStr:
      type: string
      pattern: '^RELAY-[A-Z]+-[0-9]{3}$'
      description: |
        Canonical Relay error-code wire form per VAL-W1-029. Known values
        enumerated in packages/schemas/raw/relay-error-codes.yaml.

    # --- W1.1 envelopes -------------------------------------------------------

    RunResult:
      type: object
      additionalProperties: false
      description: |
        Canonical run outcome. Written exclusively by the control plane.
        A successful run requires a bound evidence_bundle_id (CLAUDE.md
        keystone invariant #2). Spec A.1.
      required:
        - schema_version
        - run_result_id
        - run_id
        - project_id
        - written_by
        - status
        - manifest_commit_hash
        - actor_identity_hash
        - decided_at
        - signature
        - signature_key_id
      properties:
        schema_version:
          type: string
          const: relay.run_result.v1
        run_result_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        written_by:
          type: string
          const: control_plane
        status:
          type: string
          enum: [accepted, remediate_required, blocked, invalid]
        primary_failure_class:
          type: [string, "null"]
        error_priority_rule:
          type: string
          default: first_p0_then_highest_severity_then_earliest_span
        evidence_bundle_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        manifest_commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        actor_identity_hash:
          $ref: '#/components/schemas/Sha256Hash'
        decided_at:
          type: string
          format: date-time
        decision_epoch:
          type: integer
          minimum: 0
          default: 0
        signature:
          type: string
        signature_key_id:
          type: string

    GateDecision:
      type: object
      additionalProperties: false
      description: |
        Canonical gate decision. Written exclusively by the gate engine.
        Spec A.2.
      required:
        - schema_version
        - gate_decision_id
        - gate_id
        - scope_type
        - scope_id
        - round
        - action
        - evidence_bundle_id
        - decided_by
        - decided_at
        - manifest_commit_hash
        - actor_identity_hash
        - signature
        - signature_key_id
      properties:
        schema_version:
          type: string
          const: relay.gate_decision.v1
        gate_decision_id:
          type: string
          format: uuid
        gate_id:
          type: string
          format: uuid
        scope_type:
          type: string
          enum: [run, replay, eval_run, release, domain_pack]
        scope_id:
          type: string
          format: uuid
        round:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [accept, remediate, block, invalid]
        strict_pass:
          type: boolean
          default: false
        failed_assertion_ids:
          type: array
          items:
            type: string
          default: []
        unmet_conditions:
          type: array
          items: {}
          default: []
        evidence_bundle_id:
          type: string
          format: uuid
        cascade_on_block:
          type: boolean
          default: true
        decided_by:
          type: string
          const: gate_engine
        decided_at:
          type: string
          format: date-time
        manifest_commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        actor_identity_hash:
          $ref: '#/components/schemas/Sha256Hash'
        signature:
          type: string
        signature_key_id:
          type: string
        decision_epoch:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
          default: 0

    GateDecisionDraft:
      type: object
      additionalProperties: false
      description: |
        Submitter-facing draft. NOT authoritative. Resolved into a
        gate_decision exactly once by the state engine. Spec A.3.
      required:
        - schema_version
        - draft_id
        - gate_id
        - scope_type
        - scope_id
        - round
        - worker_id
        - manifest_commit_hash
        - actor_identity_hash
        - submitted_at
      properties:
        schema_version:
          type: string
          const: relay.gate_decision_draft.v1
        draft_id:
          type: string
          format: uuid
        gate_id:
          type: string
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        round:
          type: integer
          minimum: 1
        release_sha:
          type: [string, "null"]
        eval_run_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
        evidence_refs:
          type: array
          items: {}
          default: []
        worker_id:
          type: string
          format: uuid
        manifest_commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        actor_identity_hash:
          $ref: '#/components/schemas/Sha256Hash'
        submitted_at:
          type: string
          format: date-time
        resolved_gate_decision_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        draft_kind:
          type: string
          enum: [submitted, dry_run_unsigned]
          default: submitted
        resolution_state:
          type: string
          enum:
            - pending
            - resolved
            - rejected_handoff
            - expired
            - cancelled
            - duplicate_submission
          default: pending
        cancelled_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        cancellation_reason:
          type: [string, "null"]

    GateRound:
      type: object
      additionalProperties: false
      description: |
        Per-round audit trail. Spec A.4.
      required:
        - schema_version
        - gate_round_id
        - gate_id
        - scope_type
        - scope_id
        - round
        - initiated_at
        - initiated_by
      properties:
        schema_version:
          type: string
          const: relay.gate_round.v1
        gate_round_id:
          type: string
          format: uuid
        gate_id:
          type: string
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        round:
          type: integer
          minimum: 1
        initiated_at:
          type: string
          format: date-time
        initiated_by:
          type: string
          enum: [control_plane, cron, user, remediation]
        initiation_reason:
          type: [string, "null"]
        gate_decision_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        restart_predecessor:
          oneOf:
            - type: string
              format: uuid
            - type: "null"

    Actor:
      type: object
      additionalProperties: false
      description: |
        Actor identity registry. FK target for the three-anchor handoff.
        Spec C.5.
      required:
        - identity_hash
        - kind
        - created_at
      properties:
        identity_hash:
          $ref: '#/components/schemas/Sha256Hash'
        kind:
          type: string
          enum: [human, bot, worker, reviewer]
        created_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    # --- W1.2 envelopes -------------------------------------------------------

    ManifestVersion:
      type: object
      additionalProperties: false
      description: |
        A specific committed manifest version. commit_hash is the canonical
        Relay sha256 wire form (sha256-<64 lowercase hex>). Spec A.9.
      required:
        - schema_version
        - manifest_version_id
        - manifest_id
        - commit_hash
        - body
        - effective_at
      properties:
        schema_version:
          type: string
          const: relay.manifest.v1
        manifest_version_id:
          type: string
          format: uuid
        manifest_id:
          type: string
          format: uuid
        commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        body:
          type: object
          additionalProperties: true
        signed_by:
          type: [string, "null"]
        signature:
          type: [string, "null"]
        signature_key_id:
          type: [string, "null"]
        effective_at:
          type: string
          format: date-time
        effective_until:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    ScopeState:
      description: |
        Mutable scope state per (scope_kind, scope_id). Discriminated union
        on scope_kind so each kind's allowed state set (spec C.1) is
        statically enforced at the wire-format layer. Spec W.
      oneOf:
        - $ref: '#/components/schemas/RunScopeState'
        - $ref: '#/components/schemas/ReplayCaseScopeState'
        - $ref: '#/components/schemas/GateRoundScopeState'
        - $ref: '#/components/schemas/EvidenceBundleScopeState'
      discriminator:
        propertyName: scope_kind
        mapping:
          run: '#/components/schemas/RunScopeState'
          replay_case: '#/components/schemas/ReplayCaseScopeState'
          gate_round: '#/components/schemas/GateRoundScopeState'
          evidence_bundle: '#/components/schemas/EvidenceBundleScopeState'

    RunScopeState:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - scope_kind
        - state
        - scope_id
        - project_id
        - epoch
        - created_at
        - updated_at
      properties:
        schema_version:
          type: string
          const: relay.scope_state.v1
        scope_kind:
          type: string
          const: run
        state:
          type: string
          enum: [pending, captured, validating, gated, result_written, terminal]
        scope_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReplayCaseScopeState:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - scope_kind
        - state
        - scope_id
        - project_id
        - epoch
        - created_at
        - updated_at
      properties:
        schema_version:
          type: string
          const: relay.scope_state.v1
        scope_kind:
          type: string
          const: replay_case
        state:
          type: string
          enum: [proposed, fixtures_ready, executing, analyzed, terminal]
        scope_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GateRoundScopeState:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - scope_kind
        - state
        - scope_id
        - project_id
        - epoch
        - created_at
        - updated_at
      properties:
        schema_version:
          type: string
          const: relay.scope_state.v1
        scope_kind:
          type: string
          const: gate_round
        state:
          type: string
          enum: [open, draft_received, evaluating, decision_written, restarted, terminal]
        scope_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EvidenceBundleScopeState:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - scope_kind
        - state
        - scope_id
        - project_id
        - epoch
        - created_at
        - updated_at
      properties:
        schema_version:
          type: string
          const: relay.scope_state.v1
        scope_kind:
          type: string
          const: evidence_bundle
        state:
          type: string
          enum: [building, signed, published, superseded, revoked]
        scope_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IdempotencyRecord:
      type: object
      additionalProperties: false
      description: |
        Request dedupe record. idempotency_key is a Crockford-base32 ULID
        (spec B.2/B.6 line 3517). Spec A.12.
      required:
        - schema_version
        - idempotency_key
        - project_id
        - request_digest
        - response_status
        - first_seen_at
        - expires_at
      properties:
        schema_version:
          type: string
          const: relay.idempotency_record.v1
        idempotency_key:
          $ref: '#/components/schemas/Ulid'
        project_id:
          type: string
          format: uuid
        request_digest:
          $ref: '#/components/schemas/Sha256Hash'
        response_status:
          type: integer
          minimum: 0
        response_ref:
          type: [string, "null"]
        first_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    EventLogEntry:
      type: object
      additionalProperties: false
      description: |
        Append-only audit-trail row. occurred_at is RFC 3339 with a required
        timezone offset; naive timestamps fail at the hand-authored wrapper
        layer (VAL-W1-017). Spec A.11.
      required:
        - schema_version
        - event_id
        - project_id
        - scope_type
        - scope_id
        - event_type
        - actor_kind
        - occurred_at
        - ingest_sequence
      properties:
        schema_version:
          type: string
          const: relay.event_log_entry.v1
        event_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        scope_type:
          type: string
          enum: [run, replay, gate, eval_run, release, manifest, key, other]
        scope_id:
          type: string
          format: uuid
        event_type:
          type: string
        actor_kind:
          type: string
          enum: [control_plane, gate_engine, worker, sdk, user, cron]
        actor_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        manifest_commit_hash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hash'
            - type: "null"
        payload:
          type: object
          additionalProperties: true
          default: {}
        occurred_at:
          type: string
          format: date-time
        ingest_sequence:
          type: integer
          minimum: 0

    # --- W1.3 envelopes -------------------------------------------------------

    EvidenceBundle:
      type: object
      additionalProperties: false
      description: |
        Signed evidence bundle row. Spec J line 2792-2810.
      required:
        - schema_version
        - evidence_bundle_id
        - org_id
        - project_id
        - scope_type
        - scope_id
        - bundle_digest
        - acef_core_version
        - relay_extension_version
        - verification_status
        - redaction_policy_version
        - object_ref
        - created_at
      properties:
        schema_version:
          type: string
          const: relay.evidence_bundle.v1
        evidence_bundle_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        bundle_digest:
          $ref: '#/components/schemas/Sha256Hash'
        acef_core_version:
          type: string
        relay_extension_version:
          type: string
        signing_key_id:
          type: [string, "null"]
        signature_algorithm:
          type: [string, "null"]
        verification_status:
          type: string
          enum: [unverified, verified, tampered, revoked]
        redaction_policy_version:
          type: string
        manifest_commit_hash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hash'
            - type: "null"
        object_ref:
          type: string
        supersedes_bundle_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        created_at:
          type: string
          format: date-time

    EvidenceClaim:
      type: object
      additionalProperties: false
      description: |
        Atomic claim inside an evidence bundle. Spec A.16 lines 3331-3353.
      required:
        - schema_version
        - evidence_claim_id
        - evidence_bundle_id
        - claim_type
        - subject_kind
        - subject_id
        - claim_digest
        - redaction_transform_version
        - manifest_commit_hash
        - signer_key_id
        - signature
        - created_at
      properties:
        schema_version:
          type: string
          const: relay.evidence_claim.v1
        evidence_claim_id:
          type: string
          format: uuid
        evidence_bundle_id:
          type: string
          format: uuid
        claim_type:
          type: string
          enum:
            - run_result
            - gate_decision
            - contract_result
            - replay_result
            - human_oversight
            - incident
            - data_quality_check
            - provider_compatibility
        subject_kind:
          type: string
        subject_id:
          type: string
          format: uuid
        claim_digest:
          $ref: '#/components/schemas/Sha256Hash'
        redaction_transform_version:
          type: string
        manifest_commit_hash:
          $ref: '#/components/schemas/Sha256Hash'
        signer_key_id:
          type: string
        signature:
          type: string
          minLength: 1
        supersedes_claim_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        created_at:
          type: string
          format: date-time

    ReplayCase:
      type: object
      additionalProperties: false
      description: |
        Replay case row. Spec A.8 lines 3131-3145.
      required:
        - schema_version
        - replay_case_id
        - project_id
        - failure_signature_hash
        - inputs_ref
        - inputs_digest
        - created_at
      properties:
        schema_version:
          type: string
          const: relay.replay_case.v1
        replay_case_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        source_run_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        failure_signature_hash:
          type: string
          minLength: 1
        inputs_ref:
          type: string
        inputs_digest:
          $ref: '#/components/schemas/Sha256Hash'
        expected_assertion_ids:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        human_reviewed:
          type: boolean
          default: false
        reviewer_email:
          type: [string, "null"]
        reviewed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        status:
          type: string
          enum: [proposed, approved, retired]
          default: proposed
        created_at:
          type: string
          format: date-time

    ReplayFixture:
      type: object
      additionalProperties: false
      description: |
        Replay fixture row. Spec A.8 lines 3147-3168 + E.2-E.3.
      required:
        - schema_version
        - fixture_id
        - replay_case_id
        - source_span_id
        - kind
        - mode
        - redaction_policy_version
        - input_digest
        - capture_clock
        - side_effect_class
        - created_at
      properties:
        schema_version:
          type: string
          const: relay.replay_fixture.v1
        fixture_id:
          type: string
          format: uuid
        replay_case_id:
          type: string
          format: uuid
        source_span_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [model_call, tool_call, retrieval, embedding, custom]
        mode:
          type: string
          enum: [cassette, live, degraded_live, mock]
        redaction_policy_version:
          type: string
        input_digest:
          $ref: '#/components/schemas/Sha256Hash'
        output_ref:
          type: [string, "null"]
        output_digest:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hash'
            - type: "null"
        provider:
          type: [string, "null"]
        model:
          type: [string, "null"]
        model_signature:
          type: [string, "null"]
        capture_clock:
          type: string
          format: date-time
        refresh_policy:
          type: string
          enum:
            - invalidate_on_signature_change
            - hold_forever
            - refresh_weekly
            - invalidate_on_model_version_change
          default: invalidate_on_signature_change
        side_effect_class:
          type: string
          enum:
            - read_only
            - mutating
            - external_irreversible
            - approval_required
        allowed_in_replay:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time

    # --- W1.4 envelopes -------------------------------------------------------

    RedactionPolicyMatcherRegex:
      type: object
      additionalProperties: false
      required:
        - kind
        - pattern
      properties:
        kind:
          type: string
          const: regex
        pattern:
          type: string
          minLength: 1

    RedactionPolicyMatcherJsonPointer:
      type: object
      additionalProperties: false
      required:
        - kind
        - paths
      properties:
        kind:
          type: string
          const: json_pointer
        paths:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1

    RedactionPolicyMatcher:
      description: |
        Tagged discriminated union on `kind` (VAL-W1-028). Spec G.2 lines
        4127-4133.
      oneOf:
        - $ref: '#/components/schemas/RedactionPolicyMatcherRegex'
        - $ref: '#/components/schemas/RedactionPolicyMatcherJsonPointer'
      discriminator:
        propertyName: kind
        mapping:
          regex: '#/components/schemas/RedactionPolicyMatcherRegex'
