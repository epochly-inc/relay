          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '501':
          description: |
            [OUT-OF-SCOPE-PRIVATE] Not available in OSS sidecar;
            provided by hosted Relay control plane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/projects/{project_id}/compliance/readiness:
    get:
      operationId: hostedGetProjectComplianceReadiness
      summary: 'Get project compliance readiness [OUT-OF-SCOPE-PRIVATE]'
      description: |
        [OUT-OF-SCOPE-PRIVATE] Hosted-only: aggregates compliance
        readiness signals across the project's evidence bundles and
        active compliance packs. The OSS sidecar returns 501 with
        RELAY-HOSTED-ONLY.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            [OUT-OF-SCOPE-PRIVATE] (hosted-only behavior, documentary):
            project compliance readiness envelope. The OSS sidecar
