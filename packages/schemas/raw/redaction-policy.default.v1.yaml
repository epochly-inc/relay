schema_version: relay.redaction.v1
policy_version: hosted-default.v1
raw_capture: false
dpa_ref: null
approver_user_id: null
matchers:
- id: prompt-content
  kind: json_pointer
  paths:
  - /messages/*/content/text
  action: redact
- id: output-content
  kind: json_pointer
  paths:
  - /output/text
  action: redact
- id: password-field
  kind: regex
  pattern: (?i)password
  action: redact
- id: api-key-field
  kind: regex
  pattern: (?i)api[_-]?key
  action: redact
- id: secret-field
  kind: regex
  pattern: (?i)secret
  action: redact
- id: token-field
  kind: regex
  pattern: (?i)token
  action: redact
action_policy:
  hash:
    algorithm: hmac-sha256
    salt_ref: hosted_default_salt
  redact:
    placeholder: <redacted>
  drop:
    placeholder: null
