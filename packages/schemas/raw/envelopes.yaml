      5421-5429). One row per bundle. tsa_genTime is parsed from the
      TimeStampResp CMS SignerInfo. tsa_response_ref points at the
      canonical .tsr blob (R2 on hosted; ~/.relay/evidence/<bundle>/
      timestamp.tsr on local). tsa_response_digest is the sha256 over
      the .tsr bytes so verifiers detect mutation. tsa_witness_signature
      is the optional log-witness countersignature per spec AB line 5418.
    fields:
      schema_version:
        type: literal
        value: relay.evidence_timestamp.v1
        required: true
      evidence_bundle_id:               { type: uuid, required: true }
      tsa_url:                          { type: string, required: true }
      tsa_response_digest:              { type: string, required: true }
      tsa_response_ref:                 { type: string, required: true }
      tsa_serial_number:                { type: string, required: false, nullable: true }
      tsa_genTime:                      { type: timestamptz, required: true }
      tsa_witness_signature:            { type: string, required: false, nullable: true }

  TransparencyLogEntry:
    schema_version: relay.transparency_log_entry.v1
    spec: AB
    description: |
      Append-only public transparency log entry (spec AB lines 5431-5439).
      Inspired by Sigstore Rekor: every issued evidence bundle's
      (bundle_id, digest, time, signer_key) tuple is appended. log_index
      is the canonical 1-based serial index. tree_root_after is the
      Merkle root after this append; inclusion_proof_ref points at the
      served proof JSON. The verifier checks inclusion offline via the
      witness signature carried in the bundle's signature envelope.
      Per spec AB line 5445 the log is append-only; the application role
      grants are INSERT,SELECT only.
    fields:
      schema_version:
        type: literal
        value: relay.transparency_log_entry.v1
        required: true
      log_index:                        { type: int_ge_one, required: true }
      evidence_bundle_id:               { type: uuid, required: true }
      bundle_digest:                    { type: string, required: true }
      signer_key_id:                    { type: string, required: true }
      appended_at:                      { type: timestamptz, required: true }
      tree_root_after:                  { type: string, required: true }
      inclusion_proof_ref:              { type: string, required: false, nullable: true }

  # ---------------------------------------------------------------------------
  # v0.2 OSS completeness, M01 w1-5 (added 2026-05-16): canonical envelopes
  # for the three section-AE evidence-binding SQL tables in
  # packages/schemas/sql/0006_human_oversight.sql.
  # ---------------------------------------------------------------------------
  #
  # Spec anchors (all sectionAE):
  #   HumanOversightEvent      spec AE lines 5494-5508 (VAL-V2M01-030)
  #   DataQualityCheck         spec AE lines 5510-5525 (VAL-V2M01-031)
  #   DataProvenanceRecord     spec AE lines 5527-5539 (VAL-V2M01-032)
  #
  # Per CLAUDE.md keystone invariant #2, evidence claims that reference
  # human oversight, data-quality checks, or data-provenance rows require
  # first-class canonical rows to bind to. Per keystone invariant #10 every
  # envelope carries schema_version pinned via Literal.

  HumanOversightEvent:
    schema_version: relay.human_oversight_event.v1
    spec: AE
    description: |
      Human-in-the-loop oversight event row (spec AE lines 5494-5508;
      VAL-V2M01-030). oversight_kind is the closed six-member enum
      {pre_action_review, post_action_review, escalation, override,
      manual_classification, content_review} mirrored from the SQL CHECK
      constraint. evidence_refs is a JSON array of evidence-bundle /
      evidence-claim references binding the oversight event to durable
      evidence; defaults to [] so a freshly-created event can be
      progressively enriched before sealing.
    fields:
      schema_version:
        type: literal
        value: relay.human_oversight_event.v1
        required: true
      oversight_id:                     { type: uuid, required: true }
      project_id:                       { type: uuid, required: true }
      run_id:                           { type: uuid, required: false, nullable: true }
      ai_system_classification_id:      { type: uuid, required: false, nullable: true }
      oversight_kind:
        type: enum
        values: [pre_action_review, post_action_review, escalation, override, manual_classification, content_review]
        required: true
      actor_user_id:                    { type: uuid, required: false, nullable: true }
      decision:                         { type: string, required: false, nullable: true }
      rationale:                        { type: string, required: false, nullable: true }
      evidence_refs:                    { type: list_any, required: false, default: [] }
      occurred_at:                      { type: timestamptz, required: true }

  DataQualityCheck:
    schema_version: relay.data_quality_check.v1
    spec: AE
    description: |
      Per-dataset data-quality check row (spec AE lines 5510-5525;
      VAL-V2M01-031). check_kind is the closed seven-member enum
      {lineage, representativeness, duplicate_detection,
      schema_conformance, pii_minimization, licensing, staleness} and
      outcome is the closed five-member enum {pass, fail, warn, skipped,
      error}; both mirrored from the SQL CHECK constraints. evaluator
      canonical forms are 'code:<module>.<fn>:vN' or 'human:<user_id>';
      the wire-format layer does not lock the evaluator grammar.
    fields:
      schema_version:
        type: literal
        value: relay.data_quality_check.v1
        required: true
      data_quality_check_id:            { type: uuid, required: true }
      project_id:                       { type: uuid, required: true }
      dataset_id:                       { type: uuid, required: false, nullable: true }
      check_kind:
        type: enum
        values: [lineage, representativeness, duplicate_detection, schema_conformance, pii_minimization, licensing, staleness]
        required: true
      check_name:                       { type: string, required: true }
      inputs_ref:                       { type: string, required: false, nullable: true }
      outcome:
        type: enum
        values: [pass, fail, warn, skipped, error]
        required: true
      metric_value:                     { type: number, required: false, nullable: true }
      threshold_value:                  { type: number, required: false, nullable: true }
      evaluator:                        { type: string, required: true }
      evidence_refs:                    { type: list_any, required: false, default: [] }
      performed_at:                     { type: timestamptz, required: true }

  DataProvenanceRecord:
    schema_version: relay.data_provenance_record.v1
    spec: AE
    description: |
      Per-dataset data-provenance row (spec AE lines 5527-5539;
      VAL-V2M01-032). source_kind is the closed six-member enum
      {first_party, licensed, public_domain, web_scrape, synthetic,
      user_generated} mirrored from the SQL CHECK constraint. license_ref
      is the canonical license identifier (SPDX expression preferred,
      e.g. 'Apache-2.0' / 'CC-BY-4.0') or a customer license-registry URI;
      the wire-format layer does not lock the grammar.
    fields:
      schema_version:
        type: literal
        value: relay.data_provenance_record.v1
        required: true
      provenance_id:                    { type: uuid, required: true }
      project_id:                       { type: uuid, required: true }
      dataset_id:                       { type: uuid, required: true }
      source_kind:
        type: enum
        values: [first_party, licensed, public_domain, web_scrape, synthetic, user_generated]
        required: true
      license_ref:                      { type: string, required: false, nullable: true }
      acquired_at:                      { type: timestamptz, required: false, nullable: true }
      acquired_by_user_id:              { type: uuid, required: false, nullable: true }
      notes:                            { type: string, required: false, nullable: true }
      evidence_refs:                    { type: list_any, required: false, default: [] }

# -----------------------------------------------------------------------------
# Type definitions
# -----------------------------------------------------------------------------
#
# These define how the abstract YAML field types map to language-specific
# representations. The codegen pipeline (W1.5) reads this section to produce
# Pydantic Annotated[...] / TS type aliases.

types:
  uuid:         { python: "UUID", typescript: "string" }
  sha256_hash:
    python: 'Annotated[str, Field(pattern=r"^sha256-[0-9a-f]{64}$")]'
    typescript: "string"
    pattern: '^sha256-[0-9a-f]{64}$'
  ulid:
    python: 'Annotated[str, Field(pattern=r"^[0-9A-HJKMNP-TV-Z]{26}$")]'
    typescript: "string"
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
  timestamptz:  { python: "datetime", typescript: "string", format: "date-time" }
  timestamptz_offset_required:
    python: "datetime"
    typescript: "string"
    format: "date-time"
    constraint: "tzinfo required; naive timestamps rejected (VAL-W1-017)"
  int_ge_one:
    python: 'Annotated[int, Field(ge=1)]'
    typescript: "number"
    constraint: "ge=1"
  int_ge_zero:
    python: 'Annotated[int, Field(ge=0)]'
    typescript: "number"
    constraint: "ge=0"
  list_str:     { python: "list[str]", typescript: "string[]", default: [] }
  list_uuid:    { python: "list[UUID]", typescript: "string[]", default: [] }
  list_any:     { python: "list[Any]", typescript: "unknown[]", default: [] }
  any_object:
    python: "dict[str, Any]"
    typescript: "Record<string, unknown>"
    default: {}
  bool:         { python: "bool", typescript: "boolean" }
  string:       { python: "str", typescript: "string" }
  non_empty_string:
    python: 'Annotated[str, Field(min_length=1)]'
    typescript: "string"
    constraint: "min_length=1 (VAL-W1-021 signature, VAL-W1-022 failure_signature_hash)"
  list_non_empty_str:
    python: 'list[Annotated[str, Field(min_length=1)]]'
    typescript: "string[]"
    default: []
    constraint: "list of non-empty strings (VAL-W1-022 expected_assertion_ids)"
  strict_bool:
    python: 'bool'
    typescript: "boolean"
    constraint: "strict boolean; string forms 'true'/'false' rejected (VAL-W1-023 allowed_in_replay)"
  number:
    python: "float"
    typescript: "number"
  number_unit_interval:
    python: 'Annotated[float, Field(ge=0.0, le=1.0)]'
    typescript: "number"
    constraint: "float in [0, 1] inclusive (VAL-V2M01-008 RootCauseHypothesis.confidence)"
