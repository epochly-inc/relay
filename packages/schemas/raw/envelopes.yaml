# Canonical control-plane envelope schemas (W1.1 + W1.2 scope).
#
# Single source of truth for the core canonical envelopes plus the actors
# registry table referenced by the three-anchor handoff protocol (spec C.5).
#
# Generated outputs:
#   - packages/schemas/python/relay_schemas/envelopes.py (Pydantic v2)
#   - packages/schemas/typescript/src/envelopes.ts (TS types + runtime guards)
#   - packages/schemas/sql/0001_actors.sql (FK target table)
#   - packages/schemas/sql/0002_control_plane.sql (control-plane envelopes DDL)
#
# The W1.5 codegen pipeline will consume this file via datamodel-code-generator
# (Python) and openapi-typescript (TypeScript). Until W1.5 lands, the generated
# outputs above are hand-authored to match this file; the codegen drift check
# (VAL-W1-035) will replace the hand-authored outputs with generator output.
#
# Spec anchors:
#   A.1  run_results
#   A.2  gate_decisions
#   A.3  gate_decision_drafts
#   A.4  gate_rounds
#   A.9  manifest_versions
#   A.11 event_log_entries
#   A.12 idempotency_records
#   B.2  idempotency ULID grammar
#   B.7  schema versioning rules
#   C.1  scope state sets per scope_kind
#   C.4  scope_state epoch monotonicity (aggregate version)
#   C.5  three-anchor handoff
#   W    scope_state aggregate version table
#
# CLAUDE.md keystone invariants enforced at the wire-format layer:
#   #1  control plane writes the result   -> Literal["control_plane"]/["gate_engine"]
#   #4  three-anchor handoff               -> sha256-<hex> pattern + actors FK
#   #10 schema versioning                  -> Literal schema_version per envelope

schemas:

  RunResult:
    schema_version: relay.run_result.v1
    spec: A.1
    description: |
      Canonical run outcome. Written exclusively by the control plane.
      A successful run requires a bound evidence_bundle_id (CLAUDE.md
      keystone invariant #2: pass without evidence is not a pass).
    fields:
      schema_version:
        type: literal
        value: relay.run_result.v1
        required: true
      run_result_id:    { type: uuid, required: true }
      run_id:           { type: uuid, required: true }
      project_id:       { type: uuid, required: true }
      written_by:
        type: literal
        value: control_plane
        required: true
      status:
        type: enum
        values: [accepted, remediate_required, blocked, invalid]
        required: true
      primary_failure_class: { type: string, required: false, nullable: true }
      error_priority_rule:
        type: string
        required: false
        default: first_p0_then_highest_severity_then_earliest_span
      evidence_bundle_id:    { type: uuid, required: false, nullable: true }
      manifest_commit_hash:  { type: sha256_hash, required: true }
      actor_identity_hash:   { type: sha256_hash, required: true }
      decided_at:            { type: timestamptz, required: true }
      decision_epoch:        { type: int_ge_zero, required: false, default: 0 }
      signature:             { type: string, required: true }
      signature_key_id:      { type: string, required: true }
    constraints:
      - name: accepted_requires_evidence
        kind: cross_field
        rule: |
          If status == "accepted" then evidence_bundle_id MUST NOT be null.
          Mirrors the SQL CHECK accepted_requires_evidence on the wire-format
          layer.

  GateDecision:
    schema_version: relay.gate_decision.v1
    spec: A.2
    description: |
      Canonical gate decision. Written exclusively by the gate engine.
      Bound to an evidence_bundle_id and to the three-anchor handoff
      (manifest_commit_hash, actor_identity_hash, scope_id).
    fields:
      schema_version:
        type: literal
        value: relay.gate_decision.v1
        required: true
      gate_decision_id: { type: uuid, required: true }
      gate_id:          { type: uuid, required: true }
      scope_type:
        type: enum
        values: [run, replay, eval_run, release, domain_pack]
        required: true
      scope_id:         { type: uuid, required: true }
      round:            { type: int_ge_one, required: true }
      action:
        type: enum
        values: [accept, remediate, block, invalid]
        required: true
      strict_pass:           { type: bool, required: false, default: false }
      failed_assertion_ids:  { type: list_str, required: false, default: [] }
      unmet_conditions:      { type: list_any, required: false, default: [] }
      evidence_bundle_id:    { type: uuid, required: true }
      cascade_on_block:      { type: bool, required: false, default: true }
      decided_by:
        type: literal
        value: gate_engine
        required: true
      decided_at:            { type: timestamptz, required: true }
      manifest_commit_hash:  { type: sha256_hash, required: true }
      actor_identity_hash:   { type: sha256_hash, required: true }
      signature:             { type: string, required: true }
      signature_key_id:      { type: string, required: true }
      decision_epoch:        { type: int_ge_zero, required: false, default: 0, nullable: true }

  GateDecisionDraft:
    schema_version: relay.gate_decision_draft.v1
    spec: A.3
    description: |
      Submitter-facing draft. NOT authoritative. Resolved into a
      gate_decision exactly once by the state engine. The two state
      columns (draft_kind, resolution_state) are intentionally orthogonal:
      a dry_run_unsigned draft moves through pending -> {expired,
      cancelled, rejected_handoff, duplicate_submission} but can NEVER
      resolve to a gate_decision.
    fields:
      schema_version:
        type: literal
        value: relay.gate_decision_draft.v1
        required: true
      draft_id:         { type: uuid, required: true }
      gate_id:          { type: uuid, required: true }
      scope_type:       { type: string, required: true }
      scope_id:         { type: uuid, required: true }
      round:            { type: int_ge_one, required: true }
      release_sha:      { type: string, required: false, nullable: true }
      eval_run_ids:     { type: list_uuid, required: false, default: [] }
      evidence_refs:    { type: list_any, required: false, default: [] }
      worker_id:        { type: uuid, required: true }
      manifest_commit_hash: { type: sha256_hash, required: true }
      actor_identity_hash:  { type: sha256_hash, required: true }
      submitted_at:         { type: timestamptz, required: true }
      resolved_gate_decision_id:
        type: uuid
        required: false
        nullable: true
      draft_kind:
        type: enum
        values: [submitted, dry_run_unsigned]
        required: false
        default: submitted
      resolution_state:
        type: enum
        values:
          - pending
          - resolved
          - rejected_handoff
          - expired
          - cancelled
          - duplicate_submission
        required: false
        default: pending
      cancelled_at:           { type: timestamptz, required: false, nullable: true }
      cancellation_reason:    { type: string, required: false, nullable: true }
    constraints:
      - name: dry_run_never_resolves
        kind: cross_field
        rule: |
          draft_kind == "submitted"
          OR resolution_state IN
            (pending, expired, cancelled, rejected_handoff, duplicate_submission)
      - name: dry_run_no_decision
        kind: cross_field
        rule: |
          draft_kind == "submitted"
          OR resolved_gate_decision_id IS NULL

  GateRound:
    schema_version: relay.gate_round.v1
    spec: A.4
    description: |
      Per-round audit trail. restart_predecessor is NULL on the first round
      and references the predecessor gate_round_id on every restart round
      (gate restart on failure rule, spec section C).
    fields:
      schema_version:
        type: literal
        value: relay.gate_round.v1
        required: true
      gate_round_id:    { type: uuid, required: true }
      gate_id:          { type: uuid, required: true }
      scope_type:       { type: string, required: true }
      scope_id:         { type: uuid, required: true }
      round:            { type: int_ge_one, required: true }
      initiated_at:     { type: timestamptz, required: true }
      initiated_by:
        type: enum
        values: [control_plane, cron, user, remediation]
        required: true
      initiation_reason:    { type: string, required: false, nullable: true }
      gate_decision_id:     { type: uuid, required: false, nullable: true }
      restart_predecessor:
        type: uuid
        required: false
        nullable: true

  Actor:
    spec: C.5
    description: |
      Actor identity registry. FK target for the three-anchor handoff
      (gate_decision_drafts.actor_identity_hash, gate_decisions.
      actor_identity_hash, run_results.actor_identity_hash). A handoff
      whose actor_identity_hash is missing from this table OR whose
      revoked_at is non-null MUST fail with HandoffResult(ok=False,
      reason="ACTOR_NOT_REGISTERED") (contract preamble line 912).
    fields:
      identity_hash:  { type: sha256_hash, required: true, primary_key: true }
      kind:
        type: enum
        values: [human, bot, worker, reviewer]
        required: true
      created_at:     { type: timestamptz, required: true }
      revoked_at:     { type: timestamptz, required: false, nullable: true }

  # ---------------------------------------------------------------------------
  # W1.2 control-plane envelopes
  # ---------------------------------------------------------------------------

  ManifestVersion:
    schema_version: relay.manifest.v1
    spec: A.9
    description: |
      A specific committed manifest version. commit_hash is the canonical
      Relay sha256 wire form (sha256-<64 lowercase hex>) computed over the
      RFC 8785 JCS canonicalization of the parsed manifest YAML body. The
      contract preamble pins the manifest_commit_hash basis at lines 83-86.
      The colon form (sha256:<hex>) and bare-hex form are both rejected per
      VAL-W1-009; VAL-W1-014, VAL-W1-018, VAL-W1-021 inherit this pin.
    fields:
      schema_version:
        type: literal
        value: relay.manifest.v1
        required: true
      manifest_version_id: { type: uuid, required: true }
      manifest_id:         { type: uuid, required: true }
      commit_hash:         { type: sha256_hash, required: true }
      body:                { type: any_object, required: true }
      signed_by:           { type: string, required: false, nullable: true }
      signature:           { type: string, required: false, nullable: true }
      signature_key_id:    { type: string, required: false, nullable: true }
      effective_at:        { type: timestamptz, required: true }
      effective_until:     { type: timestamptz, required: false, nullable: true }

  ScopeState:
    schema_version: relay.scope_state.v1
    spec: W
    description: |
      Mutable scope state per (scope_kind, scope_id). Implemented as a
      discriminated union on scope_kind so each scope kind's allowed state
      set (spec C.1 lines 3632-3636) is statically enforced at the
      wire-format layer. A document with scope_kind=run carrying
      state=building (an evidence_bundle state) MUST fail validation
      (VAL-W1-011). epoch is the optimistic-concurrency aggregate version
      (spec C.4 lines 3679-3722); it is a non-negative bigint and MUST
      reject -1 (VAL-W1-012). schema_version pins to relay.scope_state.v1
      (VAL-W1-049).

      Note on spec coverage: spec W declares six scope_kind values
      ('run','replay_case','gate_round','evidence_bundle','eval_run','release')
      but spec C.1 only declares state sets for the first four. The
      remaining two (eval_run, release) are state-set-declared in spec
      AM and Q.2 respectively and fall outside the W1.2 contract surface;
      this envelope therefore enumerates only the four C.1 kinds in its
      discriminator. The full six-way union lands when W9/W12 land.
    discriminator: scope_kind
    variants:
      - kind: run
        state_values: [pending, captured, validating, gated, result_written, terminal]
      - kind: replay_case
        state_values: [proposed, fixtures_ready, executing, analyzed, terminal]
      - kind: gate_round
        state_values: [open, draft_received, evaluating, decision_written, restarted, terminal]
      - kind: evidence_bundle
        state_values: [building, signed, published, superseded, revoked]
    common_fields:
      schema_version:
        type: literal
        value: relay.scope_state.v1
        required: true
      scope_id:    { type: uuid, required: true }
      project_id:  { type: uuid, required: true }
      epoch:       { type: int_ge_zero, required: true }
      created_at:  { type: timestamptz, required: true }
      updated_at:  { type: timestamptz, required: true }

  IdempotencyRecord:
    schema_version: relay.idempotency_record.v1
    spec: A.12
    description: |
      Request dedupe record. idempotency_key is a Crockford-base32 ULID
      (26 chars, alphabet ^[0-9A-HJKMNP-TV-Z]{26}$ per spec B.2/B.6 line
      3517). request_digest reuses the canonical sha256-<hex> pattern
      (VAL-W1-014 inherits VAL-W1-009). schema_version pins to
      relay.idempotency_record.v1 (VAL-W1-050).
    fields:
      schema_version:
        type: literal
        value: relay.idempotency_record.v1
        required: true
      idempotency_key: { type: ulid, required: true }
      project_id:      { type: uuid, required: true }
      request_digest:  { type: sha256_hash, required: true }
      response_status: { type: int_ge_zero, required: true }
      response_ref:    { type: string, required: false, nullable: true }
      first_seen_at:   { type: timestamptz, required: true }
      expires_at:      { type: timestamptz, required: true }

  # ---------------------------------------------------------------------------
  # W1.3 evidence + replay envelopes
  # ---------------------------------------------------------------------------
  #
  # Spec anchors:
  #   J line 2798-2810   evidence_bundles DDL (verification_status column)
  #   A.16 lines 3331-3353 evidence_claims DDL (claim_type closed enum,
  #                        claim_digest sha256, signature non-empty,
  #                        supersedes_claim_id nullable UUID self-ref)
  #   A.8 lines 3131-3145 replay_cases DDL (status enum,
  #                        expected_assertion_ids list[str] default [],
  #                        failure_signature_hash required)
  #   A.8 lines 3147-3168 replay_fixtures DDL (kind / mode / side_effect_class
  #                        closed enums; allowed_in_replay bool default false;
  #                        refresh_policy default invalidate_on_signature_change)
  #   E.2 line 3913       capture_clock = wall-clock at fixture capture
  #   E.2 line 3914       refresh_policy {invalidate_on_signature_change,
  #                        hold_forever, refresh_weekly,
  #                        invalidate_on_model_version_change}
  #   E.3 lines 3928-3935 side_effect_class enumeration
  #   B.7 lines 3618-3621 schema versioning rules (Literal pin)
  #   K   lines 4394+     evidence bundle signature semantics
  #
  # VAL-W1-019 enum-lock-in (eng-plan-locked candidate set): spec J declares
  # the verification_status column but does NOT enumerate values. The
  # candidates the eng plan surfaced are {unverified, verified, tampered,
  # revoked}, which is the smallest set that round-trips through
  # sectionAB bundle verification:
  #   unverified  -> issued-by-signer but not yet verified by registry
  #   verified    -> signature + JCS + manifest digest all check out
  #   tampered    -> bundle digest does not match stored signature; integrity
  #                  broken
  #   revoked     -> signing key was revoked or bundle was administratively
  #                  retired (sectionK supersedes flow)
  # These four are locked here per /ops-plan worker direction; spec sectionJ
  # narrative amendment to enumerate them is queued post-v0.1.

  EvidenceBundle:
    schema_version: relay.evidence_bundle.v1
    spec: J
    description: |
      Signed evidence bundle row. Mirrors spec sectionJ table at line 2792-2810.
      bundle_digest is the canonical Relay sha256 wire form
      (sha256-<64 lowercase hex>) and is non-nullable (VAL-W1-018). The
      verification_status column is a closed enum
      {unverified, verified, tampered, revoked} (VAL-W1-019); see the
      enum-lock-in comment above.
    fields:
      schema_version:
        type: literal
        value: relay.evidence_bundle.v1
        required: true
      evidence_bundle_id:        { type: uuid, required: true }
      org_id:                    { type: uuid, required: true }
      project_id:                { type: uuid, required: true }
      scope_type:                { type: string, required: true }
      scope_id:                  { type: uuid, required: true }
      bundle_digest:             { type: sha256_hash, required: true }
      acef_core_version:         { type: string, required: true }
      relay_extension_version:   { type: string, required: true }
      signing_key_id:            { type: string, required: false, nullable: true }
      signature_algorithm:       { type: string, required: false, nullable: true }
      verification_status:
        type: enum
        values: [unverified, verified, tampered, revoked]
        required: true
      redaction_policy_version:  { type: string, required: true }
      manifest_commit_hash:      { type: sha256_hash, required: false, nullable: true }
      object_ref:                { type: string, required: true }
      supersedes_bundle_id:      { type: uuid, required: false, nullable: true }
      created_at:                { type: timestamptz, required: true }

  EvidenceClaim:
    schema_version: relay.evidence_claim.v1
    spec: A.16
    description: |
      Atomic claim inside an evidence bundle (spec sectionA.16 lines 3331-3353).
      claim_type is a closed eight-member enum (VAL-W1-020). claim_digest
      is the canonical sha256-<hex> wire form (VAL-W1-021). signature is a
      required, non-empty string. supersedes_claim_id is a nullable UUID
      self-reference; a non-UUID string MUST fail validation.
    fields:
      schema_version:
        type: literal
        value: relay.evidence_claim.v1
        required: true
      evidence_claim_id:           { type: uuid, required: true }
      evidence_bundle_id:          { type: uuid, required: true }
      claim_type:
        type: enum
        values:
          - run_result
          - gate_decision
          - contract_result
          - replay_result
          - human_oversight
          - incident
          - data_quality_check
          - provider_compatibility
        required: true
      subject_kind:                { type: string, required: true }
      subject_id:                  { type: uuid, required: true }
      claim_digest:                { type: sha256_hash, required: true }
      redaction_transform_version: { type: string, required: true }
      manifest_commit_hash:        { type: sha256_hash, required: true }
      signer_key_id:               { type: string, required: true }
      signature:                   { type: non_empty_string, required: true }
      supersedes_claim_id:         { type: uuid, required: false, nullable: true }
      created_at:                  { type: timestamptz, required: true }

  ReplayCase:
    schema_version: relay.replay_case.v1
    spec: A.8
    description: |
      Replay case row (spec sectionA.8 lines 3131-3145). status is a closed
      three-member enum (VAL-W1-022). expected_assertion_ids defaults to
      [] and accepts only non-empty string IDs (e.g. VAL-STRUCTURED-001
      shape). failure_signature_hash is required and non-empty.
    fields:
      schema_version:
        type: literal
        value: relay.replay_case.v1
        required: true
      replay_case_id:           { type: uuid, required: true }
      project_id:               { type: uuid, required: true }
      source_run_id:            { type: uuid, required: false, nullable: true }
      failure_signature_hash:   { type: non_empty_string, required: true }
      inputs_ref:               { type: string, required: true }
      inputs_digest:            { type: sha256_hash, required: true }
      expected_assertion_ids:
        type: list_non_empty_str
        required: false
        default: []
      human_reviewed:           { type: bool, required: false, default: false }
      reviewer_email:           { type: string, required: false, nullable: true }
      reviewed_at:              { type: timestamptz, required: false, nullable: true }
      status:
        type: enum
        values: [proposed, approved, retired]
        required: false
        default: proposed
      created_at:               { type: timestamptz, required: true }

  ReplayFixture:
    schema_version: relay.replay_fixture.v1
    spec: A.8
    description: |
      Replay fixture row (spec sectionA.8 lines 3147-3168, sectionE.2-E.3). kind, mode,
      and side_effect_class are closed enums (VAL-W1-023). allowed_in_replay
      defaults to false and MUST be a boolean (not coercible from string
      forms such as "true"). refresh_policy defaults to
      invalidate_on_signature_change and rejects out-of-set values
      (VAL-W1-025). capture_clock is RFC 3339 with a required timezone
      offset (VAL-W1-024, mirrors VAL-W1-017 discipline).
    fields:
      schema_version:
        type: literal
        value: relay.replay_fixture.v1
        required: true
      fixture_id:                 { type: uuid, required: true }
      replay_case_id:             { type: uuid, required: true }
      source_span_id:             { type: uuid, required: true }
      kind:
        type: enum
        values: [model_call, tool_call, retrieval, embedding, custom]
        required: true
      mode:
        type: enum
        values: [cassette, live, degraded_live, mock]
        required: true
      redaction_policy_version:   { type: string, required: true }
      input_digest:               { type: sha256_hash, required: true }
      output_ref:                 { type: string, required: false, nullable: true }
      output_digest:              { type: sha256_hash, required: false, nullable: true }
      provider:                   { type: string, required: false, nullable: true }
      model:                      { type: string, required: false, nullable: true }
      model_signature:            { type: string, required: false, nullable: true }
      capture_clock:              { type: timestamptz_offset_required, required: true }
      refresh_policy:
        type: enum
        values:
          - invalidate_on_signature_change
          - hold_forever
          - refresh_weekly
          - invalidate_on_model_version_change
        required: false
        default: invalidate_on_signature_change
      side_effect_class:
        type: enum
        values:
          - read_only
          - mutating
          - external_irreversible
          - approval_required
        required: true
      allowed_in_replay:
        type: strict_bool
        required: false
        default: false
      created_at:                 { type: timestamptz, required: true }

  EventLogEntry:
    schema_version: relay.event_log_entry.v1
    spec: A.11
    description: |
      Append-only audit trail row. Every state transition (spec C.4)
      emits one row. scope_type is a closed enum
      {run, replay, gate, eval_run, release, manifest, key, other}
      (VAL-W1-015). actor_kind is a closed enum
      {control_plane, gate_engine, worker, sdk, user, cron} (VAL-W1-016).
      occurred_at is RFC 3339 with a required timezone offset; naive
      timestamps fail (VAL-W1-017). schema_version pins to
      relay.event_log_entry.v1 (VAL-W1-051).
    fields:
      schema_version:
        type: literal
        value: relay.event_log_entry.v1
        required: true
      event_id:    { type: uuid, required: true }
      project_id:  { type: uuid, required: true }
      scope_type:
        type: enum
        values: [run, replay, gate, eval_run, release, manifest, key, other]
        required: true
      scope_id:    { type: uuid, required: true }
      event_type:  { type: string, required: true }
      actor_kind:
        type: enum
        values: [control_plane, gate_engine, worker, sdk, user, cron]
        required: true
      actor_id:              { type: uuid, required: false, nullable: true }
      manifest_commit_hash:  { type: sha256_hash, required: false, nullable: true }
      payload:               { type: any_object, required: false, default: {} }
      occurred_at:           { type: timestamptz_offset_required, required: true }
      ingest_sequence:       { type: int_ge_zero, required: true }

# -----------------------------------------------------------------------------
# Type definitions
# -----------------------------------------------------------------------------
#
# These define how the abstract YAML field types map to language-specific
# representations. The codegen pipeline (W1.5) reads this section to produce
# Pydantic Annotated[...] / TS type aliases.

types:
  uuid:         { python: "UUID", typescript: "string" }
  sha256_hash:
    python: 'Annotated[str, Field(pattern=r"^sha256-[0-9a-f]{64}$")]'
    typescript: "string"
    pattern: '^sha256-[0-9a-f]{64}$'
  ulid:
    python: 'Annotated[str, Field(pattern=r"^[0-9A-HJKMNP-TV-Z]{26}$")]'
    typescript: "string"
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
  timestamptz:  { python: "datetime", typescript: "string", format: "date-time" }
  timestamptz_offset_required:
    python: "datetime"
    typescript: "string"
    format: "date-time"
    constraint: "tzinfo required; naive timestamps rejected (VAL-W1-017)"
  int_ge_one:
    python: 'Annotated[int, Field(ge=1)]'
    typescript: "number"
    constraint: "ge=1"
  int_ge_zero:
    python: 'Annotated[int, Field(ge=0)]'
    typescript: "number"
    constraint: "ge=0"
  list_str:     { python: "list[str]", typescript: "string[]", default: [] }
  list_uuid:    { python: "list[UUID]", typescript: "string[]", default: [] }
  list_any:     { python: "list[Any]", typescript: "unknown[]", default: [] }
  any_object:
    python: "dict[str, Any]"
    typescript: "Record<string, unknown>"
    default: {}
  bool:         { python: "bool", typescript: "boolean" }
  string:       { python: "str", typescript: "string" }
  non_empty_string:
    python: 'Annotated[str, Field(min_length=1)]'
    typescript: "string"
    constraint: "min_length=1 (VAL-W1-021 signature, VAL-W1-022 failure_signature_hash)"
  list_non_empty_str:
    python: 'list[Annotated[str, Field(min_length=1)]]'
    typescript: "string[]"
    default: []
    constraint: "list of non-empty strings (VAL-W1-022 expected_assertion_ids)"
  strict_bool:
    python: 'bool'
    typescript: "boolean"
    constraint: "strict boolean; string forms 'true'/'false' rejected (VAL-W1-023 allowed_in_replay)"
