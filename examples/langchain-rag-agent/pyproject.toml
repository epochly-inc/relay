[project]
name = "relay-example-langchain-rag-agent"
version = "0.1.0"
description = "Relay v0.1 example: LangChain RAG-agent (Python entry point, Anthropic-backed)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Runtime dependencies for the example.
# - relay: the workspace Python SDK (W3) and adapters (W3.5)
# - anthropic: provider SDK for live mode (VAL-W16-024 backing model)
# - langchain-core: a minimal LangChain surface used for the
#   retriever / prompt assembly; the full LangChain adapter is
#   P1-deferred (see README "Adapter status" section per VAL-W16-007),
#   so the example uses manual SDK instrumentation around
#   langchain-core primitives.
# - pyyaml: used by main.py companion harnesses to read relay.manifest.yaml
dependencies = [
  "relay",
  "anthropic>=0.40.0",
  "langchain-core>=0.3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
# The example is invoked through the manifest-declared command surface
# (VAL-W16-018); this entry point is exposed as a console_script so the
# example can also be run directly during local development:
#   uv run relay-example-langchain-rag-agent --cassette
relay-example-langchain-rag-agent = "main:main"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python"]
