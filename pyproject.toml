# Relay v0.1 OSS - Python workspace root.
#
# Defines the uv workspace; per-package configuration lives in each
# packages/<pkg>/pyproject.toml. uv sync --all-packages installs every member.
#
# Per CLAUDE.md and .ops/manifest.yaml:
#   - Python 3.12+ required; CI matrix tests 3.12, 3.13, 3.14.
#   - ASCII-only source paths under packages/, apps/, scripts/, tests/.
#   - Schemas under packages/schemas/raw/ are the single source of truth;
#     the W1.5 codegen pipeline produces packages/schemas/python/ and
#     packages/schemas/typescript/ outputs and a CI drift check enforces sync.

[project]
name = "epochly-relay-workspace"
version = "0.0.0"
description = "Relay v0.1 OSS workspace root (not published)."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/schemas", "packages/sdk-python", "packages/cli", "packages/contracts", "apps/local-sidecar", "apps/replay-proxy"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  # W1.5 codegen output. Generated by packages/schemas/scripts/codegen.py;
  # drift check (VAL-W1-035) enforces byte-equal sync. Do NOT hand-edit; do
  # NOT auto-format via ruff (would itself trigger drift).
  "packages/sdk-python/relay/_generated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
  "packages/schemas/python/tests",
  "packages/sdk-python/tests",
  "packages/cli/tests",
  "packages/contracts/tests",
  "apps/local-sidecar/tests",
  "apps/replay-proxy/tests",
]
markers = [
  "plumbing: Tier 1 - offline, every commit, budget <= 60s",
  "smoke: Tier 2 - real APIs, every PR + nightly, budget <= 8min",
  "eval: Tier 3 - LLM-judged, nightly + pre-release, budget <= 12min",
  "replay_live: Live replay against real providers; never runs in CI",
  "cross_platform: Runs on the full 3 OS matrix",
  "fulfills(assertion_id): Bind a test to a contract assertion (VAL-W{N}-NNN)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pydantic",
  # CPython 3.14 deprecated asyncio.iscoroutinefunction; FastAPI 0.115 +
  # Starlette 0.48 still use it for route-handler detection. Upstream
  # tracker: fastapi/fastapi#13212. Filter scoped tightly to the
  # specific message + module so any unrelated deprecation still fails.
  "ignore:'asyncio.iscoroutinefunction' is deprecated and slated for removal:DeprecationWarning",
  # CPython 3.14 deprecated asyncio.get_event_loop_policy +
  # asyncio.set_event_loop_policy; pytest-asyncio 0.25 still calls
  # both in its event_loop_policy fixture's get/restore path. Upstream
  # tracker: pytest-dev/pytest-asyncio#1077. Filters scoped tightly to
  # the specific messages so any unrelated deprecation still fails.
  "ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal:DeprecationWarning",
  "ignore:'asyncio.set_event_loop_policy' is deprecated and slated for removal:DeprecationWarning",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.57.0",
]
