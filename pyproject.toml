# Relay v0.1 OSS - Python workspace root.
#
# Defines the uv workspace; per-package configuration lives in each
# packages/<pkg>/pyproject.toml. uv sync --all-packages installs every member.
#
# Per CLAUDE.md and .ops/manifest.yaml:
#   - Python 3.12+ required; CI matrix tests 3.12, 3.13, 3.14.
#   - ASCII-only source paths under packages/, apps/, scripts/, tests/.
#   - Schemas under packages/schemas/raw/ are the single source of truth;
#     the W1.5 codegen pipeline produces packages/schemas/python/ and
#     packages/schemas/typescript/ outputs and a CI drift check enforces sync.

[project]
name = "epochly-relay-workspace"
version = "0.0.0"
description = "Relay v0.1 OSS workspace root (not published)."
requires-python = ">=3.12"

[project.optional-dependencies]
# Documentation site dependencies (m4-f04, VAL-DOCS-M4-004).
#
# Install with: uv sync --extra docs
# Build with:   uv run mkdocs build --strict
# Serve with:   uv run mkdocs serve
#
# mkdocs                          : static site generator (>=1.6 required for
#                                   `exclude_docs` syntax used in mkdocs.yml)
# mkdocs-material                 : theme + navigation.indexes / .tabs feature
#                                   set referenced in mkdocs.yml `theme.features`
# mkdocstrings[python]            : Python SDK reference extraction (driving
#                                   off packages/sdk-python, packages/verifier,
#                                   packages/contracts source roots)
# mkdocs-minify-plugin            : HTML minification (mkdocs.yml plugins.minify)
# mkdocs-render-swagger-plugin    : renders packages/schemas/raw/openapi.yaml
#                                   into docs/reference/http-api/
# pymdown-extensions              : Mermaid fences (superfences), admonitions,
#                                   tabbed code blocks, snippets, etc.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-render-swagger-plugin>=0.1",
    "pymdown-extensions>=10.7",
]

[tool.uv.workspace]
members = ["packages/schemas", "packages/sdk-python", "packages/cli", "packages/contracts", "packages/gate", "packages/evals", "packages/explain", "packages/verifier", "packages/acef", "packages/replay-sandbox-protocol", "apps/local-sidecar", "apps/replay-proxy"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  # W1.5 codegen output. Generated by packages/schemas/scripts/codegen.py;
  # drift check (VAL-W1-035) enforces byte-equal sync. Do NOT hand-edit; do
  # NOT auto-format via ruff (would itself trigger drift).
  "packages/sdk-python/relay/_generated",
  # W11.1 vendored ACEF tree (chandlercvaughn/ACEF @ 57e1d14e). Byte-immutable
  # outside the vendor-update workflow; ruff lint or format would mutate the
  # tree and trip the vendor-drift guard (VAL-W11-001, VAL-W11-004).
  "packages/acef/upstream",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
  "packages/schemas/python/tests",
  "packages/sdk-python/tests",
  "packages/cli/tests",
  "packages/contracts/tests",
  "packages/gate/tests",
  "packages/evals/tests",
  "packages/explain/tests",
  "packages/verifier/tests",
  "packages/acef/tests",
  "packages/replay-sandbox-protocol/tests",
  "apps/local-sidecar/tests",
  "apps/replay-proxy/tests",
]
markers = [
  "plumbing: Tier 1 - offline, every commit, budget <= 60s",
  "smoke: Tier 2 - real APIs, every PR + nightly, budget <= 8min",
  "eval: Tier 3 - LLM-judged, nightly + pre-release, budget <= 12min",
  "replay_live: Live replay against real providers; never runs in CI",
  "cross_platform: Runs on the full 3 OS matrix",
  "fulfills(assertion_id): Bind a test to a contract assertion (VAL-W{N}-NNN)",
  "tier3: VAL-W9-021 canonical tier-3 marker; gated on RELAY_TIER3_RUNNER=linux-py3.14-node24",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pydantic",
  # CPython 3.14 deprecated asyncio.iscoroutinefunction; FastAPI 0.115 +
  # Starlette 0.48 still use it for route-handler detection. Upstream
  # tracker: fastapi/fastapi#13212. Filter scoped tightly to the
  # specific message + module so any unrelated deprecation still fails.
  "ignore:'asyncio.iscoroutinefunction' is deprecated and slated for removal:DeprecationWarning",
  # CPython 3.14 deprecated asyncio.get_event_loop_policy +
  # asyncio.set_event_loop_policy; pytest-asyncio 0.25 still calls
  # both in its event_loop_policy fixture's get/restore path. Upstream
  # tracker: pytest-dev/pytest-asyncio#1077. Filters scoped tightly to
  # the specific messages so any unrelated deprecation still fails.
  "ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal:DeprecationWarning",
  "ignore:'asyncio.set_event_loop_policy' is deprecated and slated for removal:DeprecationWarning",
  # CPython 3.14 added an unraisable warning when a sqlite3.Connection
  # is garbage-collected without an explicit close. Several transient
  # connections in the sidecar (quick_check, integrity_check, schema
  # version probe, WAL replay nudge) all close in `finally:` blocks,
  # but the warning can still surface when the GC reclaims a
  # short-lived connection a beat AFTER the `finally:` runs in some
  # cell-build orderings on the 3.14 runner. Scoped tightly to the
  # exact CPython 3.14 message + sqlite3 module so any unrelated
  # unraisable warning still fails. CPython tracker: bpo-117486.
  "ignore:Exception ignored while finalizing database connection:pytest.PytestUnraisableExceptionWarning",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.57.0",
    # W11.2 / VAL-W11-010: jsonschema validates each x-relay/* namespace
    # golden fixture against its Draft 2020-12 schema; required for the
    # plumbing-tier tests in packages/acef/tests/test_w11_2_*.py.
    "jsonschema>=4.21",
    # pytest-xdist enables `-n auto` parallel execution for the plumbing
    # tier. Without it, 3613 plumbing tests run serially in ~7m45s on a
    # local 8-core machine and >10min on CI runners (well over the spec
    # AM.6 60s budget). With -n auto on ubuntu-latest (4 cores) the run
    # completes in ~2-3 minutes -- still over the strict 60s budget but
    # safely under the workflow's timeout-minutes ceiling.
    # pyright is the static type checker invoked by the manifest `lint`,
    # `lint-python` commands (`uv run pyright`). It ships a bundled
    # node-based binary (resolved via the nodeenv dependency) so the only
    # external prerequisite is a Python interpreter; Node is already a
    # manifest-declared required tool. Floor pinned conservatively; the
    # lockfile records the resolved patch version.
    "pyright>=1.1.390",
    "pytest-xdist>=3.6",
]
