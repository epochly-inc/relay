# Relay OSS documentation site config (m4-f04, VAL-DOCS-M4-004).
#
# This file is the single source of truth for the published Relay docs site.
# `docs/` contains the markdown corpus authored across milestones M1-M4 of the
# relay-docs-v1-20260522 operation. The `internal/` and `release/` subtrees
# are deliberately excluded from `nav` per boundaries.md (private content).
#
# Tooling stack (locked):
#   * MkDocs Material theme
#   * mkdocstrings (Python SDK reference via docstring extraction)
#   * mkdocs-render-swagger-plugin (renders packages/schemas/raw/openapi.yaml
#     into docs/reference/http-api/)
#   * pymdown-extensions (Mermaid diagrams, admonitions, tabbed code blocks)
#   * mkdocs-minify-plugin (HTML minification for static-site delivery)
#
# Local build:
#   uv sync --extra docs
#   uv run mkdocs build --strict
#
# Cite the spec section in the page footer for every page that derives from
# the spec. Banned product copy (compliant / certified / AI Act-approved) is
# enforced by scripts/lint-banned-copy.py, NOT by mkdocs itself.

site_name: Relay Documentation
site_url: https://epochly-inc.github.io/relay/
site_description: >-
  Relay is an agent reliability OS. Evidence-bound run records, deterministic
  replay, CEL contracts, and offline-verifiable bundles for AI agent systems.
site_author: epochly-inc
repo_url: https://github.com/epochly-inc/relay
repo_name: epochly-inc/relay
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Copyright (c) 2026 Epochly Inc. Licensed Apache 2.0.

validation:
  nav:
    omitted_files: info       # ~200 error-code pages intentionally not in nav
    not_found: warn
    absolute_links: warn
  links:
    not_found: info           # demoted; other-feature content-page links
    absolute_links: warn
    unrecognized_links: info  # ../reference/cli/ style trailing-slash links

# Files under docs/ that are not part of the published nav. Workers in M1-M3
# wrote internal-only and release-only material under these prefixes; they
# stay in the repo for reviewers but are not part of the user-facing site.
#
# Fix #10 (roborev 348, structural-review B, codex): contracts/_examples/
# and how-to/_examples/ were previously excluded but published pages link
# directly to those YAML fixtures (writing-assertions.md links
# _examples/assertion-example.yaml + _examples/manifest-example.yaml;
# integrate-ci-github-actions.md links _examples/relay-gate.yml). Dropping
# them from exclude_docs lets MkDocs serve the assets so those links
# resolve in the published site instead of 404.
exclude_docs: |
  internal/
  release/
  /.DS_Store
  **/.gitkeep

# Strict mode: any unrecognized nav reference or missing file fails the build.
# CI (.github/workflows/docs.yml, m4-f05) runs with --strict.
#
# `validation` block below demotes two classes of issue to INFO so they do not
# fail --strict while still surfacing in the build log:
#
#   1. `nav.omitted_files`: error-code reference pages live at
#      docs/reference/errors/RELAY-*/index.md (one per code, ~200 pages); they
#      are linked from per-domain how-to guides and indexed via search rather
#      than enumerated in nav. Adding 200 nav entries would bury the reader.
#   2. `links.not_found`: a small number of cross-doc links in content pages
#      owned by other features (m1, m2) reference source paths outside the
#      docs/ tree (e.g., ../../packages/verifier/src/... and ../../SECURITY.md).
#      Those will be tightened by per-page fix features; mkdocs --strict is
#      this config's gate, not other workers' content audits.
#
# `validation.nav.absolute_links` stays at the default WARN level because that
# class of issue IS a config-level signal worth catching here.

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: false
      minify_css: false
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - packages/sdk-python
            - packages/verifier/src
            - packages/contracts/src
          options:
            show_source: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            merge_init_into_class: true
            docstring_style: google
  - render_swagger:
      allow_arbitrary_locations: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  # NOTE: filename must NOT start with a dot. MkDocs excludes dotfiles
  # from the built site/ output, so a `.banners.css` reference resolves
  # in source but 404s in the built site (lychee linkcheck catches it).
  - reference/http-api/banners.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/epochly-inc/relay
  generator: false

