<svg viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How Relay works: capture, replay, evaluate, sign, verify</title>
  <desc id="desc">Five stations of a Relay agent run: Record, Replay, Evaluate, Sign, Verify. Captures every model call, replays deterministically, gates on CEL contracts, signs the result, and verifies offline.</desc>

  <rect width="1280" height="480" fill="#FFFFFF"/>

  <text x="80" y="58" font-size="13" font-weight="700" fill="#0F766E" letter-spacing="2">RELAY  /  AGENT RUN PIPELINE</text>
  <text x="80" y="98" font-size="30" font-weight="700" fill="#0F172A" letter-spacing="-0.7">Capture every step. Replay it deterministically.</text>
  <text x="80" y="130" font-size="30" font-weight="700" fill="#0F172A" letter-spacing="-0.7">Sign the evidence.</text>

  <line x1="280" y1="280" x2="1080" y2="280" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3,5"/>
  <g fill="#94A3B8">
    <path d="M286,275 L300,280 L286,285 Z"/>
    <path d="M486,275 L500,280 L486,285 Z"/>
    <path d="M686,275 L700,280 L686,285 Z"/>
    <path d="M886,275 L900,280 L886,285 Z"/>
    <path d="M1066,275 L1080,280 L1066,285 Z"/>
  </g>

  <g>
    <rect x="80" y="180" width="200" height="200" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="180" cy="222" r="22" fill="#0F766E"/>
    <text x="180" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    <text x="180" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="2">RECORD</text>
    <text x="180" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Every call captured</text>
    <text x="180" y="328" text-anchor="middle" font-size="12" fill="#475569">model, tool, retrieval</text>
    <text x="180" y="358" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">SDK + loopback sidecar</text>
  </g>
  <g>
    <rect x="300" y="180" width="200" height="200" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="400" cy="222" r="22" fill="#0F766E"/>
    <text x="400" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    <text x="400" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="2">REPLAY</text>
    <text x="400" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Deterministically</text>
    <text x="400" y="328" text-anchor="middle" font-size="12" fill="#475569">against modified code</text>
    <text x="400" y="358" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">cassette-first, sandboxed</text>
  </g>
  <g>
    <rect x="520" y="180" width="200" height="200" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="620" cy="222" r="22" fill="#0F766E"/>
    <text x="620" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="620" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="2">EVALUATE</text>
    <text x="620" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Contracts decide</text>
    <text x="620" y="328" text-anchor="middle" font-size="12" fill="#475569">pass or fail, not the LLM</text>
    <text x="620" y="358" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">CEL + Relay UDFs</text>
  </g>
  <g>
    <rect x="740" y="180" width="200" height="200" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="840" cy="222" r="22" fill="#0F766E"/>
    <text x="840" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
    <text x="840" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="2">SIGN</text>
    <text x="840" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">One evidence bundle</text>
    <text x="840" y="328" text-anchor="middle" font-size="12" fill="#475569">artifacts + commit + trace</text>
    <text x="840" y="358" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">Sigstore + SLSA L3</text>
  </g>
  <g>
    <rect x="960" y="180" width="200" height="200" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
    <circle cx="1060" cy="222" r="22" fill="#B45309"/>
    <text x="1060" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">5</text>
    <text x="1060" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309" letter-spacing="2">VERIFY</text>
    <text x="1060" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Offline. No account.</text>
    <text x="1060" y="328" text-anchor="middle" font-size="12" fill="#475569">your CI, your auditor</text>
    <text x="1060" y="358" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">rly verify ./bundle.acef</text>
  </g>

  <line x1="80" y1="420" x2="1200" y2="420" stroke="#F1F5F9" stroke-width="1"/>
  <text x="80" y="448" font-size="12" fill="#64748B">Every gate decision binds artifact hashes, command exit codes, trace span IDs, contract assertion IDs, and the manifest commit.</text>
  <text x="80" y="466" font-size="12" fill="#64748B">Reproducible from the bundle alone.  No language model is asked whether its own behavior was correct.</text>
</svg>
